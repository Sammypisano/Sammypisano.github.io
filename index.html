<title>Health and Fitness Hub</title>
<style>
:root{
  --bg:#0e0d14; --card:#1a1526; --card2:#241b33; --line:rgba(255,255,255,.08);
  --txt:#f3eefa; --dim:#9d92b3; --dim2:#645a78;
  --pink:#ff3d77; --orange:#ff7a3d; --accent:#ff9d69; --green:#3ddc97;
  --grad:linear-gradient(90deg,#ff7a3d,#ff3d77);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#000;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--txt); -webkit-font-smoothing:antialiased;}
#phone{max-width:444px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:linear-gradient(175deg,#1a1023 0%,#12101c 40%,#0e0d14 100%) fixed;
  position:relative;display:flex;flex-direction:column;overflow:hidden;}
@media(min-width:500px){#phone{border-left:1px solid #241b33;border-right:1px solid #241b33;}}
/* ---- COMPUTER DASHBOARD: a real board layout, not the phone app widened.
   Header bar with actions, then a three-panel grid: vitals rail | calendar | food intel. ---- */
@media(min-width:760px){
  body.wide #phone{max-width:1380px;border:none;}
  body.wide #scr-dash .topbar{display:none;}
  body.wide #scr-dash .page-pad{padding:4px 26px 34px;}
  body.wide .prevbar{width:calc(100% - 52px);margin:12px 26px 0;}
}
.dtop{display:flex;align-items:center;gap:18px;padding:20px 2px 16px;flex-wrap:wrap;}
.dtitle{font-size:25px;font-weight:900;letter-spacing:-.02em;}
.dsub{font-size:12.5px;color:var(--dim);font-weight:700;margin-top:3px;}
.dactions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.dbtn{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:12px;color:var(--txt);
  font-family:inherit;font-size:12.5px;font-weight:800;padding:11px 16px;cursor:pointer;}
.dbtn.primary{background:linear-gradient(90deg,#ff7a3d,#ff3d77);border:none;color:#fff;box-shadow:0 6px 18px rgba(255,61,119,.35);}
.dgrid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;align-items:start;}
.dgrid3{display:grid;grid-template-columns:minmax(285px,345px) minmax(330px,1fr) minmax(295px,370px);gap:16px;align-items:start;}
@media(max-width:1120px){ body.wide .dgrid3{grid-template-columns:1fr 1fr;} body.wide .dgrid3 .dcol:nth-child(3){grid-column:1/-1;} }
body.wide .fab{display:none;}
body.wide #dashcontent *{cursor:default !important;}
.dcol>*{margin-bottom:14px;}
.dcol .mgcard{margin-left:0;margin-right:0;}
.dfoods{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:4px;}
@media(max-width:900px){
  body.wide .dfoods{grid-template-columns:1fr;}
}

.screen{flex:1;overflow-y:auto;padding-bottom:150px;display:none;}
.screen.active{display:block;}

/* ===== typography ===== */
.disp{font-style:normal;font-weight:800;letter-spacing:-.02em;}
.gradtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;}
.dim{color:var(--dim);}
.small{font-size:12px;}

/* ===== top bar ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff7a3d,#ff3d77);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.myplan{font-size:15px;font-weight:700;color:var(--txt);}
.myplan span{color:var(--dim);font-weight:400;}

/* ===== workout header ===== */
.whead{padding:10px 16px 4px;}
.wtitle-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wtitle{font-size:24px;line-height:1.15;}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:22px;padding:7px 14px;
  font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;}
.pill.pink{background:rgba(255,122,61,.14);color:var(--accent);border:1px solid rgba(255,122,61,.4);}
.pill.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--line);}
.pill.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);font-weight:600;font-size:12.5px;padding:8px 13px;}
.dots{background:none;border:none;color:var(--dim);font-size:20px;letter-spacing:1px;cursor:pointer;
  padding:4px 8px;font-family:inherit;}
.wsub{color:var(--dim);font-size:13.5px;margin-top:6px;font-weight:500;}

/* ===== exercise list ===== */
.exlist{padding:6px 16px 0;position:relative;}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 12px;position:relative;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:9px;}
.exrow .thumbwrap{position:relative;flex-shrink:0;}
.exthumb{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2a1f38,#181322);
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.07);}
.exthumb svg.big-fig{height:42px;}
.musclechip{display:none;}
.exmeta{flex:1;min-width:0;}
.exname{font-weight:750;font-size:15px;line-height:1.25;}
.exsum{color:var(--dim);font-size:12.5px;margin-top:3px;font-weight:500;}
.exdone-badge{color:var(--green);font-size:12px;font-weight:700;margin-top:2px;}
.vline{display:none;}
.ring{width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
.ring b{background:#171223;border-radius:50%;width:26px;height:26px;display:flex;
  align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.circuit-head{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;
  font-weight:700;text-transform:none;padding:10px 0 8px;}
.circuit-head .loop{color:var(--accent);font-size:15px;}
.addex{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--accent);
  font-weight:700;font-size:15px;cursor:pointer;}
.addex .plus{width:50px;height:50px;border-radius:50%;border:1.5px dashed rgba(255,122,61,.45);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);}

/* ===== bottom fixed ===== */
.bottomfix{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:444px;
  background:linear-gradient(transparent, #0d0d12 40%);padding:24px 16px 8px;z-index:40;}
.startbtn{width:100%;background:linear-gradient(90deg,#ff7a3d,#ff3d77);border:none;color:#fff;font-family:inherit;
  font-size:16px;font-weight:800;padding:15px;border-radius:26px;cursor:pointer;
  box-shadow:0 8px 28px rgba(255,61,119,.35);}
.startbtn.finish{background:var(--green);color:#0d0d12;box-shadow:0 6px 24px rgba(61,220,151,.3);}
.tabbar{display:flex;background:rgba(14,13,20,.92);border-top:1px solid rgba(255,255,255,.06);margin:10px -16px 0;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  color:#5d5570;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:4px 0;}
.tab svg{width:22px;height:22px;fill:currentColor;}
.tab.active{color:var(--accent);}

/* ===== sheet (exercise editor) ===== */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;}
.sheet-backdrop.open{display:block;}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(103%);bottom:0;width:100%;max-width:444px;
  background:var(--bg);border-radius:18px 18px 0 0;z-index:51;max-height:92vh;max-height:92dvh;
  display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.3,.9,.3,1);}
.sheet.open{transform:translateX(-50%) translateY(0);}
.sheet-scroll{overflow-y:auto;padding-bottom:120px;}
.sheet-hero{height:150px;background:linear-gradient(160deg,#2a1830, #151020 70%);border-radius:18px 18px 0 0;
  position:relative;display:flex;align-items:center;justify-content:center;}
.sheet-hero svg{height:110px;opacity:.85;}
.sheet-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(20,20,28,.8);border:1px solid #2b2b36;color:var(--txt);font-size:15px;cursor:pointer;}
.sheet-body{padding:14px 16px 0;}
.sheet-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sheet-name{font-size:22px;}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chiprow .pill{flex-shrink:0;}
.notebox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:13px;color:var(--dim);margin-top:10px;width:100%;font-family:inherit;resize:none;}
.circuit-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;
  padding:5px 11px;font-size:12px;font-weight:700;color:var(--dim);margin-top:10px;}

/* set rows */
.setlist{margin-top:12px;position:relative;}
.setrow{display:flex;align-items:center;gap:12px;padding:7px 0;}
.hex{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--dim);cursor:pointer;position:relative;
  border-radius:50%;background:rgba(255,255,255,.07);}
.hex.active{background:linear-gradient(135deg,#ff7a3d,#ff3d77);color:#fff;}
.hex.done{background:var(--green);color:#0d0d12;}
.setfields{display:flex;gap:10px;flex:1;}
.field{flex:1;position:relative;}
.field input{width:100%;background:transparent;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;
  color:var(--txt);font-size:16px;font-weight:700;padding:13px 12px 9px;
  font-family:inherit;outline:none;}
.field.ghost input{border-color:transparent;background:rgba(255,255,255,.04);color:var(--dim2);}
.field label{position:absolute;top:-7px;left:10px;background:#141020;padding:0 5px;border-radius:4px;
  font-size:10.5px;color:var(--dim);font-weight:600;display:none;}
.setrow.focus .field label{display:block;}
.setrow.focus .field input{border-color:rgba(255,122,61,.55);background:transparent;color:var(--txt);}
.setrow.done-row .field input{color:var(--green);border-color:transparent;background:rgba(61,220,151,.08);}
.fieldcap{font-size:10.5px;color:var(--dim2);margin-top:3px;padding-left:12px;}
.addset{display:flex;align-items:center;gap:12px;color:var(--pink);font-weight:750;font-size:14.5px;
  padding:10px 0;cursor:pointer;}
.addset .hex{background:transparent;border:1.5px dashed rgba(255,122,61,.45);border-radius:50%;
  color:var(--accent);height:34px;}
.addset{color:var(--accent);}
.ratebox{margin-top:14px;background:var(--card);border-radius:12px;padding:14px;}
.ratebox h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px;}
.ratebox .opts{display:flex;gap:8px;flex-wrap:wrap;}
.rateopt{background:#22222c;border:1.5px solid transparent;border-radius:18px;color:var(--dim);
  padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.rateopt.sel{border-color:var(--pink);color:var(--txt);background:rgba(230,40,90,.12);}

/* ===== history screen ===== */
.hist{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:444px;
  background:var(--bg);z-index:60;display:none;flex-direction:column;}
.hist.open{display:flex;}
.hist-top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
.backbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  color:var(--pink);font-size:16px;cursor:pointer;flex-shrink:0;}
.hist-title{flex:1;text-align:center;font-weight:800;font-size:16px;padding-right:46px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seg{display:flex;background:var(--card);border-radius:22px;margin:8px 16px;padding:3px;}
.seg button{flex:1;border:none;border-radius:19px;background:transparent;color:var(--dim);
  font-weight:700;font-size:13.5px;padding:9px;cursor:pointer;font-family:inherit;}
.seg button.sel{background:#3a3a46;color:var(--txt);}
.hist-scroll{flex:1;overflow-y:auto;padding:6px 16px 40px;}
.sess{padding:14px 0 6px;}
.sess-date{font-size:21px;margin-bottom:10px;}
.badge-pill{display:inline-block;background:var(--pink);color:#fff;border-radius:16px;
  padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}
.rate-pill{display:inline-block;border:1.5px solid #3a3946;color:var(--txt);border-radius:16px;
  padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}
.sess-label{color:var(--dim);font-size:12.5px;font-weight:600;margin:8px 0 4px;}
.sess-set{display:flex;align-items:center;gap:12px;padding:5px 0;font-weight:700;font-size:15px;}
.sess-set .hex{cursor:default;width:28px;height:32px;font-size:12px;}
.est{margin-top:10px;}
.est .lbl{color:var(--dim);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
.est .val{font-size:16px;font-weight:800;margin-top:3px;}
.est .val span{color:var(--pink);font-weight:700;font-size:13px;}
.sess-note{margin-top:8px;color:var(--dim);font-size:13px;}
.sess-note b{color:var(--txt);font-size:12.5px;display:block;margin-bottom:2px;}
.sess-hr{border:none;border-top:1px solid #1e1e28;margin:14px 0 0;}

/* trends cards */
.tcard{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;}
.tcard-top{display:flex;justify-content:space-between;align-items:center;}
.tcard-top h4{margin:0;font-size:15px;font-weight:750;}
.tcard-top .chev{color:var(--dim2);}
.tcard .big{font-size:30px;margin-top:8px;}
.tcard .big span{font-size:14px;color:var(--txt);font-weight:700;}
.tcard .logged{color:var(--dim);font-size:12px;margin-top:3px;}
.tcard .chartwrap{margin-top:10px;}
.tcard .foot{text-align:center;color:var(--dim2);font-size:11px;margin-top:6px;}

/* ===== modal / action sheet ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:70;display:none;
  align-items:flex-end;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--card);width:100%;max-width:444px;border-radius:18px 18px 0 0;
  max-height:75vh;display:flex;flex-direction:column;}
.modal h3{margin:0;padding:18px 18px 8px;font-size:17px;}
.modal .mlist{overflow-y:auto;padding:6px 10px 26px;}
.mitem{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer;}
.mitem:active{background:#252530;}
.mitem .mi-name{font-weight:700;font-size:15px;flex:1;}
.mitem .mi-sub{color:var(--dim);font-size:12px;margin-top:2px;}
.mitem .check{color:var(--pink);font-weight:800;}
.mitem.danger .mi-name{color:#ff5f76;}

/* ===== toast ===== */
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#2a2a36;color:var(--txt);padding:11px 20px;border-radius:24px;font-size:13.5px;
  font-weight:700;opacity:0;transition:all .3s;z-index:90;pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.5);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== body / targets / log tabs ===== */
.page-pad{padding:6px 16px;}
.h1{font-size:24px;margin:10px 0 2px;}
.bgroup{background:var(--card);border-radius:14px;margin-top:12px;overflow:hidden;}
.bg-head{padding:13px 15px;font-weight:800;font-size:16px;display:flex;align-items:baseline;gap:8px;
  border-left:4px solid var(--orange);}
.bg-head .d{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600;background:#26262f;
  padding:3px 9px;border-radius:14px;}
.bpart{padding:11px 15px;border-top:1px solid #23232d;}
.bpart .pname{font-weight:750;font-size:14px;}
.bpart .ptag{color:var(--green);font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;margin-left:6px;}
.bpart .pdesc{color:var(--dim);font-size:12.5px;margin-top:3px;}
.bpart .pex{color:var(--txt);font-size:12.5px;font-weight:600;margin-top:3px;}
.rulerow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;
  padding:13px 15px;margin-top:10px;}
.rulerow .rep{font-size:19px;font-weight:800;color:var(--accent);min-width:44px;}
.rulerow .rmeta{flex:1;}
.rulerow .rt{font-weight:750;font-size:14px;}
.rulerow .rs{color:var(--dim);font-size:12.5px;margin-top:2px;}
.pillrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.gpill{background:rgba(255,122,61,.12);border:1px solid rgba(255,122,61,.4);color:var(--accent);
  border-radius:18px;padding:6px 13px;font-size:12.5px;font-weight:700;}
.logday{background:var(--card);border-radius:14px;padding:14px 15px;margin-top:12px;}
.logday .ld-date{font-size:17px;}
.logday .ld-w{color:var(--dim);font-size:13px;margin-top:3px;font-weight:600;}
.logday .ld-ex{margin-top:8px;font-size:13px;color:var(--dim);}
.logday .ld-ex b{color:var(--txt);}
.emptybox{color:var(--dim);font-size:13.5px;background:var(--card);border-radius:12px;
  padding:16px;margin-top:12px;line-height:1.5;}
.tinybtns{display:flex;gap:8px;margin-top:14px;}
.tinybtn{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:16px;
  padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ===== body tab: results ===== */
.ohead{display:flex;align-items:center;gap:8px;margin-top:18px;}
.ohead .h1{margin:0;}
.ohead .info{width:22px;height:22px;border-radius:50%;background:#2a2a34;color:var(--dim);
  font-size:12px;display:flex;align-items:center;justify-content:center;}
.ohead .chev-pink{margin-left:auto;color:var(--pink);font-size:22px;font-weight:800;}
.orow{display:flex;align-items:center;gap:16px;margin-top:8px;}
.oscore{font-size:56px;font-style:italic;font-weight:800;letter-spacing:-.03em;}
.ostrip{display:flex;gap:5px;flex:1;}
.obar{flex:1;max-width:16px;height:48px;background:rgba(255,255,255,.07);transform:skewX(-16deg);border-radius:3px;}
.obar.fill{background:linear-gradient(180deg,#ff7a3d,#ff3d77);}
.mgcard{background:var(--card);border-radius:16px;margin-top:14px;padding:2px 15px 4px;}
.mghead{display:flex;align-items:center;gap:9px;padding:13px 0 11px;}
.mghead .gname{font-weight:800;font-size:16px;}
.trendpill{background:rgba(255,122,61,.18);color:var(--accent);border-radius:12px;padding:1px 8px;font-size:11px;font-weight:800;}
.mghead .gscore{color:var(--dim);font-size:13px;font-weight:600;}
.mghead .gscore b{color:var(--txt);font-style:italic;font-size:15px;font-weight:800;}
.mrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #23232d;cursor:pointer;}
.mrow .mmeta{width:96px;}
.mrow .mname{font-weight:700;font-size:14px;}
.mrow .mscore{font-size:27px;font-style:italic;font-weight:800;margin-top:2px;}
.mrow .spark{flex:1;display:flex;justify-content:flex-end;}
.mrow .chev{color:var(--dim2);font-size:18px;}
.benchcard{background:linear-gradient(150deg,#2c1a33,#161020 65%);border:1px solid rgba(255,255,255,.06);
  border-radius:16px;margin-top:12px;padding:16px;position:relative;overflow:hidden;}
.benchcard .bl-label{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:800;text-transform:uppercase;}
.benchcard .bl-sub{font-size:12px;color:var(--dim);margin-top:6px;}
.benchcard .bl-val{font-size:30px;font-style:italic;font-weight:800;margin-top:2px;}
.benchcard .bl-val span{font-size:13px;font-weight:700;}
.benchcard .bl-fig{position:absolute;right:10px;top:10px;opacity:.5;}

/* body tab: drill-in */
.mseg{display:flex;background:var(--card);border-radius:22px;margin:4px 0 14px;padding:3px;}
.mseg button{flex:1;border:none;border-radius:19px;background:transparent;color:var(--dim);
  font-weight:700;font-size:12px;padding:8px 2px;cursor:pointer;font-family:inherit;}
.mseg button.sel{background:#3a3a46;color:var(--txt);}
.rangehead{font-size:34px;font-style:italic;font-weight:800;}
.rangehead span{font-size:13px;color:var(--dim);font-weight:700;font-style:normal;}
.rangesub{color:var(--dim);font-size:13px;margin-top:2px;}
.statrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border-radius:14px;padding:15px 16px;margin-top:10px;font-weight:700;font-size:14.5px;}
.statrow b{font-size:15px;}
.explain{margin-top:22px;}
.explain h3{font-style:italic;font-weight:800;font-size:22px;margin:0 0 8px;}
.explain p{color:var(--dim);font-size:14px;line-height:1.55;margin:0;}

/* body tab: recovery */
.recstats{display:flex;justify-content:space-between;margin-top:16px;gap:10px;}
.recstat .num{font-size:40px;font-style:italic;font-weight:800;}
.recstat .cap{font-size:10px;letter-spacing:.09em;color:var(--dim);font-weight:800;text-transform:uppercase;max-width:110px;line-height:1.4;}
.recfig{display:flex;justify-content:center;margin-top:6px;position:relative;}
.recfig svg{height:380px;}
.flipbtn{position:absolute;left:6px;bottom:6px;width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer;}
.reclegend{display:flex;gap:14px;justify-content:center;margin-top:10px;color:var(--dim);font-size:11.5px;font-weight:700;}
.reclegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;}
.mh-row{display:flex;align-items:center;gap:12px;padding:9px 0;}
.mh-row .exthumb{width:52px;height:52px;}
.mh-ago{font-size:10.5px;letter-spacing:.08em;color:var(--dim);font-weight:800;text-transform:uppercase;}
.mh-name{font-weight:750;font-size:15px;margin-top:2px;}
.mh-sets{color:var(--dim);font-size:12.5px;margin-top:2px;}
#storagewarn{display:none;background:#2b2030;color:#d9a0e8;font-size:12px;padding:9px 16px;}
/* ===== daily cycle flow ===== */
#flowroot{padding:2px 16px 40px;}
.locpill{font-size:11px;font-weight:800;color:var(--accent);background:rgba(255,122,61,.13);
  border:1px solid rgba(255,122,61,.4);border-radius:14px;padding:4px 11px;}
.fsteps{display:flex;gap:6px;margin-top:14px;}

km 2-3 weeks before race day, then taper. Every 4th week cut it back ~25% \u2014 that down week is not optional. Pace: easy and conversational the whole way. Eat at maintenance today (~2,700-2,800) with extra carbs around the run.", "exercises": [{"name": "Long Run", "weight_note": null, "target": null, "rest": null, "note": "Easy, conversational pace the whole way. Time on feet builds endurance, not speed. Track in km.", "sets": [{"duration": "60:00"}]}]}], "histories": {}, "muscleRef": {"meta": {"owner": "SP", "created": "2026-07-29", "updated": "2026-07-29 \u2014 added training plan format (trainingplan copy.html): 7-day week, rep ranges, runs, rules, nutrition, supplements", "source": "musclereference.html + musclereference_1.html (v2 adds 'Your Physique Read' \u2014 check-in video analysis, July 2026)", "purpose": "Master database for suggesting workouts that SP logs into a Fitbod-style app replica. Goal: break the progress stall by pushing intensity/volume progression instead of repeating the same sets/reps/weight.", "status": "Reference + physique read + goals ingested. This is what every suggested workout must target."}, "physique_read": {"context": "From SP's check-in video, July 2026. Height 6'0\"-6'2\", weight 185 lb.", "region_by_region": {"face_neck": "Lean. No fat storage here \u2014 sign overall body fat is moderate, not high.", "chest": "Upper chest flat below the collarbone \u2014 clavicular head is the clear gap. Some base in mid pec, no chest fat. This is why incline work leads both chest days.", "belly_waist": "The one real fat store: soft lower belly below the navel, love handles wrapping the sides. Upper abs close to showing already \u2014 the lower zone needs the deficit. Roughly upper-teens to ~20% body fat overall; 'shredded' means getting this zone to ~12%.", "arms": "Slim, minimal fat \u2014 little to cut, only muscle to add. Biceps and triceps both lack mass; forearms thin. Faint vein hints near wrist and inner elbow mean vascularity is waiting under a thin fat layer \u2014 build brachioradialis/brachialis and it will surface.", "shoulders": "Narrow-reading frame because side delts are undeveloped \u2014 caps don't yet round outward past the joint. Biggest visual multiplier available: every inch here makes the waist look smaller.", "back": "Lean \u2014 spine and shoulder blades visible, so definition will show quickly as muscle comes. Lats narrow, don't yet flare from the armpit; mid-back thickness light. Big growth runway.", "posture": "Nothing alarming on video. Rear-delt and mid-back work is protective anyway, given 6 pressing-heavy days."}, "overall_read": "Leaner than the scale suggests \u2014 weight sits on a tall frame, fat concentrated in one stubborn zone (lower belly/love handles) rather than spread everywhere. Classic last-to-go fat storage; the mirror will change disproportionately fast once that zone starts draining.", "real_limiter": "MUSCLE, not fat. Visible mass is light for 2+ years of training \u2014 most visibly arms, side delts, lats. Dieting alone would make SP smaller, not shredded. The plan is a RECOMPOSITION: build muscle while slowly cutting 185 -> 170-175 lb at ~0.5 lb/week, roughly 3-5 months of runway, matching the half-marathon block."}, "goals_and_focus_points": {"ordered_focus": [{"rank": 1, "focus": "Progressive overload", "detail": "The most likely gap given training age vs visible mass. Log every lift; if weight or reps aren't climbing month over month, fix that before touching anything else. This single habit outweighs every supplement combined."}, {"rank": 2, "focus": "Arms, side delts, lats", "detail": "The three thinnest areas and the entire path to veiny arms and the V-taper. The plan biases them: 22+ direct arm sets per week, lateral raises as the priority shoulder move, width-first back work."}, {"rank": 3, "focus": "Small deficit, high protein", "detail": "~2,350 cal, 180 g protein, maintenance calories on long-run days. A crash cut at this leanness burns the muscle being built and leaves you flat and softer-looking \u2014 opposite of the goal."}, {"rank": 4, "focus": "Patience on the belly zone", "detail": "Lower-belly and love-handle fat is hormonally last to leave for most men. No exercise targets it, no supplement burns it; the deficit drains it on its own schedule. Upper abs show first, handles go last \u2014 don't mistake that order for failure."}, {"rank": 5, "focus": "Track with photos, not the mirror", "detail": "Same lighting, same poses as the check-in video, every 3-4 weeks. Recomposition can look like nothing day to day while monthly photos show clear change."}], "nutrition": {"calories": 2350, "protein_g": 180, "note": "Maintenance calories on long-run days", "weight_target": "185 -> 170-175 lb at ~0.5 lb/week over 3-5 months"}, "cardio_context": "Half-marathon training block runs concurrently \u2014 plan runs 3-5 months to match it.", "weekly_volume_targets": {"direct_arm_sets": "22+", "shoulder_priority": "Lateral raises lead shoulder day", "back_bias": "Width-first (lats before mid-back)"}}, "progression_philosophy": {"problem": "Progress stalled because workouts repeat the same volume (e.g., biceps curls at 5 sets / 30 total reps every session). No overload = no adaptation.", "principle": "Every session should push past the last one \u2014 more sets, more reps, or more weight. Example given: move from 5 sets/30 reps to 7 sets/40 reps and keep climbing to improve weight production and endurance.", "rep_intensity_rules": [{"reps_achieved": "10+", "meaning": "Too easy at this weight", "action": "Increase the weight"}, {"reps_achieved": "8-9", "meaning": "Almost to max", "action": "Close to the right load; push toward 10+ then bump weight"}, {"reps_achieved": "5-7", "meaning": "Medium hard", "action": "Solid working weight; grind for more reps each session"}, {"reps_achieved": "3-4", "meaning": "Hard, truly pushing", "action": "Heavy strength work; stay here only intentionally"}], "tracking_requirement": "Track exactly what Fitbod tracks per exercise: sets, reps per set, weight, and session-over-session progression."}, "training_split": {"day1": ["Chest", "Triceps"], "day2": ["Shoulders", "Forearms", "Abs"], "day3": ["Back", "Biceps"], "day4": ["Quads", "Hamstrings", "Calves"], "day5": ["Chest", "Back"], "day6": ["Triceps", "Biceps"]}, "muscle_groups": [{"group": "Chest", "days": [1, 5], "tier": "upper", "parts": [{"name": "Upper chest (clavicular head)", "priority": "PRIORITY", "why": "Creates the shelf under the collarbone \u2014 the head most guys under-build.", "how_to_train": "Incline press at 30-45 degrees.", "exercises": ["Incline press (30-45\u00b0)"]}, {"name": "Mid / lower chest (sternal head)", "priority": "standard", "why": "The bulk of the muscle; grows from any horizontal pressing.", "how_to_train": "Flat pressing and dips.", "exercises": ["Flat press", "Dips"]}, {"name": "Stretch work (method, not a head)", "priority": "method", "why": "Stretched-position training drives growth.", "how_to_train": "Deep, controlled flys.", "exercises": ["Deep controlled flys"]}]}, {"group": "Triceps", "days": [1, 6], "tier": "upper", "parts": [{"name": "Long head", "priority": "PRIORITY", "why": "Roughly half the arm's mass. Only fully stretches with the arm overhead or behind you \u2014 pushdowns miss it.", "how_to_train": "Overhead extensions.", "exercises": ["Overhead triceps extensions"]}, {"name": "Lateral head", "priority": "standard", "why": "The horseshoe outline that reads as 'defined arms' when lean.", "how_to_train": "Pushdowns.", "exercises": ["Triceps pushdowns"]}, {"name": "Medial head", "priority": "no direct work needed", "why": "Fires in every triceps movement.", "how_to_train": "Covered automatically by all triceps work.", "exercises": []}]}, {"group": "Shoulders", "days": [2], "tier": "mid", "parts": [{"name": "Side (lateral) delt", "priority": "TOP PRIORITY", "why": "Widens the frame and creates the V-taper that makes the waist look smaller.", "how_to_train": "Lateral raises \u2014 no momentum.", "exercises": ["Lateral raises (strict, no momentum)"]}, {"name": "Rear delt", "priority": "standard (chronically undertrained)", "why": "Rounds the shoulder from the side, fixes posture.", "how_to_train": "Reverse flys and face pulls.", "exercises": ["Reverse flys", "Face pulls"]}, {"name": "Front delt", "priority": "minimal", "why": "Already hammered by all chest pressing.", "how_to_train": "One overhead press is plenty.", "exercises": ["Overhead press (one movement is enough)"]}]}, {"group": "Forearms", "days": [2], "tier": "mid", "parts": [{"name": "Brachioradialis", "priority": "PRIORITY (the vein muscle)", "why": "Thumb-side mass that gives the forearm its size \u2014 the cephalic vein runs right over it.", "how_to_train": "Hammer and reverse curls, not wrist curls.", "exercises": ["Hammer curls", "Reverse curls"]}, {"name": "Wrist flexors / extensors", "priority": "standard", "why": "Underside and top-side thickness, plus grip.", "how_to_train": "Wrist curls, farmer carries, dead hangs.", "exercises": ["Wrist curls", "Farmer carries", "Dead hangs"]}]}, {"group": "Abs", "days": [2], "tier": "mid", "parts": [{"name": "Lower region", "priority": "PRIORITY", "why": "Where fat sits and where the last definition shows up.", "how_to_train": "Hanging leg raises, reverse crunches.", "exercises": ["Hanging leg raises", "Reverse crunches"]}, {"name": "Upper region", "priority": "standard", "why": "Same sheet of muscle, biased by trunk flexion.", "how_to_train": "Cable crunches.", "exercises": ["Cable crunches"]}, {"name": "Obliques", "priority": "shape only", "why": "Train for shape only. Oblique work does not burn love-handle fat \u2014 only the calorie deficit does that.", "how_to_train": "Light oblique work for shape.", "exercises": ["Oblique work (shape only)"]}]}, {"group": "Back", "days": [3, 5], "tier": "mid", "parts": [{"name": "Lats", "priority": "PRIORITY", "why": "Width and the V-taper \u2014 same waist-shrinking trick as side delts.", "how_to_train": "Pull-ups and pulldowns.", "exercises": ["Pull-ups", "Lat pulldowns"]}, {"name": "Mid-back (rhomboids, mid traps)", "priority": "standard", "why": "Thickness and posture.", "how_to_train": "Rows, with a squeeze at the end.", "exercises": ["Rows (squeeze at the end)"]}, {"name": "Upper traps", "priority": "no direct work needed", "why": "The neck-to-shoulder slope. Covered by rows and deadlifts at this stage.", "how_to_train": "Covered by rows and deadlifts.", "exercises": []}]}, {"group": "Biceps", "days": [3, 6], "tier": "mid", "parts": [{"name": "Long head", "priority": "standard", "why": "Creates the peak. Biased with the arm behind the body.", "how_to_train": "Incline dumbbell curls.", "exercises": ["Incline dumbbell curls"]}, {"name": "Short head", "priority": "standard", "why": "Inner width. Biased with elbows forward.", "how_to_train": "Preacher and spider curls.", "exercises": ["Preacher curls", "Spider curls"]}, {"name": "Brachialis", "priority": "SLEEPER", "why": "Sits underneath the biceps and pushes the whole arm up and out as it grows.", "how_to_train": "Hammer and reverse curls \u2014 same moves as the forearm work.", "exercises": ["Hammer curls", "Reverse curls"]}]}, {"group": "Quads", "days": [4], "tier": "lower", "parts": [{"name": "Vastus lateralis", "priority": "standard", "why": "The outer sweep \u2014 the visual one.", "how_to_train": "Squats, leg press, lunges.", "exercises": ["Squats", "Leg press", "Lunges"]}, {"name": "Rectus femoris", "priority": "needs direct work", "why": "Crosses the hip, so it barely works in squats.", "how_to_train": "Leg extensions specifically.", "exercises": ["Leg extensions"]}]}, {"group": "Hamstrings", "days": [4], "tier": "lower", "parts": [{"name": "Hip extension function", "priority": "PRIORITY", "why": "Loads the hamstring in a deep stretch \u2014 elite for growth, and best insurance against running injuries.", "how_to_train": "Romanian deadlifts.", "exercises": ["Romanian deadlifts"]}, {"name": "Knee flexion function", "priority": "standard", "why": "Seated leg curls beat lying \u2014 greater stretch on the muscle.", "how_to_train": "Seated leg curls.", "exercises": ["Seated leg curls"]}]}, {"group": "Calves", "days": [4], "tier": "lower", "parts": [{"name": "Gastrocnemius", "priority": "standard", "why": "The visible diamond. Works with a straight knee.", "how_to_train": "Standing raises, full stretch, paused \u2014 not bouncy half-reps.", "exercises": ["Standing calf raises (full stretch, paused)"]}, {"name": "Soleus", "priority": "low (covered by running)", "why": "Underneath. Works with a bent knee. Running supplies plenty of this.", "how_to_train": "Seated raises if needed.", "exercises": ["Seated calf raises"]}]}], "top_six_focus": {"note": "If only these were trained right, most of the visual difference at SP's size would be there.", "muscles": ["Upper chest", "Side delts", "Long-head triceps", "Brachialis / brachioradialis", "Lats", "Lower abs"], "through_line": "Width up top (lats, side delts) makes the waist look smaller; arm mass plus low body fat makes veins show; no amount of ab work removes the fat sitting on top of them."}, "training_plan": {"title": "Training Plan \u2014 Recomp + Half Marathon", "subtitle": "6 lifting days \u00b7 3 runs \u00b7 race late November \u00b7 goal: lean out, build arms, finish strong", "format_rule": "Workouts are written as Sets x Rep-Range (e.g. 4 x 6-10). Log actual reps; when the top of the range is hit on all sets, add weight.", "running_sessions": ["Tempo/intervals. The one quality run. 20-30 min comfortably-hard, or intervals (e.g. 5 x 3 min hard / 2 min easy). Builds speed and lactate threshold.", "Easy run. 25-40 min, fully conversational. Aerobic volume with almost no recovery cost.", "Long run. The key session. Builds progressively to 18-19 km, 2-3 weeks before race day, then taper. Every 4th week cut it back ~25%. Never move a hard run next to leg day. Final 2 weeks: taper both."], "universal_rules": ["Progressive overload is the whole game. Log your lifts. If weight or reps aren't creeping up over months, nothing else matters.", "Train hard \u2014 0-2 reps in reserve on the last set of each exercise. Stop 1-2 short of failure on compounds; take isolations closer.", "Rest 2-3 min on heavy compounds, 60-90 sec on isolation work.", "Control the eccentric (2-3 sec lowering) and get a full stretch at the bottom. Stretched-position work drives growth.", "Sleep 7-9 hours. Running + heavy lifting is a real load; recovery is where adaptation happens."], "nutrition_detail": {"macros": {"protein_g": 180, "carbs_g": 250, "fat_g": 70, "calories": 2350}, "rules": ["Protein is the non-negotiable \u2014 180 g every single day. Carbs and fat can flex.", "Long-run days: eat at maintenance ~2,700-2,800 with extra carbs around the run.", "Weigh a few mornings a week, use the average. Target ~0.5 lb/week down. If flat 2-3 weeks, cut 150-200 cal from carbs or fat \u2014 never protein."], "protein_anchors": "Whey scoop ~25 g \u00b7 8 oz chicken ~50 g \u00b7 6 oz lean beef ~40 g \u00b7 3 eggs ~18 g \u00b7 cup Greek yogurt ~20 g"}, "supplements": ["Creatine monohydrate \u2014 5 g daily, any time, every day including rest days. The only one that reliably moves the needle.", "Whey protein \u2014 as needed to reach 180 g.", "L-citrulline \u2014 6-8 g, 30-60 min pre-workout, training days only. Pump/vascularity. Optional.", "Vitamin D3 ~1,000-2,000 IU and omega-3 ~1-2 g EPA/DHA \u2014 general health.", "Caffeine 100-200 mg pre-workout if tolerated.", "SKIP: fat burners, BCAAs, test boosters, arginine, branded 'NO booster' blends."]}, "exercise_library": [{"group": "Chest", "key": "chest", "parts": [{"part": "Upper (clavicular) \u2014 PRIORITY", "exercises": [{"name": "Incline Press 30-45\u00b0", "equip": "Barbell/DB", "rank": 1}, {"name": "Incline Dumbbell Press", "equip": "Dumbbell", "rank": 3}, {"name": "Low-Incline DB Press", "equip": "Dumbbell"}, {"name": "Incline Machine Press", "equip": "Machine"}, {"name": "Incline Smith Press", "equip": "Smith"}, {"name": "Low-to-High Cable Fly", "equip": "Cable"}, {"name": "Reverse-Grip Bench Press", "equip": "Barbell"}]}, {"part": "Mid / lower (sternal)", "exercises": [{"name": "Flat Dumbbell Press", "equip": "Dumbbell"}, {"name": "Flat Barbell Bench Press", "equip": "Barbell"}, {"name": "Hammerstrength Chest Press", "equip": "Machine"}, {"name": "Machine Chest Press", "equip": "Machine", "rank": 2}, {"name": "Dips", "equip": "Bodyweight", "rank": 5}, {"name": "Decline Bench Press", "equip": "Barbell"}, {"name": "Weighted Push-ups", "equip": "Bodyweight"}]}, {"part": "Stretch work", "exercises": [{"name": "Cable Fly", "equip": "Cable", "rank": 4}, {"name": "Pec Deck", "equip": "Machine"}, {"name": "Machine Fly", "equip": "Machine"}, {"name": "Deep Dumbbell Fly", "equip": "Dumbbell"}]}]}, {"group": "Triceps", "key": "triceps", "parts": [{"part": "Long head \u2014 PRIORITY", "exercises": [{"name": "Overhead Cable Extension", "equip": "Cable", "rank": 1}, {"name": "Overhead Rope Extension", "equip": "Cable"}, {"name": "Seated Overhead DB Extension", "equip": "Dumbbell", "rank": 4}, {"name": "Skullcrusher", "equip": "EZ Bar", "rank": 2}, {"name": "Incline Skullcrusher", "equip": "EZ Bar"}, {"name": "Cross-Body Cable Extension", "equip": "Cable"}]}, {"part": "Lateral head", "exercises": [{"name": "Rope Pushdown", "equip": "Cable", "rank": 3}, {"name": "Straight-Bar Pushdown", "equip": "Cable"}, {"name": "Single-Arm Pushdown", "equip": "Cable"}, {"name": "Dumbbell Kickback", "equip": "Dumbbell"}]}, {"part": "All heads / heavy", "exercises": [{"name": "Close-Grip Bench Press", "equip": "Barbell", "rank": 5}, {"name": "Machine Tricep Dip", "equip": "Machine"}, {"name": "Bench Dips (weighted)", "equip": "Bodyweight"}, {"name": "JM Press", "equip": "Barbell"}]}]}, {"group": "Shoulders", "key": "shoulders", "parts": [{"part": "Side delt \u2014 TOP PRIORITY", "exercises": [{"name": "Lateral Rai
