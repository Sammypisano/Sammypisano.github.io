, {"name": "Outside Bicep Curl", "equip": "Dumbbell"}, {"name": "Bayesian Cable Curl", "equip": "Cable", "rank": 2}]}, {"part": "Short head (inner width)", "exercises": [{"name": "Preacher or Cable Curl", "equip": "EZ/Cable"}, {"name": "Preacher Curl", "equip": "EZ Bar", "rank": 3}, {"name": "Spider Curl", "equip": "Dumbbell"}, {"name": "Concentration Curl", "equip": "Dumbbell"}, {"name": "Machine Bicep Curl", "equip": "Machine"}]}, {"part": "Brachialis \u2014 SLEEPER", "exercises": [{"name": "Hammer Curl", "equip": "Dumbbell"}, {"name": "Reverse Curl", "equip": "EZ Bar/Cable"}, {"name": "Zottman Curl", "equip": "Dumbbell"}]}, {"part": "General mass", "exercises": [{"name": "EZ-Bar Curl", "equip": "EZ Bar", "rank": 4}, {"name": "Barbell Curl", "equip": "Barbell"}, {"name": "Seated Dumbbell Curl", "equip": "Dumbbell"}]}]}, {"group": "Quads", "key": "quads", "parts": [{"part": "Vastus lateralis (outer sweep)", "exercises": [{"name": "Squat or Leg Press", "equip": "BB/Machine", "rank": 4}, {"name": "Barbell Back Squat", "equip": "Barbell"}, {"name": "Hack Squat", "equip": "Machine", "rank": 1}, {"name": "Bulgarian Split Squat", "equip": "Dumbbell", "rank": 5}, {"name": "Walking Lunges", "equip": "Dumbbell"}, {"name": "Goblet Squat", "equip": "Dumbbell"}, {"name": "Smith Machine Squat", "equip": "Smith", "rank": 3}]}, {"part": "Rectus femoris (needs isolation)", "exercises": [{"name": "Leg Extension", "equip": "Machine", "rank": 2}, {"name": "Sissy Squat", "equip": "Bodyweight"}, {"name": "Reverse Nordic Curl", "equip": "Bodyweight"}]}]}, {"group": "Hamstrings", "key": "hamstrings", "parts": [{"part": "Hip extension \u2014 PRIORITY", "exercises": [{"name": "Romanian Deadlift", "equip": "Barbell", "rank": 2}, {"name": "Dumbbell RDL", "equip": "Dumbbell"}, {"name": "Single-Leg RDL", "equip": "Dumbbell"}, {"name": "Good Morning", "equip": "Barbell"}, {"name": "45\u00b0 Back Extension", "equip": "Bodyweight", "rank": 3}]}, {"part": "Knee flexion (seated > lying)", "exercises": [{"name": "Seated Leg Curl", "equip": "Machine", "rank": 1}, {"name": "Lying Hamstrings Curl", "equip": "Machine", "rank": 5}, {"name": "Nordic Curl", "equip": "Bodyweight", "rank": 4}, {"name": "Glute-Ham Raise", "equip": "Bodyweight"}]}]}, {"group": "Glutes", "key": "glutes", "parts": [{"part": "Compound / bridge", "exercises": [{"name": "Barbell Hip Thrust", "equip": "Barbell", "rank": 1}, {"name": "Machine Hip Thrust", "equip": "Machine", "rank": 2}, {"name": "Glute Bridge", "equip": "Bodyweight"}, {"name": "Cable Kickback", "equip": "Cable"}, {"name": "Bulgarian Split Squat", "equip": "Dumbbell"}, {"name": "Machine Hip Abduction", "equip": "Machine", "rank": 3}]}]}, {"group": "Calves", "key": "calves", "parts": [{"part": "Gastrocnemius (straight knee)", "exercises": [{"name": "Standing Calf Raise", "equip": "Machine", "rank": 1}, {"name": "Smith Machine Calf Raise", "equip": "Smith"}, {"name": "Single-Leg Calf Raise", "equip": "Dumbbell"}, {"name": "Leg Press Calf Press", "equip": "Machine", "rank": 2}, {"name": "Donkey Calf Raise", "equip": "Machine"}]}, {"part": "Soleus (bent knee \u2014 running covers it)", "exercises": [{"name": "Seated Calf Raise", "equip": "Machine", "rank": 3}]}]}], "best_exercises": {"Chest": {"top": [{"rank": 1, "name": "Incline Press 30-45\u00b0", "why": "~30\u00b0 incline is the EMG-verified sweet spot for the clavicular head (Rodr\u00edguez-Ridao 2020); heavy + stable. His #1 chest lift.", "part": "Upper chest"}, {"rank": 2, "name": "Machine Chest Press", "why": "High stability lets you train to near-failure safely with easy overload (Nippard S+ pick).", "part": "Whole pec"}, {"rank": 3, "name": "Incline Dumbbell Press", "why": "Deeper bottom stretch than barbell \u2014 stretch-mediated growth advantage, upper-pec bias.", "part": "Upper + mid"}, {"rank": 4, "name": "Cable Fly", "why": "Tension held in the stretched position; flys grow pecs comparably to presses (Henselmans) without triceps fatigue. Pec deck equivalent.", "part": "Sternal / stretch"}, {"rank": 5, "name": "Dips", "why": "Large loaded stretch at long muscle length; good secondary press.", "part": "Lower/sternal"}], "priority_pick": "Upper chest: 30\u00b0 incline press + low-to-high cable fly \u2014 the only common isolation matching the clavicular fiber direction. Above ~45\u00b0 the front delt takes over.", "modifiers": "Incline 30\u00b0 (max 45\u00b0) \u00b7 elbows ~45\u00b0, not flared \u00b7 full deep stretch \u00b7 lengthened partials after failure are legit."}, "Triceps": {"top": [{"rank": 1, "name": "Overhead Cable Extension", "why": "Maeo 2023: overhead training grew triceps ~1.4x more than pushdowns (+28.5% vs +19.6% long head) \u2014 strongest single-exercise finding in upper-body literature.", "part": "Long head"}, {"rank": 2, "name": "Skullcrusher", "why": "Lower the bar behind the head \u2014 adds shoulder flexion and long-head stretch (Nippard S-tier).", "part": "Long + lateral"}, {"rank": 3, "name": "Rope Pushdown", "why": "Best short-position complement; stable and easy to progress.", "part": "Lateral + medial"}, {"rank": 4, "name": "Seated Overhead DB Extension", "why": "Same overhead mechanism, unilateral option, shoulder-friendly for tall frames.", "part": "Long head"}, {"rank": 5, "name": "Close-Grip Bench Press", "why": "Heavy compound mass builder \u2014 but pressing barely grows the long head, so overhead work stays essential.", "part": "Lateral + medial"}], "priority_pick": "Long head: overhead cable extension, full elbow bend at the bottom. Cable > dumbbell (constant tension in the stretch).", "modifiers": "Max stretch matters more than lockout \u00b7 face away from stack, staggered stance \u00b7 lengthened partials work well here."}, "Shoulders": {"top": [{"rank": 1, "name": "Cable Lateral Raise", "why": "Constant tension including the bottom/stretch where dumbbells give none; 2025 RCT shows equal growth to DBs \u2014 cables win on tension profile.", "part": "Side delt"}, {"rank": 2, "name": "Lateral Raise", "why": "Equal growth per 2025 head-to-head; cheap volume, easy to push to failure; lean-away adds bottom tension.", "part": "Side delt"}, {"rank": 3, "name": "Machine Rear Delt Fly", "why": "Reverse pec deck is the best-supported rear-delt isolation \u2014 locked path, full-ROM tension (Nippard S-tier over face pulls).", "part": "Rear delt"}, {"rank": 4, "name": "Seated DB Overhead Press", "why": "Seated/supported beats standing for hypertrophy (more pressing overload, Saeterbakken 2013). One press is plenty for him.", "part": "Front delt"}, {"rank": 5, "name": "Face Pull", "why": "Rear/side delt + lower trap + cuff health in one accessory slot.", "part": "Rear + side"}], "priority_pick": "Side delts: cable lateral raise as the anchor, DB laterals second \u2014 12-20 reps near failure; total hard sets drive width. Pressing alone never builds them.", "modifiers": "Raise in scapular plane (~20-30\u00b0 forward), lead with the elbow \u00b7 bottom-half is the money \u2014 bottom-half partials after failure \u00b7 rear delt flys: arms ~30-45\u00b0 from torso, don't turn it into a row."}, "Back": {"top": [{"rank": 1, "name": "Pull-up or Lat Pulldown", "why": "Medium/neutral grip pulldown: S-tier stretch + tension + progression; medium grip \u2248 wide for lat EMG with better loading (Andersen 2014).", "part": "Lats (width)"}, {"rank": 2, "name": "Pull-up", "why": "Highest absolute tension; near-identical lat EMG to pulldowns; add weight past ~10-12 reps.", "part": "Lats"}, {"rank": 3, "name": "Chest-Supported Row", "why": "Nippard's #1 back exercise: stability removes low-back limits; full protract-retract drives trap/rhomboid growth.", "part": "Mid-back"}, {"rank": 4, "name": "Cross-Body Lat Pull-Around", "why": "Loads the lat in its most stretched line of pull with constant cable tension \u2014 the outer-sweep builder.", "part": "Lower/outer lats"}, {"rank": 5, "name": "Seated Cable Row", "why": "Smooth resistance, deep stretch; elbow path (not grip) sets lat vs upper-back bias.", "part": "Lats or mid-back"}, {"rank": 6, "name": "Meadows Row", "why": "Extreme unilateral lat stretch (S-tier); straight-arm pulldown as no-biceps lat accessory.", "part": "Lats"}], "priority_pick": "Lat width: medium-grip pulldown + weighted pull-ups, with bottom-half lengthened partials from full stretch when strength stalls. Deadlifts are C-tier for width.", "modifiers": "Medium grip (~1.5x shoulder), not extreme wide \u00b7 overhand/neutral keeps it lat-dominant \u00b7 rows: elbows ~30-45\u00b0 tucked = lats, flared = rear delt/rhomboids \u00b7 slight 15-20\u00b0 lean-back on pulldowns, bar to upper chest."}, "Biceps": {"top": [{"rank": 1, "name": "Incline Dumbbell Curl", "why": "2025 trial: more biceps growth (especially proximal/peak region) than preacher curls \u2014 shoulder extension stretches the long head.", "part": "Long head (peak)"}, {"rank": 2, "name": "Bayesian Cable Curl", "why": "Same stretched long-head mechanics with constant cable tension; at worst equal to preacher (2025 RCT).", "part": "Long head"}, {"rank": 3, "name": "Preacher Curl", "why": "MRI work: more distal-biceps, brachialis and brachioradialis growth than incline curls \u2014 the mass-near-the-elbow builder.", "part": "Short head + brachialis"}, {"rank": 4, "name": "EZ-Bar Curl", "why": "Supinated grip maximizes biceps EMG (+12-19% vs neutral); heavy, simple base builder.", "part": "Both heads"}, {"rank": 5, "name": "Cable Curl", "why": "Low-pulley curl stepped forward keeps tension in the bottom stretch \u2014 lengthened-bias training showed ~89% greater CSA gain vs mixed.", "part": "Whole biceps"}], "priority_pick": "Peak: incline dumbbell curl (only exercise with direct longitudinal evidence of superior proximal-biceps growth). Keep the elbow behind the torso line.", "modifiers": "Full supination, pinky-up \u00b7 slow eccentrics are cheap extra stimulus \u00b7 majority stretch-position curls + one preacher slot for brachialis."}, "Forearms": {"top": [{"rank": 1, "name": "Reverse Curl", "why": "Pronation sidelines the biceps, shifting load to brachioradialis + brachialis \u2014 RP's go-to vein-muscle move.", "part": "Brachioradialis"}, {"rank": 2, "name": "Hammer Curl", "why": "Neutral grip allows heavier loads = more total tension on brachioradialis/brachialis.", "part": "Brachioradialis + brachialis"}, {"rank": 3, "name": "Cross-Body Hammer Curl", "why": "Cross-body path further biases brachialis; rotate with strict hammers.", "part": "Brachialis"}, {"rank": 4, "name": "Behind-Back Wrist Curl", "why": "Cable/roller-style dynamic loading beats DB wrist curls (RP: dynamic > isometric for size).", "part": "Wrist flexors"}, {"rank": 5, "name": "Wrist Extensions", "why": "Extensors sit on the visible top/outer forearm next to the brachioradialis; recover fast, tolerate 5-10 sets/wk.", "part": "Wrist extensors"}], "priority_pick": "Vein muscle: heavy hammer curls + preacher curls (the pair with actual MRI growth data for brachialis/brachioradialis) + reverse curls for pronated volume.", "modifiers": "Thumbless grip on reverse curls \u00b7 slow eccentrics \u00b7 forearms at session end, 10-20 reps \u00b7 leanness makes the veins show \u2014 training builds what pops."}, "Abs": {"top": [{"rank": 1, "name": "Cable Crunch", "why": "Only common ab move with true progressive loading through full spinal flexion (Nippard #1), 8-15 reps.", "part": "Whole rectus (upper bias)"}, {"rank": 2, "name": "Hanging Leg Raise", "why": "Top rectus EMG across studies \u2014 but curl the pelvis up (posterior tilt), don't just lift legs.", "part": "Lower bias"}, {"rank": 3, "name": "Reverse Crunch", "why": "Preferentially activates the lower segment when initiated by posterior pelvic tilt (Sarti et al.).", "part": "Lower"}, {"rank": 4, "name": "Ab Wheel Rollout", "why": "High rectus EMG under anti-extension load with tension in the lengthened position.", "part": "Whole"}, {"rank": 5, "name": "Weighted Side Bend", "why": "#1 oblique EMG by a wide margin; loadable for shape.", "part": "Obliques"}], "priority_pick": "Lower abs: regional bias is PARTIALLY real \u2014 it works only via posterior-pelvic-tilt movements (reverse crunch, hanging raise curling pelvis up). No exercise burns the fat over them.", "modifiers": "Load abs like any muscle: 8-15 reps near failure, add weight over time. 50+ bodyweight reps = endurance, not growth."}, "Quads": {"top": [{"rank": 1, "name": "Hack Squat", "why": "Machine stability = near-failure training with deep-stretch tension, no low-back limit; ideal for tall lifters (Nippard S-tier).", "part": "All vasti"}, {"rank": 2, "name": "Leg Extension", "why": "The only common lift that grows the rectus femoris (Maeo 2018); reclining the seatback ~40\u00b0 grows it more (Larsen 2024).", "part": "Rectus femoris"}, {"rank": 3, "name": "Smith Machine Squat", "why": "Deep squats (~120\u00b0 knee) grew quads significantly more than shallow (Bloomquist 2013); Smith keeps a tall torso upright.", "part": "Vasti"}, {"rank": 4, "name": "Squat or Leg Press", "why": "Low+narrow feet, deep ROM = lengthened vasti loading with near-zero systemic cost \u2014 the best runner-compatible heavy slot.", "part": "Vasti"}, {"rank": 5, "name": "Bulgarian Split Squat", "why": "Big loaded stretch + fixes runner asymmetries \u2014 but the most soreness-costly; keep 48h+ from hard runs.", "part": "Vasti + glutes"}], "priority_pick": "Runner-friendly core: leg press + leg extensions carry volume in race-build weeks; one heavy hack/Smith squat slot stays.", "modifiers": "Depth beats load (\u2265120\u00b0 knee flexion) \u00b7 recline the leg-extension seatback \u00b7 heel elevation helps tall lifters \u00b7 low narrow feet on press = quads."}, "Hamstrings": {"top": [{"rank": 1, "name": "Seated Leg Curl", "why": "Maeo 2021: ~50% more hamstring growth than lying curls (14% vs 9%) \u2014 hips flexed = biarticular hamstrings lengthened. Best runner-friendly pick.", "part": "All heads"}, {"rank": 2, "name": "Romanian Deadlift", "why": "Long-length hip hinge biasing BF long head + semimembranosus (the heads curls miss) + hamstring-strain insurance for running.", "part": "Long head"}, {"rank": 3, "name": "45\u00b0 Back Extension", "why": "Same long-length hip-extension stimulus as RDL with far less spinal/systemic load.", "part": "Long head"}, {"rank": 4, "name": "Nordic Curl", "why": "~50% hamstring-strain risk reduction in runners + real growth; introduce at tiny volume, 8+ weeks out from race.", "part": "Semitendinosus"}, {"rank": 5, "name": "Lying Hamstrings Curl", "why": "Still productive; slightly different regional bias \u2014 variation, not default.", "part": "Distal"}], "priority_pick": "Seated curl is the flagship stretch-hypertrophy finding \u2014 lean the torso slightly forward over the pads for even more stretch. RDLs: 1 hard session/week, day after (not before) the hardest run.", "modifiers": "Squats/leg presses do NOT grow hamstrings \u2014 dedicated work is non-negotiable \u00b7 RDL: stop at end-range stretch, the bottom half is the money."}, "Glutes": {"top": [{"rank": 1, "name": "Barbell Hip Thrust", "why": "Plotkin 2023 RCT: equal glute growth to squats \u2014 wins for a runner on near-zero soreness/axial fatigue.", "part": "Whole glute max"}, {"rank": 2, "name": "Machine Hip Thrust", "why": "Same stimulus, faster setup.", "part": "Glute max"}, {"rank": 3, "name": "Machine Hip Abduction", "why": "The only listed move that grows glute MEDIUS (squats/thrusts don't) \u2014 directly tied to runner's-knee/ITB resilience.", "part": "Glute medius"}], "priority_pick": "Your squats + RDLs already cover glute max (equal growth per RCT). The highest-ROI addition for a runner is glute-med abduction work.", "modifiers": "Full lockout with posterior pelvic tilt \u00b7 lean torso forward on abductions \u00b7 pick glute work by recovery cost, not burn."}, "Calves": {"top": [{"rank": 1, "name": "Standing Calf Raise", "why": "Kinoshita 2023: standing grew the gastrocnemius ~2-3x more than seated (12% vs 2%) \u2014 straight knee keeps it lengthened.", "part": "Gastrocnemius"}, {"rank": 2, "name": "Leg Press Calf Press", "why": "Kassiano 2023: bottom-half partials at long length grew calves MORE than full ROM (15% vs 7%) \u2014 easy to load the stretch here.", "part": "Gastroc + soleus"}, {"rank": 3, "name": "Seated Calf Raise", "why": "Soleus-only \u2014 and your 3 runs/week already hammer the soleus. Skip or 1-2 maintenance sets.", "part": "Soleus"}], "priority_pick": "Standing raises with a 2-3 second dead-stop pause in the deep stretch \u2014 kills the Achilles rebound so the muscle takes the tension; doubles as tendon conditioning for running.", "modifiers": "Full stretch matters far more than the top \u2014 never cut the bottom \u00b7 slow 2-3s eccentric \u00b7 train calves after runs or on easy days, never before intervals/long run."}}, "best_exercises_sources": ["Maeo 2023 \u2014 overhead vs neutral triceps extension, Eur J Sport Sci", "Maeo 2021 \u2014 seated vs lying leg curl hypertrophy", "Kinoshita 2023 \u2014 standing vs seated calf raise, Frontiers in Physiology", "Kassiano 2023 \u2014 long-length partial calf training, JSCR", "Rodr\u00edguez-Ridao 2020 \u2014 bench incline angle EMG (30\u00b0 clavicular peak)", "Plotkin 2023 \u2014 hip thrust vs squat glute growth, Frontiers in Physiology", "Frontiers 2025 \u2014 dumbbell vs cable lateral raise RCT (equal growth)", "2025 incline vs preacher curl trial \u2014 more proximal biceps growth from incline", "Preacher-vs-Bayesian curl RCT 2025 \u2014 preacher grows brachialis (~10%)", "Bloomquist 2013 \u2014 deep vs shallow squat quad growth", "Larsen 2024 \u2014 reclined leg-extension seatback grows rectus femoris more", "PeerJ 2024/25 + Ulster meta \u2014 lengthened partials \u2265 full ROM in trained lifters", "Andersen 2014 \u2014 pulldown grip width EMG (medium \u2248 wide)", "Schumann 2022 meta \u2014 concurrent running doesn't blunt hypertrophy when managed", "Schoenfeld / Sarti \u2014 lower-rectus bias via posterior pelvic tilt (partial support)", "Sources compiled via Stronger By Science, RP Strength, Henselmans, Nippard tier lists, BarBend research summaries"], "replica_design_rules": ["WORKOUT TAB REDESIGN \u2014 mockups APPROVED, still not coded. Do NOT touch app code until SP says go.", "Screen 1 \u00b7 Gym location picker: The Rec or EOS. Drives everything downstream.", "Screen 2 \u00b7 Day picker: Day 1-7 list, cycle-aware (done days checked, next day pre-selected, any day tappable).", "Screen 3 \u00b7 Default workout + change level: four OPTIONAL buttons (Keep 0, Small 0-1, Some 1-2, Big 2-4). NOTHING SELECTED = default schedule; a selection = changed schedule. Bottom button is GENERATE.", "Screen 4 \u00b7 Exercise detail (tap any exercise): hero + How-To + Rest timer/History/Replace chips on top; below that a 'Last Exercise \u00b7 <name>' block (renamed from Fitbod's '4 Exercises') containing exercise name, day+date performed, exact upload time + gym, then sets/reps lines with green completion check. '...' menu = Edit sets & reps / Replace / Delete entry. '+' = add exercise via muscle-grouped picker.", "Screen 5 \u00b7 Copy page (after Generate) \u2014 APPROVED LAYOUT = variant A: monospace text block in the EXACT format of SP's docx, copy-sign button in the card header (flips to green 'Copied' + toast), Done button bottom right returns to Screen 1.", "OUTPUT FORMAT (from SP's docx, must match exactly): 'Day N: Name' / muscle-set breakdown line e.g. '3 Back (4 sets each) 2 Bicep (5 sets each)' / then per exercise: name, then one line per set as 'reps<TAB>weight' (reps FIRST) / then 'The rest of the Day Schedule so you forgot:' listing every other day's muscle+set structure.", "DOC DAY STRUCTURE: D1 Push = 3 Chest (4 sets) + 2 Tricep (5 sets); D2 Shoulders and ABs = 3 Shoulders (4) + 2 Forearm (4) + Abs; D3 Pull = 3 Back (4) + 2 Bicep (5); D4 Legs = 2 Quads + 2 Hams + 1 Calves (4 each); D5 = 3 Chest + 3 Back (4 each); D6 = 3 Bicep + 3 Tricep (4 each); D7 = Run Day.", "CORE RULE \u2014 PER-GYM TRACKING: same exercise at EOS vs Rec = two different lifts (different machines/stacks). Separate history, suggested weights, est-1RMs, trends, progression. Never mix gyms.", "Swap rules for Generate: stay inside the same muscle part, draw from the research-ranked lists, prefer unused-recently, never downgrade a priority slot, gym-equipment aware, re-roll available.", "OPEN: assign existing Fitbod history to a gym; real equipment lists per gym; whether to reshape stored default days to the docx exercise counts."], "standing_rules": ["APP NAME: 'Fitness Workout Tracker' (formerly 'Fitbod replica').", "MOST IMPORTANT \u2014 EVERY TIME: any data write (upload/edit/clear, logged sets, saved run, day Done) must IMMEDIATELY update the Body tab and Log tab (refreshTabs()). Never ship a change that breaks this.", "Always rebuild with build.py and keep STORE_KEY unchanged between versions unless the data model truly changes, so the user's saved data survives updates.", "Before acting on a new prompt: save current state (build + snapshot) so all past work is preserved.", "PROGRESSIVE OVERLOAD ENGINE (core goal): recommended weights auto-increase when SP is ready \u2014 any set hitting 10+ reps bumps that weight tier up. The bump uses the exercise's OWN detected increment (most common gap between distinct logged weights per gym, e.g. cable stack 55/66/77 = 11-lb steps); fallback 5 lb (2.5 lb under 30). Runs in day view, Generate, sheets, and copy text; shows \u2b06 push pill + explanation.", "RUNNING UNITS: kilometers (km, min/km) everywhere \u2014 never miles.", "DAY-FREE REDESIGN (v20, Aug 5 2026): The 7-day cycle is GONE from the app. Flow = gym -> multi-select muscle picker (readiness + focus stars, sorted most-rested first) -> trend-built session (sets/reps/weights authored from per-gym logged history; push rules apply; focus parts get a +1 scout top set at 3-4 reps) -> copy page. Copy header is muscle names ('Chest and Triceps'); trailer is now 'Muscle status so you know what's ready:' (parser stops there; old 'Day N:' texts still parse). Runs are user-choice (no weekday pinning). dayDone removed; migration preserves histories/logbook/runs/upload/seeds. The 7-day PLAN remains in new_plan.py only as seed/baseline-weight data for planDefaultW().", "SET TYPES (v21): every built session tags sets \u2014 WU warm-up opener (first exercise per muscle, one easy set of 10 at ~55% snapped to the lift's own weight steps, never overextend), WS working set (default, unmarked), SS superset finisher (last working set of ONE exercise per muscle: the drop is ~22% snapped to the lift's steps, 6+ reps to max the muscle; assigned to a plateaued lift first \u2014 same top weight 2 sessions with reps not climbing \u2014 else the last lift of a focus muscle). Copy format: 'WU: reps\\t\\tweight' and 'SS: reps\\t\\tweight' lines; upload parser reads both \u2014 WU goes to warmup history (excluded from 1RM/progression), SS is stored tagged [r,w,'ss'] and ignored by progression and plateau detection.", "COPY FORMAT v22: each exercise is a transposed table \u2014 row 1 = weights (tab-separated, '-' if never logged), row 2 = reps, row 3 = set types (WU/WS/SS) only when a non-WS set exists. SS drop appears as its own column right after its parent set. NO muscle-status trailer anymore (deleted at user request). parseWorkoutText auto-detects table vs old per-line 'reps\\t\\tweight' format (2x2 ambiguity resolved by plausibility scoring), still honors 'Day N:' headers, WU:/SS: prefixed lines, and stops at old trailers.", "COPY FORMAT v23: WS is IMPLIED \u2014 the type row prints only WU/SS in their columns (blank = working set), and only appears when the exercise has a WU or SS at all. The copy page renders each exercise as a real bordered table (row 1 weights, row 2 reps, optional type row) and the Copy button writes rich text/html tables to the clipboard (plain tab-text fallback) so pasting into Apple Notes creates actual tables. Parser accepts type rows with blank cells. RENAME: 'Pec Deck or Low-to-High Fly' is now 'Pec Fly' everywhere (RENAMES map migrates saved data).", "GUIDES + CUSTOM EXERCISES (v24): every library exercise has a standalone guide file at /guides/<slug>.html on the site (generated by gen_guides.py \u2014 original coaching content, Ember-styled: what it trains, why it's ranked, steps, form checkpoints, his rep/push rules). Body tab > Individual Exercise: '+ Create Exercise' form (name, muscle GROUP only \u2014 never asks for the specific part, description of what he wants it to do) -> saved to state.custom, joins its muscle's catalog + builder pool + per-gym tracking; its guide is generated client-side instantly (window.open) and it's linked in the 'Exercise guides' section at the bottom of the exercises page (customs first with CUSTOM badge, then all guide files grouped by muscle). Exercise sheets have a 'Guide' chip. When he creates a custom exercise, on next site update also generate a proper static guide file for it. Re-run gen_guides.py and re-push /guides when the library changes.", "GUIDE DEMOS (v25): every guide page has a 'Watch it done' card \u2014 an original animated stick-figure SVG demonstrating the movement pattern (gen_demos.py, ~28 patterns mapped over all 131 exercises, SMIL animation, working limb in ember orange) plus a 'Watch real form videos' button linking to a YouTube search for '<exercise> exercise proper form' (link only \u2014 never embed copyrighted media). Custom-exercise client guides get the generic demo + the same video link. When adding exercises, extend the MAP in gen_demos.py and re-run gen_guides.py.", "NEVER-DONE DEFAULT (v26): any exercise with no logged history at the current gym is authored at 10 reps x 30 lb per set (plan seed weight from new_plan.py wins over 30 when one exists). No more '-' dashes in tables. The 10x30 is a calibration set: once logged, the 10-rep push rule takes over from real data.", "PARENTHESES CONVENTION (v27): anything in () in his workout text is commentary or a change instruction \u2014 NEVER data. App parser: () inside an exercise name is stripped from the name (history stays unified) and stored as the session's note; a full-line (...) attaches to the exercise above it; notes show in the upload summary (blue speech bubble) and on the exercise sheet. Claude-side: when he pastes workouts here, read every () as either commentary or something to change next time \u2014 act on instructions (e.g. '(Call this Pec Fly)' = rename) and factor commentary (e.g. '(felt easy)') into the next build.", "FOOD TARGETS + FUEL ENGINE (v28 batch): Targets tab has a 'Food Targets' collapsible (closed by default \u2014 not a daily thing) combining nutrition detail + supplements + the MyFitnessPal food log: paste box (parses 'FOOD YYYY-MM-DD: kcal, protein, carbs, fat' lines and loose MFP text), Save Food button (refreshTabs on save \u2014 standing rule), last-7-days list with delete, and a 'Copy Claude-on-Chrome instructions' button that generates the prompt for reading his myfitnesspal.com diary. state.food[] (90-day cap). fuelStatus() = last 3 days avg vs 2350 kcal / 180 g protein: 'on' (p>=90% & k>=85%), 'low' (p<70% or k<75%), 'ok' between, 'none'. Effects: LOW = no scout sets in the builder (proven 10+ rep pushes still fire), tiredness escalates one level, build screen shows amber banner; ON = green banner, full progression. Recovery segment's Food factor card shows live averages vs targets.", "STRENGTH INDEX + FATIGUE % (v30): mSTRENGTH replaced by my own Strength Index \u2014 every muscle starts at 100 at its FIRST logged session (per gym) and moves with est-1RM growth vs each lift's own baseline (no seeded/fake 50s; no data = '\u2014'). Benchmark Lifts removed from Results; every exercise sheet now carries a Benchmark card (PR est 1RM + date, latest, best set, mini chart, per current gym). The guides links section was removed from the Individual Exercise page (guide files stay hosted; the sheet's Guide chip stays). Recovery uses my 1-100 fatigue % per body part: F0 = 45 + 40\u00d7(last-session volume \u00f7 that muscle's usual day, clamped 0.4-2), decaying over T = 72h \u00d7 (0.7+0.35r) \u00d7 fuel factor (\u00d71.25 under-fueled, \u00d70.9 on-target); shown as a sorted bar list (red \u226567, yellow \u226534, green <34) feeding the body figure too.", "MEAL DETAIL + GOAL BOARD (v31): food entries now carry meals {breakfast,lunch,dinner,snacks} of items {name,kcal,p,c,f}; parser reads 'BREAKFAST: item \u2014 520 kcal, 32 protein, ...' lines under each FOOD date (totals computed from meals if missing). Day-to-day tracker card has a 'This day's meals' button -> openFoodDay overlay (per-meal sections + totals + tap-to-toggle supplement mark, state.supps by date). 12-HOUR SYNC: state.lastFoodSync timestamp set on every Save Food; tracker shows green 'synced within 12h' or amber 'sync due' chip; the Chrome prompt now requests full meal detail and says to run it every morning + evening. Claude CANNOT fetch MyFitnessPal from the cloud (his login is on his devices) \u2014 Claude on Chrome does the reading. GOAL BOARD sits below the tracker: 7-day grid of Lifted (goal 5)/Ran (3)/Food (5)/Supps (6, tappable cells) with weekly verdict ON TRACK/NEARLY THERE/HALFWAY/OFF TRACK.", "ENERGY TRACKER IN LOG (v32): the day-to-day tracker moved from Targets to the TOP of the Log tab and became an energy-balance tracker: formula = GOAL (2350) + EXERCISE burn - FOOD = LEFT; ring fills eaten/(goal+burn). dayBurn(iso) = lifting (total sets x 3.5 min x 4.3 kcal/min, both gyms) + running (dist x 80 kcal/km, or time x 10 if no distance). Card shows lifting/running burn chips, NET INTAKE line (green when net <= goal), day nav + week dots + meals button + 12h sync chip all moved with it. Goal Board REMOVED (dead code may remain unused). Log day drill-in stats now show BURNED / VOLUME / FOOD IN / NET. Targets tab keeps only: stat strip, focus, rules, playbook, Food Targets section.", "LIVE FOOD FEED (v33): the site hosts food.json ({ts, entries[]}); the app fetches it (cache-busted) on every open and every 5 minutes while running, merging entries by date when the feed ts is newer than state.foodRemoteTs \u2014 so food published to the feed reaches EVERY device automatically and immediately. WORKFLOW: whenever SP sends MyFitnessPal output in chat (FOOD/meal-line format), run push_food.py (parses text, merges into /tmp/site/food.json, bumps ts, commits+pushes) \u2014 do this IMMEDIATELY on receipt, it is a data write (standing MOST IMPORTANT rule applies). Manual paste in the app still works and stays local-first. Claude cannot read myfitnesspal.com itself (his login, blocked domain) \u2014 Claude on Chrome or SP supplies the text.", "UPLOAD FORMAT v34: each set is ONE ROW \u2014 column 1 sets(reps), column 2 weight, column 3 type (WU/SS) or a free-text note (blank = WS). Copy pages + Notes tables use this orientation with a SETS/WEIGHT/TYPE header. Parser accepts this, the old transposed tables, and original per-line pastes. SET COUNTS v34: exercises get 2-5 working sets \u2014 base 3, +1 focus/priority, +1 if the muscle's Gains Check is stagnant/slipping, -1 if muscle fatigue >=50%, -1 if under-fueled (clamped 2-5; short format still caps at 3, pump adds iso sets). EXERCISE BREAKDOWN SKILL: whenever SP asks about an exercise in this chat, follow exercise-breakdown/SKILL.md \u2014 research, build an Ember-styled comprehensive HTML page (original animated SVG demo + original diagrams, video LINKS only \u2014 never embedded/copied media, his numbers, steps, form checkpoints, his goal rules, considerations), publish to guides/breakdowns/<slug>.html on the site, send file + live URL.", "WORKOUT HEADER (v35): every generated workout \u2014 copy page, Notes tables, and any workout text Claude writes in chat \u2014 starts with the session name line then the breakdown line in his exact format: 'N <Muscle> (X sets each[, WS and SS])' where ', WS and SS' appears when that muscle carries a superset finisher. Example: 'Triceps and Shoulders' / '4 Tricep (4 sets each, WS and SS) 3 Shoulders (4 sets each)'.", "FRESH START + CALIBRATION (v36): HISTORY_CUTOFF moved to 2026-08-06 \u2014 ALL prior workouts (histories both gyms, logbook, runs, seeds) purge on every device; seed_uploads.json emptied; upload box reset once via calReset flag. Food/supps/customs kept. CALIBRATION PHASE: 21 days from 2026-08-06 \u2014 the app ANALYZES ONLY (workout times, diet, sets & reps): weights mirror the last session exactly (no 10+ rep pushes, no pushed pills), no scout sets, no SS finishers (WU openers stay), no stagnant +1 set boosts; blue banners on gym + build screens count days left. After day 21 the full engine (pushes, scouts, supersets, volume boosts) switches on automatically. Claude-side: workouts written in chat during calibration follow the same rules \u2014 mirror weights, moderate intensity, no 'go extremely hard' programming.", "UPLOAD TAB REMOVED (v37): 4 tabs now (Workout, Body, Targets, Log). The workout flow's final screen (step 5) is an EDITABLE textarea prefilled with the generated workout in his format; he edits it to what he actually did (set rows: reps<TAB>weight<TAB>type-or-note), it AUTO-SAVES to state.flow.editText (debounced) and survives tab switches, app closes, and reloads \u2014 flow.step stays 5 so he lands right back on it. 'Upload Workout' button records via applyUpload (gym = flow gym, date = flow.genDate) with uid-tagged idempotent re-uploads (edit -> dirty chip -> re-upload replaces). Copy button copies the EDITED text (plain + line-built Notes tables via copyHtmlFromEdit). doneFlow skips its logbook entry when uploaded === true (applyUpload already logged it). Old Upload-tab functions remain as dead code; renderUpload is never called.", "EDITABLE TABLES (v38): the flow's final screen renders state.flow.editText as bordered editable tables (SETS/WEIGHT/TYPE-NOTE header, contenteditable cells, focus highlight, '+ add set' link per exercise, exercise names editable too). Any cell edit rebuilds editText from the DOM (debounced save; clearing a row's sets+weight deletes it on next render). Same persistence, upload, dirty-chip, and Copy behavior as v37.", "FORMAT PHILOSOPHY (v39): SHORT = 45 min HARD CAP (estMinutes: 5 + 2min/working set + 1/warmup + 1/SS; shortTrim removes sets from the biggest exercises, then trailing exercises, until <=45): 2-3 sets per lift (4 absolute max), hop exercise to exercise, full stretch + pump finisher, still real growth for the day. LONG = the normal 5-6x/week workout, in the spirit of his original plan but rebuilt from live data. PUMP = the send-off before MISSING DAYS: extra sets, stacked supersets, short rests \u2014 an extreme pump + max stimulus to carry through the gap; when he says he's about to travel/miss days, recommend the Pump format for the last session and note recovery is covered by the days off. Build screen shows the ~minute estimate (green 'under 45' check on short). All three must remain genuinely growth-optimal for his recomp goals.", "BANNED (Aug 6): 'Barbell Shrug' removed completely at SP's request ('I do not like this') \u2014 deleted from the library, guides, and breakdowns; its performed sets that day were NOT recorded; never program it or any barbell shrug variant again. banned_exercises list in DB is authoritative \u2014 check it before adding exercises.", "UPDATE WITH MYFITNESSPAL SKILL: when SP says 'Update with MyFitnessPal' (or any food-sync ask), follow update-with-myfitnesspal/SKILL.md \u2014 check ToolSearch for the remote-devices/Claude-in-Chrome bridge (requires his Claude DESKTOP APP open + Chrome extension); if live, read his myfitnesspal.com diary directly (numbers + item names only) for days since the feed's last entry and publish via push_food.py; if the bridge is down, say so plainly and fall back to diary screenshots (parse them) or pasted text. Never fake a connection.", "MFP SYNC WORKFLOW (final, Aug 7): the desktop bridge does NOT attach to this conversation \u2014 never retry-loop it. 'Update with MyFitnessPal' now means: SP runs the Chrome-extension prompt himself (or sends diary screenshots/text); the moment MFP data arrives in chat, run push_food.py IMMEDIATELY to publish to the feed (data-write rule applies) and reply with a per-day summary + fuel verdict vs 2350 kcal / 180 g protein. If he says the phrase WITHOUT data attached, reply with the ready-to-copy Chrome prompt block (dates from the feed's last entry) and ask him to paste the output back.", "GOALS V2 (Aug 8): current weight is 190 lb (not 185). MAIN OBJECTIVE: use MyFitnessPal nutrition + his provided info + the workouts + his system to get a lot healthier, drain the lower-belly/love-handle fat zone from his video read, and be ready for the late-November half marathon. Side objectives: recomp (lose from 190 while building muscle), the video-read focus muscles (upper chest, side delts, long-head triceps, brachialis/brachioradialis, lats, lower abs \u2014 arms/side delts/lats are the thinnest three), and strength gains in those parts. RUNNING: never program, schedule, or prescribe runs \u2014 SP owns his running plan; the app and Claude only track runs like exercises. No 'what winning looks like' framing in goal statements.", "DASHBOARD (v43): the app opens on a new Home/Dashboard tab (5 tabs: Home, Workout, Body, Targets, Log) combining every system on one screen \u2014 energy ring (goal + exercise - food) with fuel + protein pills, tiredness meter, Strength Index with gains summary, today's lift/run activity, top-3 recovering muscles with fatigue bars, a 7-day lift/run/food dot strip, calibration + food-sync chips, and Start Workout / Food Targets quick actions. Every card taps through to its full tab. refreshTabs() now includes renderDash so all data writes update it instantly. GitHub hosting deleted by SP (rework in progress) \u2014 deliver builds as rendered files in Claude until re-hosted; all data safe in the local project repo.", "HUB NAVIGATION (v44): the bottom tab bar is REMOVED. The Dashboard is the sole hub \u2014 its cards/buttons navigate (energy+week cards -> Log, tiredness/strength cards -> Body segments, Start Workout -> flow, Food Targets -> Targets). Every section topbar has a home back button (switchTab('dash')), the workout/run flows back out to the dashboard from step 1, and finishing a workout (doneFlow) or run (runDone) lands back on the dashboard.", "DELIVERY (Aug 8): no more screenshot images with updates \u2014 deliver just the code (the app HTML file, rendered in Claude). Verify with tests as always, describe changes in words.", "Navigation (v45): every non-dashboard screen has a '\u2039 Previous \u00b7 back to Dashboard' bar at the very top (class .prevbar) that returns to the dashboard hub. The round SP button is now a fixed floating action button at the bottom-right of every screen (class .fab); tapping it opens the Targets tab and auto-expands + scrolls to the Food Targets section.", "Dashboard calendar (v47): the full Log calendar (Workouts/Milestones/Weekly goal/Streak stats + navigable month calendar with week/month toggle, day cells open the workout detail) lives directly on the main dashboard, replacing the old THE WEEK dot-strip card. The same calendar still appears in the Log tab; both views share state and stay in sync.", "Dashboard (v51): the Workouts/Milestones/Weekly-goal/Streak stats grid is removed from the dashboard (it stays on the Log tab only). The TODAY card is tappable and expands the FULL recovery view inline right below it (body figure, tiredness, fatigue % per body part, food factor). The Recovery subtab was deleted from the Body tab - the dashboard expansion is now the only recovery home. Calendar day cells are color-coded with separate dots (red=lift, blue=run, green=food) and tapping a day expands that day's three color-coded sections (Lifting red / Running blue / Food green) inline below the calendar, not in a popup.", "Fatigue model v2 (v52): recovery percentages are computed per muscle from the actual sets x reps logged. Direct working sets count in full (lightly scaled by reps), warmups 0.3, a lift's listed secondary muscle 50%, and indirect assist carry-over is small (back day -> biceps 30% / forearms 25% / shoulders 10%; chest -> triceps 30% / shoulders 20%; shoulders -> triceps 15%; biceps -> forearms 20%; quads -> glutes 25%; hams <-> glutes). Runs load quads/calves/hamstrings/glutes by minutes. Day load maps to starting fatigue on a saturating curve F0=100(1-e^(-L/12)), recent days stack, and it decays over ~3 days - slower when under-fueled or run down (tiredness raises decay time), faster when fueling is on target. Untrained muscles must read 0% or near it; every muscle's number should differ based on what was actually done.", "Health & Fitness Hub (v53): the app is named 'Health and Fitness Hub' (title, PWA manifest, topbar, dashboard heading). Dashboard has two food sections as expandable cards below TODAY: (1) FOOD ANALYSIS - grades all uploaded MFP food vs targets (letter grade + score, avgs, day-by-day kcal/protein bar chart, goal checks for fat-drain/muscle/race incl. run-day vs rest-day carbs, meal pattern with thinnest-protein-meal callout, best protein buys by g/100kcal, biggest kcal sources, low-return calorie flags at >=350 kcal & <6g protein/100kcal); (2) FOOD COACH - recommendations computed from his actual gaps: protein gap + kcal room, greedy 'fastest path' combo that closes the protein gap within budget, then food lists grouped by goal (protein anchors/recomp, fat-drain satiety helpers, race fuel). REC_FOODS is the food DB to extend.", "Water tracking (v54): WATER_TARGET = 120 oz/day. Dashboard water card sits directly under the kcal card with a progress bar and quick-add buttons (-8 / +8 glass / +17 bottle / +24 shaker); taps persist per day in state.water. MFP sync accepts WATER lines (oz/cups/ml/L, date-safe parsing) in the app parser, the Chrome prompt, and push_food.py; waterFor(day) = max(taps, synced). Hydration feeds the recovery model: avg of today+yesterday >=85% of target -> fatigue decays 5% faster; <50% -> 15% slower. Water shows in the day detail food section and as a Water line in the Food Analysis goal check.", "Set-goal system (v55): the builder works from per-muscle WORKING-set targets (WU NEVER counts). Regular (formerly Longer) workout = [SUPERSEDED by combo tables v64]  the default consistent-routine template SP provided: chest/back/shoulders 12 sets (3x4 shape), triceps/biceps 10 when trained next to a big muscle (2x5 shape) and 12 on arm-focused days (3x4), forearms/quads/hamstrings/glutes 8 (2x4), calves 4 (1x4). Short = each muscle's target minus 3 (2-3 sets per lift, hopping). Long Pump = target plus 3-4 (+4 for 12-set muscles, +3 otherwise). The split across exercises is flexible (e.g. 10 = 5/5 or 4/3/3) - hitting the total is the contract; template shapes are the default, spread splits are occasional (fatigue>=50 or ~18% chance), stagnant muscles concentrate. Scout jumps replace the last set instead of adding one so totals stay exact; pump no longer adds stray sets. Headers show uneven splits as 'N Muscle (T sets: a/b/c)'. His day templates: Push (3 chest, 2 tri), Shoulders+Abs (3 sh, 2 forearm, abs), Pull (3 back, 2 bi), Legs (2 quad 2 ham 1 calf), Chest+Back (3+3), Bi+Tri (3+3). ABS: he has a specific abs routine coming - placeholder note shows until he sends it; when it arrives, build it in as the permanent abs block.", "Fine-tune chat (v56): the workout flow is now 6 steps - Location, Muscles, Format, FINE-TUNE, Build, Copy. Step 4 is a plain-words text box (the last thing before the build) with a live 'What I understood' summary and a Skip button. Parser (parseAdjustText) understands: time caps ('only 40 min' - enforced AFTER warmups attach, trims sets then WU openers then exercises), skip/add exercises (fuzzy name rd topbar opens the uploader screen (gym + date + workout paste via parseWorkoutText, plus an Old Runs box accepting RUN YYYY-MM-DD: 30 min, 4.8 km, 300 kcal or CARDIO lines). purgeOld now runs ONCE (state.purged86) so deliberately-uploaded pre-Aug-6 history survives. (4) Food Analysis went deeper: macro split vs 30/40/30 recomp ticks, week-over-week deltas, best & toughest day callouts, protein pacing (25g+ feedings), deficit math projecting lb/week to race day (warns over 2 lb/wk), supplement adherence. Food Coach went deeper: smart swaps generated from his actual low-return items, 'a day that hits your numbers' template, timing playbook (pre/post lift & run, pre-bed), race-fuel timeline for the late-Nov half, grocery list, supplement corner, water reminder.", "Upload dedup (v61): food uploads can never duplicate - one entry per date (re-paste replaces/updates), and meal items dedupe by name+kcal within a day. Runs from MFP (his runs sync into MyFitnessPal as CARDIO lines): parseCardioText remembers the date context of the FOOD block above it, so undated CARDIO lines land on the right day; mergeRuns() is the single shared merge - a run is a duplicate if same day, same minutes (within 1) and matching kcal (within 25), so overlapping re-syncs never double runs. Gate toast reports skipped duplicates. The Chrome MFP prompt now also asks for CARDIO lines per day.", "Responsive dashboard (v62): on screens >=1000px wide the dashboard becomes a two-column board (body.wide + CSS multicol on #dashcontent; heading/status pills/CTA row span both columns; expansions keep working). Every other screen keeps the 444px phone shell even on computer, and phones are unchanged. switchTab toggles body.wide only for the dash. Deployed to sammypisano.github.io so the same URL works on phone and computer.", "Retention policy (v63): individual exercise histories are kept FOREVER - never trimmed, never expired, display uncapped. Workout days (logbook), runs, food entries and water live for ONE YEAR from their date, then are permanently deleted by retentionSweep on load. Food is no longer capped at 90 entries; the cloud feed keeps a year too. Past Workouts list shows the latest 60 (calendar reaches everything).", "History restore (v63): the Aug-6 fresh-start wipe is RETIRED. His pre-Aug-6 exercise history (90 sessions from fitbod_workouts.json, back to early 2026) was restored on request via one-time applyHistoryRestore() (merges into The Rec by exercise+date, no duplicates, banned exercises excluded, flag state.oldHistRestored). Never re-add a fixed-date purge.", "SAVE EVERYTHING (standing order, Aug 16): every workout SP does, from now on, gets permanently saved. Whenever he sends a workout in chat (paste, screenshot, or screen recording), seed it into seed_uploads.json with its date, rebuild, commit, and deploy - so it lives in the project repo and the app, never only in device storage. In-app: workout days keep the 1-year retention, exercise histories forever, and no purge may ever delete his logged workouts again. The Aug 3-5 sessions were lost to the old fresh-start purge and are accepted as gone unless he supplies them later.", "Set-goal rules v2 (Aug 16, PENDING his combination tables): builder set totals will come from SP's muscle-combination tables (next message) - totals per combo per workout length. Splits stay flexible/my choice toward his goals (e.g. 10 tricep sets = 4+4+2? NO - see limits: per exercise HARD MIN 3 sets, HARD MAX 5 sets; e.g. 10 = 4+3+3 or 5+5 or 3+3+4). Do not rebuild the app until his tables arrive; then replace muscleSetTarget/splitFor with the combo-based system.", "Set-goal v2 fallback (Aug 16): for any muscle combination NOT in his common-combination tables (whether 2 or 3 muscles picked), each muscle gets the STANDARD totals: 8 sets short workout, 10 sets longer workout, 12 sets long pump workout. Common combos (tables coming next) override these.", "Naming (Aug 16): the middle format is called 'Regular Workout' (re anels. 760-1120px folds to 2 columns with the food panels side-by-side below. Phone (<760px) keeps the single-column app exactly. Window resize re-renders across the breakpoint.", "Desktop layout v69 (SP-specified): top bar = title+date+status pills (like before) with the two buttons one on each side - Old workouts next to the pills, Upload/Start Workout pinned right (Food Targets button removed from header; SP FAB still opens it). Under that: vitals rail FIRST on the left (Energy, Tiredness+Strength, TODAY/recovery), CALENDAR next on the right. Food Analysis + Food Coach sit below that row side by side. He will direct where further parts go.", "Phone dashboard order v70 (SP-specified): title+date at top, then the two buttons side by side (Old workouts | Upload/Start), then status pills, then vitals FIRST (Energy card, Tiredness+Strength duo, TODAY card with recovery expansion), then the CALENDAR, then Food Analysis and Food Coach cards, then a single Food Targets button. The computer keeps the v69 board (header bar + vitals-left/calendar-right + food panels below). Same file serves both.", "Device roles + sync (v71): the PHONE is the field device - its dashboard is only: Old workouts + Upload/Start buttons, status pills, Tiredness + Strength Index, TODAY card with the full recovery expansion, and a note that the deep picture lives on the computer. No energy card, no calendar, no food analysis/coach on phone (Log/Body tabs still reachable). The COMPUTER board keeps everything incl. the food intel. DEVICE SYNC: every device pulls sync.json from the hub on open + every 5 min and merges (histories by exercise+date, logbook by date+name, mergeRuns, food by richer-entry, water max, supps/saved/custom union - idempotent). A device with the GitHub token saved (one-time paste via the gate's 'device sync' chip; stored in that device's localStorage only, never in the public file) pushes its state to sync.json through the GitHub API (debounced 4s after saves, hash-guarded). Th /* RETENTION POLICY:
   - Individual exercise histories (state.histories) are kept FOREVER - never trimmed, never expired.
   - Workout days (logbook), runs and food entries stay visible for ONE YEAR from their date,
     then are permanently deleted on load. */
function yearAgoISO(){
  const d = new Date(); d.setDate(d.getDate()-365);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function retentionSweep(st){
  if(!st) return st;
  const cut = yearAgoISO();
  if(st.logbook) st.logbook = st.logbook.filter(l=>l.date >= cut);
  if(st.runs) st.runs = st.runs.filter(r=>r.date >= cut);
  if(st.food) st.food = st.food.filter(e=>e.date >= cut);
  if(st.water) Object.keys(st.water).forEach(d=>{ if(d < cut) delete st.water[d]; });
  /* st.histories intentionally untouched - exercise tracking is forever */
  return st;
}
function purgeOld(st){
  /* the Aug-6 fresh-start wipe is retired - his old exercises are restored and stay.
     The only cleanup is the 1-year retention sweep (exercise histories: forever). */
  return retentionSweep(st);
}
function loadState(){ try{ const s=localStorage.getItem(STORE_KEY); return s?purgeOld(JSON.parse(s)):null; }catch(e){ storageOK=false; return null; } }

function seededRand(seedStr){
  let h = 2166136261;
  for(let i=0;i<seedStr.length;i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}
function blockDaysIn(){
  if(!state.blockStart) return 0;
  return Math.floor((new Date(todayISO()+"T12:00:00") - new Date(state.blockStart+"T12:00:00"))/86400000);
}

/* ---- progressive-overload engine: detect each lift's own weight steps and push when ready ---- */
function detectIncrement(name){
  const ws = new Set();
  H(name).forEach(h=>(h.sets||[]).forEach(s=>{ if(s[1]>0) ws.add(s[1]); }));
  const arr = [...ws].sort((a,b)=>a-b);
  const gaps = {};
  for(let i=1;i<arr.length;i++){
    const g = Math.round((arr[i]-arr[i-1])*100)/100;
    if(g>0) gaps[g]=(gaps[g]||0)+1;
  }
  const best = Object.keys(gaps).sort((a,b)=>gaps[b]-gaps[a] || Number(a)-Number(b))[0];
  if(best) return Number(best);
  const maxW = arr[arr.length-1]||0;
  return (maxW && maxW < 30) ? 2.5 : 5;
}
function applyProgression(ex){
  if(ex.sets[0] && ex.sets[0].duration) return;
  if(calibrating()){
    /* calibration: recommend exactly what you did last time — record, learn, no forced jumps */
    const hs0 = H(ex.name).filter(h=>h.sets && h.sets.length);
    delete ex.pushed;
    if(!hs0.length) return;
    const last0 = hs0.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const lastSets0 = (last0.sets||[]).filter(s=>s[2]!=="ss");
    const working0 = ex.sets.filter(s=>!s.warmup && !s.scout);
    working0.forEach((s,i)=>{
      const ls = lastSets0[Math.min(i, lastSets0.length-1)];
      if(ls && ls[1]>0) s.weight = ls[1];
    });
    return;
  }
  const hs = H(ex.name).filter(h=>h.sets && h.sets.length);
  delete ex.pushed;
  if(!hs.length) return;
  const last = hs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastSets = (last.sets||[]).filter(s=>s[2]!=="ss");
  if(!lastSets.length) return;
  const inc = detectIncrement(ex.name);
  const working = ex.sets.filter(s=>!s.warmup && !s.scout);
  let pushedFrom = null, pushedTo = null, pushedReps = null;
  working.forEach((s,i)=>{
    const lastSet = lastSets[Math.min(i, lastSets.length-1)];
    if(!lastSet) return;
    const r = lastSet[0], w = lastSet[1];
    if(w>0 && r >= 10){
      const nw = Math.round((w+inc)*100)/100;
      if(pushedFrom===null){ pushedFrom = w; pushedTo = nw; pushedReps = r; }
      s.weight = nw;
    } else if(w>0){
      s.weight = w;
    }
  });
  if(pushedFrom!==null) ex.pushed = {from:pushedFrom, to:pushedTo, inc:inc, reps:pushedReps};
}

const FOOD_TARGET = {kcal:2350, protein:180};
const WATER_TARGET = 120; /* fl oz per day \u2248 3.5 L \u2014 190 lb + lifting + run miles */
function waterFor(iso){
  const tap = (state.water||{})[iso] || 0;

}
function addWater(oz){

function hydrationStatus(){

  const d = new Date(t+"T12:00:00"); d.setDate(d.getDate()-1);
  const y = d.toISOString().slice(0,10);
  const vals = [waterFor(t), waterFor(y)].filter(v=>v>0);

function foodNum(s){ return Number(String(s).replace(/,/g,"")); }
function parseCardioText(t){
  const runs = [];
  let ctxDate = null; /* MFP pastes put CARDIO under a day's FOOD block - remember the day */
  t.split(/\r?\n/).forEach(raw=>{
    const l = raw.trim(); if(!l) return;
    const anyDate = l.match(/(\d{4}-\d{2}-\d{2})/);
    if(anyDate) ctxDate = anyDate[1];
    if(!/^CARDIO/i.test(l)) return;
    let name, minutes, kcal, dist = null;
    let m = l.match(/CARDIO\w*[:\s]+(.+?)(?:,|\u2014|-)?\s*([\d.]+)\s*mph.*?([\d.]+)\s*minutes?[^\d]*([\d,]+)\s*(?:k?cal)/i);
    if(m){ name = m[1]; const mph = parseFloat(m[2]); minutes = parseFloat(m[3]); kcal = foodNum(m[4]); dist = Math.round(mph*minutes/60*1.60934*100)/100; }
    else {
      const m2 = l.match(/CARDIO\w*[:\s]+(.+?)[,\s]+([\d.]+)\s*minutes?[^\d]*([\d,]+)\s*(?:k?cal)/i);
      if(!m2) return;
      name = m2[1]; minutes = parseFloat(m2[2]); kcal = foodNum(m2[3]);
    }
    const dm = l.match(/(\d{4}-\d{2}-\d{2})/);
    const date = dm ? dm[1] : (ctxDate || todayISO());
    const pace = dist ? Math.round(minutes/dist*100)/100 : null;
    const rtype = minutes>=50 ? "long" : (pace && pace<5.6 ? "tempo" : "easy");
    runs.push({date, type:rtype, name:{long:"Long Run",tempo:"Tempo Run / Intervals",easy:"Easy Run"}[rtype],
      time:minutes, dist, pace, kcal, loggedAt:"synced"});
  });

}
/* one shared run-merge: a run is a duplicate if same day, same length (within a minute)

function mergeRuns(rs){
  if(!state.runs) state.runs = [];
  let added = 0;
  (rs||[]).forEach(r=>{
    if(!r || !r.date) return;
    const dupe = state.runs.some(x=>x.date===r.date &&
      Math.abs((Number(x.time)||0)-(Number(r.time)||0)) < 1 &&
      (x.kcal==null || r.kcal==null || Math.abs(x.kcal-r.kcal) < 25));
    if(!dupe){ state.runs.unshift(r); added++; }
  });

}
function parseRunLines(t){
  const runs = parseCardioText(t);
  t.split(/\r?\n/).forEach(raw=>{
    const l = raw.trim();
    const m = l.match(/^RUN\b[\s:]*(\d{4}-\d{2}-\d{2})?[\s:,]*(.*)$/i);
    if(!m) return;
    const rest = m[2] || "";
    const mins = rest.match(/([\d.]+)\s*min/i);
    if(!mins) return;
    const km = rest.match(/([\d.]+)\s*(?:km|k\b)/i);
    const mi = rest.match(/([\d.]+)\s*mi\b/i);
    const kc = rest.match(/([\d,]+)\s*k?cal/i);
    const date = m[1] || todayISO();
    const time = parseFloat(mins[1]);
    const dist = km ? parseFloat(km[1]) : (mi ? Math.round(parseFloat(mi[1])*1.60934*100)/100 : null);
    const pace = dist ? Math.round(time/dist*100)/100 : null;
    const rtype = time>=50 ? "long" : (pace && pace<5.6 ? "tempo" : "easy");
    runs.push({date, type:rtype, name:{long:"Long Run",tempo:"Tempo Run / Intervals",easy:"Easy Run"}[rtype],

}

function parseFoodText(t){
  const out = {};
  let pendingDate = null;
  let curDate = null;
  const entryFor = d => out[d] || (out[d] = {date:d, kcal:null, protein:null, carbs:null, fat:null, meals:{breakfast:[],lunch:[],dinner:[],snacks:[]}, loggedAt:nowTime()});
  t.split(/\r?\n/).forEach(raw=>{
    const l = raw.trim(); if(!l) return;
    if(/^CARDIO/i.test(l)) return; /* cardio lines belong to parseCardioText - their kcal is a burn, not food */
    const mm = l.match(/^(BREAKFAST|LUNCH|DINNER|SNACKS?)\s*[:\-]\s*(.+)$/i);
    if(mm){
      const key = mm[1].toLowerCase().indexOf("snack")===0 ? "snacks" : mm[1].toLowerCase();
      const rest = mm[2];
      const kcal2 = rest.match(/([\d,]{2,6})\s*(?:k?cal\b|calories)/i);
      const prot2 = rest.match(/([\d,]{1,4})\s*g?\s*p(?:rotein)?\b/i);
      const carb2 = rest.match(/([\d,]{1,4})\s*g?\s*c(?:arbs?|arbohydrates)?\b/i);
      const fat2 = rest.match(/([\d,]{1,4})\s*g?\s*f(?:at)?\b/i);
      const name = rest.split(/\s+[\u2014\u2013-]\s+/)[0].replace(/\s+/g," ").trim();
      const e = entryFor(curDate || pendingDate || todayISO());
      if(!e.meals) e.meals = {breakfast:[],lunch:[],dinner:[],snacks:[]};
      const item = {name: name||"item", kcal: kcal2?foodNum(kcal2[1]):null, p: prot2?foodNum(prot2[1]):null, c: carb2?foodNum(carb2[1]):null, f: fat2?foodNum(fat2[1]):null};
      /* no duplicates: same item name + kcal already in this meal = skip */
      if(!e.meals[key].some(x=>x.name===item.name && x.kcal===item.kcal)) e.meals[key].push(item);
      return;
    }
    const wm = l.replace(/\d{4}-\d{2}-\d{2}/,"").match(/^WATER\b[^\d]*([\d.,]+)\s*(oz|ounces?|cups?|ml|l|liters?)?/i);
    if(wm){
      const dmw = l.match(/(\d{4}-\d{2}-\d{2})/);
      const unit = (wm[2]||"oz").toLowerCase();
      let oz = foodNum(wm[1]);
      if(unit.indexOf("cup")===0) oz *= 8;
      else if(unit==="ml") oz /= 29.574;
      else if(unit==="l" || unit.indexOf("liter")===0) oz *= 33.814;
      const e = entryFor(dmw ? dmw[1] : (curDate || pendingDate || todayISO()));
      e.water = Math.round(oz);
      return;
    }
    const dm = l.match(/(\d{4}-\d{2}-\d{2})/);
    const kcal = l.match(/([\d,]{2,6})\s*(?:k?cal\b|calories)/i) || l.match(/calories[^\d]{0,15}([\d,]{2,6})/i);
    const prot = l.match(/([\d,]{1,4})\s*g?\s*protein/i) || l.match(/protein[^\d]{0,15}([\d,]{1,4})/i);
    const carb = l.match(/([\d,]{1,4})\s*g?\s*carb/i) || l.match(/carb(?:s|ohydrates)?[^\d]{0,15}([\d,]{1,4})/i);
    const fat = l.match(/([\d,]{1,4})\s*g?\s*fat/i) || l.match(/\bfat[^\d]{0,15}([\d,]{1,4})/i);
    if(dm && !(kcal||prot)){ pendingDate = dm[1]; curDate = dm[1]; return; }
    if(kcal || prot){
      const d = dm ? dm[1] : (pendingDate || todayISO());
      curDate = d;
      const e = entryFor(d);
      if(kcal) e.kcal = foodNum(kcal[1]);
      if(prot) e.protein = foodNum(prot[1]);
      if(carb) e.carbs = foodNum(carb[1]);
      if(fat) e.fat = foodNum(fat[1]);
    }
  });
  /* if a day has meal items but no totals line, add the meals up */
  Object.values(out).forEach(e=>{
    const items = e.meals ? [].concat(e.meals.breakfast, e.meals.lunch, e.meals.dinner, e.meals.snacks) : [];
    if(items.length){
      if(e.kcal==null && items.some(x=>x.kcal!=null)) e.kcal = items.reduce((a,x)=>a+(x.kcal||0),0);
      if(e.protein==null && items.some(x=>x.p!=null)) e.protein = items.reduce((a,x)=>a+(x.p||0),0);
      if(e.carbs==null && items.some(x=>x.c!=null)) e.carbs = items.reduce((a,x)=>a+(x.c||0),0);
      if(e.fat==null && items.some(x=>x.f!=null)) e.fat = items.reduce((a,x)=>a+(x.f||0),0);
    }
  });
  return Object.values(out).filter(e=>e.kcal!=null || e.protein!=null || (e.meals && [].concat(e.meals.breakfast,e.meals.lunch,e.meals.dinner,e.meals.snacks).length));
}

  const ks = f.filter(e=>e.kcal>0).map(e=>e.kcal);

  const kr = ak!=null?ak/FOOD_TARGET.kcal:1, pr = ap!=null?ap/FOOD_TARGET.protein:1;

async function pollRemoteFood(){
  if(location.protocol === "file:") return;
  try{
    const r = await fetch("food.json?_="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const j = await r.json();
    if(!j || !Array.isArray(j.entries)) return;
    if(j.ts && state.foodRemoteTs && j.ts <= state.foodRemoteTs) return;
    let changed = 0;
    j.entries.forEach(e=>{
      if(!e || !e.date) return;
      const cur = (state.food||[]).find(x=>x.date===e.date);
      if(!cur || JSON.stringify(cur) !== JSON.stringify(e)){
        state.food = (state.food||[]).filter(x=>x.date!==e.date);
        state.food.push(e);
        changed++;
      }
    });
    if(Array.isArray(j.runs)){
      if(!state.runs) state.runs = [];
      j.runs.forEach(r=>{
        if(!r || !r.date) return;
        const key = r.date+"|"+(r.name||"Run")+"|"+(r.time||0);
        if(!state.runs.some(x=>(x.date+"|"+(x.name||"Run")+"|"+(x.time||0))===key)){
          state.runs.unshift({date:r.date, type:r.type||"easy", name:r.name||"Run",
            time:r.time!=null?r.time:null, dist:r.dist!=null?r.dist:null,
            pace:r.pace!=null?r.pace:null, kcal:r.kcal!=null?r.kcal:null, loggedAt:"synced"});
          changed++;
        }
      });
    }
    state.foodRemoteTs = j.ts || Date.now();
    if(changed){
      state.food.sort((a,b)=>b.date.localeCompare(a.date));
      state.food = state.food.filter(e=>e.date >= yearAgoISO());
      state.lastFoodSync = Date.now();
      saveState(); refreshTabs();
      toast("MyFitnessPal synced from cloud \u2713 \u2014 "+changed+" day"+(changed>1?"s":"")+" updated");
    } else {
      saveState();
    }
  }catch(err){}
}

function estMinutes(w){

  w.exercises.forEach(e=>{

    const work = e.sets.filter(s=>!s.warmup).length;
    const warm = e.sets.filter(s=>s.warmup).length;

  let guard = 30;

      const n = e.sets.filter(s=>!s.warmup).length;
      if(n > 3 && (!best || n > best.n)) best = {e, n};

    if(best){
      const idxs = best.e.sets.map((s,i)=>!s.warmup?i:-1).filter(i=>i>=0);

      const wuEx = w.exercises.find(e=>e.sets.some(x=>x.warmup));

    if(e.sets[0] && e.sets[0].duration) return;
    const k = musclesFor(e.name).find(m=>keys.includes(m)) || musclesFor(e.name)[0];
    if(seen[k]) return;

    const work = target.sets.filter(s=>!s.warmup && !s.scout);
    const lastSet = work[work.length-1];
    if(!lastSet || lastSet.weight==="" || !(lastSet.weight>0)) return;
    const drop = snapDrop(target.name, lastSet.weight);

    const fpool = pool.filter(x=>{
      const ln = x.name.toLowerCase();
      if(adj.excludePhrases.some(ws=>ws.every(wd=>ln.includes(wd.replace(/s$/,""))))) return false;
      if(adj.equipOnly && !eqTest(ln, adj.equipOnly)) return false;
      if(adj.equipNo.some(q=>eqTest(ln, q))) return false;
      if(adj.noCompound[k] && isCompound(x.name)) return false;
      return true;
    });
    if(fpool.length) pool = fpool;
    /* keep the header honest: prefer lifts whose primary muscle is the one we're filling */
    const prim = pool.filter(x=>musclesFor(x.name)[0]===k);
    if(prim.length >= split.length) pool = prim;
    const picks = [];
    const parts = {};
    const clash = n => picks.some(p2=>{ const a=p2.name.toLowerCase(), b=n.toLowerCase(); return a.includes(b)||b.includes(a); });
    for(const x of pool){ if(picks.length>=split.length) break; if(parts[x.part] || clash(x.name)) continue; picks.push(x); parts[x.part]=1; }
    for(const x of pool){ if(picks.length>=split.length) break; if(!picks.includes(x) && !clash(x.name)) picks.push(x); }
    picks.forEach((x,i)=>{
      if(x.rank===1) return; /* #1 research picks are permanent anchors */
      if(rnd()<0.4){
        const alts = pool.filter(y=>y.part===x.part && y.name!==x.name && !picks.some(p2=>{ const a=p2.name.toLowerCase(), b=y.name.toLowerCase(); return a.includes(b)||b.includes(a); }));
        if(alts.length) picks[i] = alts[Math.floor(rnd()*Math.min(2,alts.length))];
      }
    });
    /* fine-tune: requested exercises are guaranteed a slot */
    adj.includeEx.forEach(nm=>{
      if(!musclesFor(nm).includes(k)) return;
      if(picks.some(p2=>p2.name===nm)) return;
      const src = pool.find(x=>x.name===nm) || {name:nm, rank:null, part:"Requested", prio:false};
      if(picks.length>=split.length && picks.length) picks[picks.length-1] = src; else picks.push(src);
    });
    picks.forEach((x,i)=>{
      const extra = !calibrating() && fuelOK && !!(x.prio || (x.rank===1 && GROUP_FOCUS[g.group]));
      const comp = isCompound(x.name);
      /* sets come from the muscle's split - the TOTAL is the contract, WU never counts */
      const nSets = split[i] || split[split.length-1];
      const sets = authorSets(x.name, extra && nSets>=4, nSets);
      exercises.push({
        name: x.name,
        target: sets.length+" × "+(comp?"6–10":"10–15"),
        rest: comp ? "2 min" : "75s",
        note: bestPickNote(g.group, x.name),
        sets
      });
    });
  });
  for(let i=exercises.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=exercises[i]; exercises[i]=exercises[j]; exercises[j]=t; }
  const w = {name: sessName(keys), subtitle: FORMATS[fmt].name+" · "+FORMATS[fmt].time+" · "+GYMS[state.gym].label+" trends", exercises};
  w.exercises.forEach(e=>applyProgression(e));
  w.exercises.forEach(e=>fmtAdjust(e, fmt));
  assignSetTypes(w.exercises, keys, fmt, adj.noSS);
  /* his set tables are the contract - no automatic trimming. The fine-tune
     time cap ("only 40 min") is the only thing allowed to cut sets. */
  if(adj.timeCap) trimToCap(w, adj.timeCap);
  if(adj.notes.length) w.adjNotes = adj.notes.slice();
  if(state.flow.adjust && state.flow.adjust.text) w.adjusted = true;
  return w;
}
function ensureSessView(){
  const keys = sessMuscles();
  if(!keys.length){ state.flow.sessView = null; state.flow.sessKey = null; return; }
  const key = keys.join("+")+"|"+todayISO()+"|"+state.gym+"|b"+(state.blockNum||1)+"|f"+(state.flow.format||"long")+"|adj:"+((state.flow.adjust&&state.flow.adjust.text)||"");
  if(state.flow.sessView && state.flow.sessKey===key) return;
  state.flow.sessView = buildSession();
  state.flow.sessKey = key;
  state.flow.generated = null;
  saveState();
}

function setLevel(l){ state.flow.level = state.flow.level===l?null:l; state.flow.generated = null; saveState(); renderFlow(); }

function libIndex(){
  const idx = {};
  (DB.muscleRef.exercise_library||[]).forEach(g=>g.parts.forEach(p=>p.exercises.forEach(e=>{
    if(!(e.name in idx)) idx[e.name] = {group:g.group, key:g.key, part:p.part, rank:e.rank||null};
  })));
  return idx;
}
function swapWhy(group, e){
  const b = (DB.muscleRef.best_exercises||{})[group];
  if(b){ const t = b.top.find(x=>x.name===e.name); if(t) return "★ #"+t.rank+" research pick — "+t.why; }
  return "Same-muscle-part variation for a fresh stimulus.";
}
function generateWorkout(level){
  ensureSessView();
  const gen = JSON.parse(JSON.stringify(state.flow.sessView));
  gen.exercises.forEach(e=>{ delete e.swapped; });
  const ranges = {keep:[0,0], small:[0,1], some:[1,2], big:[2,4]};
  if(!level) return gen;
  const [lo,hi] = ranges[level];
  const n = lo + Math.floor(Math.random()*(hi-lo+1));
  if(n<=0) return gen;
  const idx = libIndex();
  const inDay = new Set(gen.exercises.map(e=>e.name));
  const slots = gen.exercises.map((e,i)=>({e,i,meta:idx[e.name]}))
    .filter(s=>s.meta && !(s.e.sets[0]&&s.e.sets[0].duration));
  slots.sort((a,b)=>{
    const au = a.meta.rank?0:1, bu = b.meta.rank?0:1;
    if(au!==bu) return bu-au;
    return (b.meta.rank||0)-(a.meta.rank||0);
  });
  let done = 0;
  for(const s of slots){
    if(done>=n) break;
    if(s.meta.rank===1) continue; /* never swap out a #1 pick */
    const lib = (DB.muscleRef.exercise_library||[]).find(g=>g.group===s.meta.group);
    const part = lib ? lib.parts.find(p=>p.part===s.meta.part) : null;
    if(!part) continue;
    const cands = part.exercises.filter(e=>e.name!==s.e.name && !inDay.has(e.name));
    if(!cands.length) continue;
    cands.sort((a,b)=>((a.rank||99)-(b.rank||99)) || ((H(b.name).length?1:0)-(H(a.name).length?1:0)));
    const best = cands[0];
    if(s.meta.rank && (best.rank||99) > s.meta.rank) continue; /* never downgrade */
    inDay.add(best.name);
    const why = swapWhy(s.meta.group, best);
    const from = s.e.name;
    const extra = false;
    const comp = isCompound(best.name);
    const gs2 = muscleGainStat(s.meta.key);
    let nSets2 = 3;
    if(gs2.st==="stagnant" || gs2.st==="down") nSets2++;
    if(muscleFatiguePct(s.meta.key) >= 50) nSets2--;
    nSets2 = Math.max(2, Math.min(5, nSets2));
    const sets = authorSets(best.name, extra, nSets2);
    gen.exercises[s.i] = {
      name: best.name,
      target: sets.length+" × "+(comp?"6–10":"10–15"),
      rest: comp ? "2 min" : "75s",
      note: bestPickNote(s.meta.group, best.name),
      sets,
      swapped: {from, why}
    };
    done++;
  }
  gen.exercises.forEach(e=>applyProgression(e));
  gen.exercises.forEach(e=>fmtAdjust(e, state.flow.format||"long"));
  if((state.flow.format||"long")==="short") shortTrim(gen);
  assignSetTypes(gen.exercises, sessMuscles(), state.flow.format||"long");
  return gen;
}

const MUSCLE_LABEL = {chest:"Chest",triceps:"Tricep",back:"Back",biceps:"Bicep",shoulders:"Shoulders",forearms:"Forearm",quads:"Quads",hamstrings:"Hamstrings",calves:"Calves",abs:"Abs",glutes:"Glutes"};
function dayBreakdown(w){
  const groups = {}; const order = [];
  let lifting = false;
  w.exercises.forEach(e=>{
    if(e.sets[0]&&e.sets[0].duration) return;
    lifting = true;
    const lbl = MUSCLE_LABEL[musclesFor(e.name)[0]]||"Other";
    if(!groups[lbl]){ groups[lbl]={list:[],ss:false}; order.push(lbl); }
    const nn = e.sets.filter(s=>!s.warmup).length;
    groups[lbl].list.push(nn);
    if(e.sets.some(s=>s.ss)) groups[lbl].ss = true;
  });
  if(!lifting) return "Run Day";
  const parts = order.map(l=>{
    const g = groups[l];
    const tot = g.list.reduce((a,b)=>a+b,0);
    const even = g.list.every(x=>x===g.list[0]);
    const inner = even ? g.list[0]+" sets each" : tot+" sets: "+g.list.join("/");
    return g.list.length+" "+l+" ("+inner+(g.ss?", WS and SS":"")+")";
  });
  return parts.length>2 ? parts.join("\n") : parts.join(" ");
}

    copyRows(e).forEach(x=>{ t += x.r+"\t"+x.w+(x.t?"\t"+x.t:"")+"\n"; });

function renderEditTables(t){
  const rawLines = (t||"").split(/\r?\n/);
  const isSetLine = l => {
    const cells = l.split(/\t+/).map(x=>x.trim()).filter(Boolean);
    return cells.length>=2 && /^[\d.,\-]+$/.test(cells[0]) && /^[\d.,\-]+$/.test(cells[1]);
  };
  let h = ""; let inTbl = false;
  const addBtn = '<div class="addsetlink" onclick="flowAddSet(this)">+ add set</div>';
  rawLines.forEach((raw, idx)=>{
    const l = raw.trim();
    if(!l){ if(inTbl){ h += '</table>'+addBtn; inTbl = false; } return; }
    const cells = l.split(/\t+/).map(x=>x.trim()).filter(Boolean);
    if(isSetLine(l)){
      if(!inTbl){ h += '<table class="cptbl"><tr><td class="cpty">SETS</td><td class="cpty">WEIGHT</td><td class="cpty">TYPE / NOTE</td><td class="cpty" style="width:26px"></td></tr>'; inTbl = true; }
      h += '<tr><td contenteditable inputmode="numeric">'+esc(cells[0])+'</td><td contenteditable inputmode="decimal">'+esc(cells[1])+'</td><td contenteditable>'+esc(cells[2]||"")+'</td><td class="cpdel" onclick="flowDelSet(this)">\u2715</td></tr>';
      return;
    }
    if(inTbl){ h += '</table>'+addBtn; inTbl = false; }
    /* is this line an exercise name? (its table starts on the next non-empty line) */
    let nxt = idx+1;
    while(nxt < rawLines.length && !rawLines[nxt].trim()) nxt++;
    const isExName = nxt < rawLines.length && isSetLine(rawLines[nxt].trim());
    if(isExName){
      h += '<div class="cpexwrap"><div class="cpexname" contenteditable>'+esc(l)+'</div><span class="cpexdel" onclick="flowDelEx(this)">\ud83d\uddd1</span></div>';
    } else {
      h += '<div class="cpexname" contenteditable>'+esc(l)+'</div>';
    }
  });
  if(inTbl) h += '</table>'+addBtn;
  return h;
}
function flowDelSet(td){
  const tr = td.parentElement, tbl = tr.closest("table");
  openListModal("Delete this set?", [
    {name:"\ud83d\uddd1 Delete set", danger:true},
    {name:"Keep it"}
  ], (j)=>{
    closeModal();
    if(j!==0) return;
    tr.remove();
    if(tbl && tbl.rows.length<=1){
      /* last set gone - the whole exercise goes with it */
      const wrap = tbl.previousElementSibling;
      const add = tbl.nextElementSibling;
      if(add && add.classList && add.classList.contains("addsetlink")) add.remove();
      if(wrap && wrap.classList && wrap.classList.contains("cpexwrap")) wrap.remove();
      tbl.remove();
    }
    flowTableInput();
    toast("Set deleted");
  });
}
function flowDelEx(btn){
  const wrap = btn.closest(".cpexwrap");
  const name = wrap ? wrap.querySelector(".cpexname").textContent.trim() : "this exercise";
  openListModal("Remove "+name+"?", [
    {name:"\ud83d\uddd1 Remove exercise & its sets", danger:true},
    {name:"Keep it"}
  ], (j)=>{
    closeModal();
    if(j!==0) return;
    let el = wrap.nextElementSibling;
    while(el && !(el.classList && (el.classList.contains("cpexwrap") || el.classList.contains("cpexname")))){
      const dead = el; el = el.nextElementSibling;
      if(dead.tagName==="TABLE" || (dead.classList && dead.classList.contains("addsetlink"))) dead.remove();
      else break;
    }
    wrap.remove();
    flowTableInput();
    toast("Exercise removed");
  });
}
function flowTableInput(){
  const root = $("flowedit"); if(!root) return;
  const lines = [];
  [...root.children].forEach(el=>{
    const nameEl = (el.classList && el.classList.contains("cpexwrap")) ? el.querySelector(".cpexname")
      : (el.classList && el.classList.contains("cpexname")) ? el : null;
    if(nameEl){
      const txt = nameEl.textContent.trim();
      if(txt){ lines.push(txt); if(/sets each|sets:/i.test(txt)) lines.push(""); }
    } else if(el.tagName === "TABLE"){
      [...el.rows].forEach((row,i)=>{
        if(i===0) return;
        const c = [...row.cells].filter(td=>!td.classList.contains("cpdel")).map(td=>td.textContent.trim());
        if(!c[0] && !c[1]) return;
        lines.push((c[0]||"-")+"\t"+(c[1]||"-")+(c[2]?"\t"+c[2]:""));
      });
      lines.push("");

function copyHtmlFromEdit(t){

      return;
    }
    if(inTbl){ h += '</table>'; inTbl = false; }
    h += '<b>'+esc(l)+'</b><br>';
  });

function fallbackCopy(t, h, ok){

function applyUpload(){
  const up = ensureUpload();
  uploadUnapply();
  const gym = up.gym, date = up.date;
  const p = parseWorkoutText(up.text||"");
  let saved = 0;
  if((up.text||"").trim() && p.exercises.length){

      const sets = ex.sets.filter(s=>s[1]!=null && s[0]>0).map(s=>s[2]==="ss"?[s[0],s[1],"ss"]:[s[0],s[1]]);
      if(!sets.length) return;

      state.histories[gym][ex.name].unshift({date, time:nowTime(), sets,
        warmup:(ex.warmup||[]).filter(s=>s[1]!=null&&s[0]>0).map(s=>[s[0],s[1]]),
        est1rm:est1RM(sets), note:ex.comment||null, badge:null, uid});

    if(saved){
      const luid = "l"+(state.uidSeq = (state.uidSeq||0)+1);
      state.logbook.unshift({uid:luid, date, gym:GYMS[gym].label,
        workout: p.day ? (p.dayName||("Day "+p.day)) : (p.dayName || "Uploaded workout"),
