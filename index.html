<title>Fitness Workout Tracker</title>
<style>
:root{
  --bg:#0e0d14; --card:#1a1526; --card2:#241b33; --line:rgba(255,255,255,.08);
  --txt:#f3eefa; --dim:#9d92b3; --dim2:#645a78;
  --pink:#ff3d77; --orange:#ff7a3d; --accent:#ff9d69; --green:#3ddc97;
  --grad:linear-gradient(90deg,#ff7a3d,#ff3d77);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#000;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--txt); -webkit-font-smoothing:antialiased;}
#phone{max-width:444px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:linear-gradient(175deg,#1a1023 0%,#12101c 40%,#0e0d14 100%) fixed;
  position:relative;display:flex;flex-direction:column;overflow:hidden;}
@media(min-width:500px){#phone{border-left:1px solid #241b33;border-right:1px solid #241b33;}}

.screen{flex:1;overflow-y:auto;padding-bottom:150px;display:none;}
.screen.active{display:block;}

/* ===== typography ===== */
.disp{font-style:normal;font-weight:800;letter-spacing:-.02em;}
.gradtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;}
.dim{color:var(--dim);}
.small{font-size:12px;}

/* ===== top bar ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff7a3d,#ff3d77);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.myplan{font-size:15px;font-weight:700;color:var(--txt);}
.myplan span{color:var(--dim);font-weight:400;}

/* ===== workout header ===== */
.whead{padding:10px 16px 4px;}
.wtitle-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wtitle{font-size:24px;line-height:1.15;}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:22px;padding:7px 14px;
  font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;}
.pill.pink{background:rgba(255,122,61,.14);color:var(--accent);border:1px solid rgba(255,122,61,.4);}
.pill.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--line);}
.pill.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);font-weight:600;font-size:12.5px;padding:8px 13px;}
.dots{background:none;border:none;color:var(--dim);font-size:20px;letter-spacing:1px;cursor:pointer;
  padding:4px 8px;font-family:inherit;}
.wsub{color:var(--dim);font-size:13.5px;margin-top:6px;font-weight:500;}

/* ===== exercise list ===== */
.exlist{padding:6px 16px 0;position:relative;}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 12px;position:relative;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:9px;}
.exrow .thumbwrap{position:relative;flex-shrink:0;}
.exthumb{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2a1f38,#181322);
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.07);}
.exthumb svg.big-fig{height:42px;}
.musclechip{display:none;}
.exmeta{flex:1;min-width:0;}
.exname{font-weight:750;font-size:15px;line-height:1.25;}
.exsum{color:var(--dim);font-size:12.5px;margin-top:3px;font-weight:500;}
.exdone-badge{color:var(--green);font-size:12px;font-weight:700;margin-top:2px;}
.vline{display:none;}
.ring{width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
.ring b{background:#171223;border-radius:50%;width:26px;height:26px;display:flex;
  align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.circuit-head{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;
  font-weight:700;text-transform:none;padding:10px 0 8px;}
.circuit-head .loop{color:var(--accent);font-size:15px;}
.addex{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--accent);
  font-weight:700;font-size:15px;cursor:pointer;}
.addex .plus{width:50px;height:50px;border-radius:50%;border:1.5px dashed rgba(255,122,61,.45);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);}

/* ===== bottom fixed ===== */
.bottomfix{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:444px;
  background:linear-gradient(transparent, #0d0d12 40%);padding:24px 16px 8px;z-index:40;}
.startbtn{width:100%;background:linear-gradient(90deg,#ff7a3d,#ff3d77);border:none;color:#fff;font-family:inherit;
  font-size:16px;font-weight:800;padding:15px;border-radius:26px;cursor:pointer;
  box-shadow:0 8px 28px rgba(255,61,119,.35);}
.startbtn.finish{background:var(--green);color:#0d0d12;box-shadow:0 6px 24px rgba(61,220,151,.3);}
.tabbar{display:flex;background:rgba(14,13,20,.92);border-top:1px solid rgba(255,255,255,.06);margin:10px -16px 0;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  color:#5d5570;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:4px 0;}
.tab svg{width:22px;height:22px;fill:currentColor;}
.tab.active{color:var(--accent);}

/* ===== sheet (exercise editor) ===== */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;}
.sheet-backdrop.open{display:block;}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(103%);bottom:0;width:100%;max-width:444px;
  background:var(--bg);border-radius:18px 18px 0 0;z-index:51;max-height:92vh;max-height:92dvh;
  display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.3,.9,.3,1);}
.sheet.open{transform:translateX(-50%) translateY(0);}
.sheet-scroll{overflow-y:auto;padding-bottom:120px;}
.sheet-hero{height:150px;background:linear-gradient(160deg,#2a1830, #151020 70%);border-radius:18px 18px 0 0;
  position:relative;display:flex;align-items:center;justify-content:center;}
.sheet-hero svg{height:110px;opacity:.85;}
.sheet-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(20,20,28,.8);border:1px solid #2b2b36;color:var(--txt);font-size:15px;cursor:pointer;}
.sheet-body{padding:14px 16px 0;}
.sheet-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sheet-name{font-size:22px;}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chiprow .pill{flex-shrink:0;}
.notebox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:13px;color:var(--dim);margin-top:10px;width:100%;font-family:inherit;resize:none;}
.circuit-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;
  padding:5px 11px;font-size:12px;font-weight:700;color:var(--dim);margin-top:10px;}

/* set rows */
.setlist{margin-top:12px;position:relative;}
.setrow{display:flex;align-items:center;gap:12px;padding:7px 0;}
.hex{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--dim);cursor:pointer;position:relative;
  border-radius:50%;background:rgba(255,255,255,.07);}
.hex.active{background:linear-gradient(135deg,#ff7a3d,#ff3d77);color:#fff;}
.hex.done{background:var(--green);color:#0d0d12;}
.setfields{display:flex;gap:10px;flex:1;}
.field{flex:1;position:relative;}
.field input{width:100%;background:transparent;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;
  color:var(--txt);font-size:16px;font-weight:700;padding:13px 12px 9px;
  font-family:inherit;outline:none;}
.field.ghost input{border-color:transparent;background:rgba(255,255,255,.04);color:var(--dim2);}
.field label{position:absolute;top:-7px;left:10px;background:#141020;padding:0 5px;border-radius:4px;
  font-size:10.5px;color:var(--dim);font-weight:600;display:none;}
.setrow.focus .field label{display:block;}
.setrow.focus .field input{border-color:rgba(255,122,61,.55);background:transparent;color:var(--txt);}
.setrow.done-row .field input{color:var(--green);border-color:transparent;background:rgba(61,220,151,.08);}
.fieldcap{font-size:10.5px;color:var(--dim2);margin-top:3px;padding-left:12px;}
.addset{display:flex;align-items:center;gap:12px;color:var(--pink);font-weight:750;font-size:14.5px;
  padding:10px 0;cursor:pointer;}
.addset .hex{background:transparent;border:1.5px dashed rgba(255,122,61,.45);border-radius:50%;
  color:var(--accent);height:34px;}
.addset{color:var(--accent);}
.ratebox{margin-top:14px;background:var(--card);border-radius:12px;padding:14px;}
.ratebox h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px;}
.ratebox .opts{display:flex;gap:8px;flex-wrap:wrap;}
.rateopt{background:#22222c;border:1.5px solid transparent;border-radius:18px;color:var(--dim);
  padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.rateopt.sel{border-color:var(--pink);color:var(--txt);background:rgba(230,40,90,.12);}

/* ===== history screen ===== */
.hist{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:444px;
  background:var(--bg);z-index:60;display:none;flex-direction:column;}
.hist.open{display:flex;}
.hist-top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
.backbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  color:var(--pink);font-size:16px;cursor:pointer;flex-shrink:0;}
.hist-title{flex:1;text-align:center;font-weight:800;font-size:16px;padding-right:46px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seg{display:flex;background:var(--card);border-radius:22px;margin:8px 16px;padding:3px;}
.seg button{flex:1;border:none;border-radius:19px;background:transparent;color:var(--dim);
  font-weight:700;font-size:13.5px;padding:9px;cursor:pointer;font-family:inherit;}
.seg button.sel{background:#3a3a46;color:var(--txt);}
.hist-scroll{flex:1;overflow-y:auto;padding:6px 16px 40px;}
.sess{padding:14px 0 6px;}
.sess-date{font-size:21px;margin-bottom:10px;}
.badge-pill{display:inline-block;background:var(--pink);color:#fff;border-radius:16px;
  padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}
.rate-pill{display:inline-block;border:1.5px solid #3a3946;color:var(--txt);border-radius:16px;
  padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}
.sess-label{color:var(--dim);font-size:12.5px;font-weight:600;margin:8px 0 4px;}
.sess-set{display:flex;align-items:center;gap:12px;padding:5px 0;font-weight:700;font-size:15px;}
.sess-set .hex{cursor:default;width:28px;height:32px;font-size:12px;}
.est{margin-top:10px;}
.est .lbl{color:var(--dim);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
.est .val{font-size:16px;font-weight:800;margin-top:3px;}
.est .val span{color:var(--pink);font-weight:700;font-size:13px;}
.sess-note{margin-top:8px;color:var(--dim);font-size:13px;}
.sess-note b{color:var(--txt);font-size:12.5px;display:block;margin-bottom:2px;}
.sess-hr{border:none;border-top:1px solid #1e1e28;margin:14px 0 0;}

/* trends cards */
.tcard{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;}
.tcard-top{display:flex;justify-content:space-between;align-items:center;}
.tcard-top h4{margin:0;font-size:15px;font-weight:750;}
.tcard-top .chev{color:var(--dim2);}
.tcard .big{font-size:30px;margin-top:8px;}
.tcard .big span{font-size:14px;color:var(--txt);font-weight:700;}
.tcard .logged{color:var(--dim);font-size:12px;margin-top:3px;}
.tcard .chartwrap{margin-top:10px;}
.tcard .foot{text-align:center;color:var(--dim2);font-size:11px;margin-top:6px;}

/* ===== modal / action sheet ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:70;display:none;
  align-items:flex-end;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--card);width:100%;max-width:444px;border-radius:18px 18px 0 0;
  max-height:75vh;display:flex;flex-direction:column;}
.modal h3{margin:0;padding:18px 18px 8px;font-size:17px;}
.modal .mlist{overflow-y:auto;padding:6px 10px 26px;}
.mitem{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer;}
.mitem:active{background:#252530;}
.mitem .mi-name{font-weight:700;font-size:15px;flex:1;}
.mitem .mi-sub{color:var(--dim);font-size:12px;margin-top:2px;}
.mitem .check{color:var(--pink);font-weight:800;}
.mitem.danger .mi-name{color:#ff5f76;}

/* ===== toast ===== */
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#2a2a36;color:var(--txt);padding:11px 20px;border-radius:24px;font-size:13.5px;
  font-weight:700;opacity:0;transition:all .3s;z-index:90;pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.5);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== body / targets / log tabs ===== */
.page-pad{padding:6px 16px;}
.h1{font-size:24px;margin:10px 0 2px;}
.bgroup{background:var(--card);border-radius:14px;margin-top:12px;overflow:hidden;}
.bg-head{padding:13px 15px;font-weight:800;font-size:16px;display:flex;align-items:baseline;gap:8px;
  border-left:4px solid var(--orange);}
.bg-head .d{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600;background:#26262f;
  padding:3px 9px;border-radius:14px;}
.bpart{padding:11px 15px;border-top:1px solid #23232d;}
.bpart .pname{font-weight:750;font-size:14px;}
.bpart .ptag{color:var(--green);font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;margin-left:6px;}
.bpart .pdesc{color:var(--dim);font-size:12.5px;margin-top:3px;}
.bpart .pex{color:var(--txt);font-size:12.5px;font-weight:600;margin-top:3px;}
.rulerow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;
  padding:13px 15px;margin-top:10px;}
.rulerow .rep{font-size:19px;font-weight:800;color:var(--accent);min-width:44px;}
.rulerow .rmeta{flex:1;}
.rulerow .rt{font-weight:750;font-size:14px;}
.rulerow .rs{color:var(--dim);font-size:12.5px;margin-top:2px;}
.pillrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.gpill{background:rgba(255,122,61,.12);border:1px solid rgba(255,122,61,.4);color:var(--accent);
  border-radius:18px;padding:6px 13px;font-size:12.5px;font-weight:700;}
.logday{background:var(--card);border-radius:14px;padding:14px 15px;margin-top:12px;}
.logday .ld-date{font-size:17px;}
.logday .ld-w{color:var(--dim);font-size:13px;margin-top:3px;font-weight:600;}
.logday .ld-ex{margin-top:8px;font-size:13px;color:var(--dim);}
.logday .ld-ex b{color:var(--txt);}
.emptybox{color:var(--dim);font-size:13.5px;background:var(--card);border-radius:12px;
  padding:16px;margin-top:12px;line-height:1.5;}
.tinybtns{display:flex;gap:8px;margin-top:14px;}
.tinybtn{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:16px;
  padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ===== body tab: results ===== */
.ohead{display:flex;align-items:center;gap:8px;margin-top:18px;}
.ohead .h1{margin:0;}
.ohead .info{width:22px;height:22px;border-radius:50%;background:#2a2a34;color:var(--dim);
  font-size:12px;display:flex;align-items:center;justify-content:center;}
.ohead .chev-pink{margin-left:auto;color:var(--pink);font-size:22px;font-weight:800;}
.orow{display:flex;align-items:center;gap:16px;margin-top:8px;}
.oscore{font-size:56px;font-style:italic;font-weight:800;letter-spacing:-.03em;}
.ostrip{display:flex;gap:5px;flex:1;}
.obar{flex:1;max-width:16px;height:48px;background:rgba(255,255,255,.07);transform:skewX(-16deg);border-radius:3px;}
.obar.fill{background:linear-gradient(180deg,#ff7a3d,#ff3d77);}
.mgcard{background:var(--card);border-radius:16px;margin-top:14px;padding:2px 15px 4px;}
.mghead{display:flex;align-items:center;gap:9px;padding:13px 0 11px;}
.mghead .gname{font-weight:800;font-size:16px;}
.trendpill{background:rgba(255,122,61,.18);color:var(--accent);border-radius:12px;padding:1px 8px;font-size:11px;font-weight:800;}
.mghead .gscore{color:var(--dim);font-size:13px;font-weight:600;}
.mghead .gscore b{color:var(--txt);font-style:italic;font-size:15px;font-weight:800;}
.mrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #23232d;cursor:pointer;}
.mrow .mmeta{width:96px;}
.mrow .mname{font-weight:700;font-size:14px;}
.mrow .mscore{font-size:27px;font-style:italic;font-weight:800;margin-top:2px;}
.mrow .spark{flex:1;display:flex;justify-content:flex-end;}
.mrow .chev{color:var(--dim2);font-size:18px;}
.benchcard{background:linear-gradient(150deg,#2c1a33,#161020 65%);border:1px solid rgba(255,255,255,.06);
  border-radius:16px;margin-top:12px;padding:16px;position:relative;overflow:hidden;}
.benchcard .bl-label{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:800;text-transform:uppercase;}
.benchcard .bl-sub{font-size:12px;color:var(--dim);margin-top:6px;}
.benchcard .bl-val{font-size:30px;font-style:italic;font-weight:800;margin-top:2px;}
.benchcard .bl-val span{font-size:13px;font-weight:700;}
.benchcard .bl-fig{position:absolute;right:10px;top:10px;opacity:.5;}

/* body tab: drill-in */
.mseg{display:flex;background:var(--card);border-radius:22px;margin:4px 0 14px;padding:3px;}
.mseg button{flex:1;border:none;border-radius:19px;background:transparent;color:var(--dim);
  font-weight:700;font-size:12px;padding:8px 2px;cursor:pointer;font-family:inherit;}
.mseg button.sel{background:#3a3a46;color:var(--txt);}
.rangehead{font-size:34px;font-style:italic;font-weight:800;}
.rangehead span{font-size:13px;color:var(--dim);font-weight:700;font-style:normal;}
.rangesub{color:var(--dim);font-size:13px;margin-top:2px;}
.statrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border-radius:14px;padding:15px 16px;margin-top:10px;font-weight:700;font-size:14.5px;}
.statrow b{font-size:15px;}
.explain{margin-top:22px;}
.explain h3{font-style:italic;font-weight:800;font-size:22px;margin:0 0 8px;}
.explain p{color:var(--dim);font-size:14px;line-height:1.55;margin:0;}

/* body tab: recovery */
.recstats{display:flex;justify-content:space-between;margin-top:16px;gap:10px;}
.recstat .num{font-size:40px;font-style:italic;font-weight:800;}
.recstat .cap{font-size:10px;letter-spacing:.09em;color:var(--dim);font-weight:800;text-transform:uppercase;max-width:110px;line-height:1.4;}
.recfig{display:flex;justify-content:center;margin-top:6px;position:relative;}
.recfig svg{height:380px;}
.flipbtn{position:absolute;left:6px;bottom:6px;width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer;}
.reclegend{display:flex;gap:14px;justify-content:center;margin-top:10px;color:var(--dim);font-size:11.5px;font-weight:700;}
.reclegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;}
.mh-row{display:flex;align-items:center;gap:12px;padding:9px 0;}
.mh-row .exthumb{width:52px;height:52px;}
.mh-ago{font-size:10.5px;letter-spacing:.08em;color:var(--dim);font-weight:800;text-transform:uppercase;}
.mh-name{font-weight:750;font-size:15px;margin-top:2px;}
.mh-sets{color:var(--dim);font-size:12.5px;margin-top:2px;}
#storagewarn{display:none;background:#2b2030;color:#d9a0e8;font-size:12px;padding:9px 16px;}
/* ===== daily cycle flow ===== */
#flowroot{padding:2px 16px 40px;}
.locpill{font-size:11px;font-weight:800;color:var(--accent);background:rgba(255,122,61,.13);
  border:1px solid rgba(255,122,61,.4);border-radius:14px;padding:4px 11px;}
.fsteps{display:flex;gap:6px;margin-top:14px;}
.sd{height:4px;border-radius:2px;flex:1;background:rgba(255,255,255,.09);}
.sd.on{background:linear-gradient(90deg,#ff7a3d,#ff3d77);}
.fsteplabel{color:var(--dim2);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:7px 0 4px;}
.todaycard{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
  display:flex;align-items:center;gap:12px;margin-top:10px;}
.todaycard .cal{width:46px;height:46px;border-radius:12px;background:rgba(255,122,61,.14);border:1px solid rgba(255,122,61,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.todaycard .cal b{font-size:14px;color:var(--accent);line-height:1.1;}
.todaycard .cal span{font-size:8.5px;color:var(--accent);font-weight:800;letter-spacing:.06em;}
.fq{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:22px 0 5px;line-height:1.15;}
.fqsub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.5;}
.fgym{background:rgba(255,255,255,.035);border:1.5px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:13px;
  display:flex;align-items:center;gap:15px;cursor:pointer;position:relative;}
.fgym.sel{border-color:rgba(255,122,61,.65);background:rgba(255,122,61,.07);}
.fgym .gicon{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2a1f38,#181322);
  border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.fgym .gname{font-weight:800;font-size:18px;}
.fgym .gsub{color:var(--dim);font-size:12px;margin-top:3px;line-height:1.4;}
.fgym .gtag{position:absolute;top:12px;right:16px;font-size:9.5px;font-weight:800;letter-spacing:.07em;color:var(--accent);
  background:rgba(255,122,61,.13);border:1px solid rgba(255,122,61,.4);border-radius:11px;padding:3px 8px;}

lis + brachioradialis, pushes the arm up/out. STALLED at 22.5-25 since June \u2014 break the ceiling.", "sets": [{"warmup": false, "reps": 10, "weight": 25}, {"warmup": false, "reps": 10, "weight": 25}, {"warmup": false, "reps": 10, "weight": 25}, {"warmup": false, "reps": 10, "weight": 25}]}, {"name": "Overhead Rope Extension", "weight_note": null, "target": "4 \u00d7 10\u201315", "rest": "60\u201390 sec", "note": "Triceps \u2014 long head, half your arm's mass.", "sets": [{"warmup": false, "reps": 10, "weight": 30}, {"warmup": false, "reps": 10, "weight": 30}, {"warmup": false, "reps": 10, "weight": 30}, {"warmup": false, "reps": 10, "weight": 30}]}, {"name": "Spider or Preacher Curl", "weight_note": "Per Arm", "target": "4 \u00d7 10\u201312", "rest": "60\u201390 sec", "note": "Biceps \u2014 short head, width.", "sets": [{"warmup": false, "reps": 10, "weight": 20}, {"warmup": false, "reps": 10, "weight": 20}, {"warmup": false, "reps": 10, "weight": 20}, {"warmup": false, "reps": 10, "weight": 20}]}, {"name": "Straight-Bar Pushdown", "weight_note": null, "target": "4 \u00d7 12\u201315", "rest": "60\u201390 sec", "note": "Triceps \u2014 lateral head, outline. Last logged (pushdown): 8x55.", "sets": [{"warmup": false, "reps": 12, "weight": 44}, {"warmup": false, "reps": 12, "weight": 44}, {"warmup": false, "reps": 12, "weight": 44}, {"warmup": false, "reps": 12, "weight": 44}]}, {"name": "Cable Curl", "weight_note": "Arm behind body", "target": "4 \u00d7 12\u201315", "rest": "60\u201390 sec", "note": "Biceps \u2014 long head, peak, constant tension. Finisher.", "sets": [{"warmup": false, "reps": 12, "weight": 20}, {"warmup": false, "reps": 12, "weight": 20}, {"warmup": false, "reps": 12, "weight": 20}, {"warmup": false, "reps": 12, "weight": 20}]}]}, {"name": "Day 7 \u00b7 Long Run", "subtitle": "Key session \u00b7 Sun", "wnote": "Your most important run of the week \u2014 3 days after legs, leading into an upper-body day. Add ~1.5 km every 1-2 weeks; build to 18-19 km 2-3 weeks before race day, then taper. Every 4th week cut it back ~25% \u2014 that down week is not optional. Pace: easy and conversational the whole way. Eat at maintenance today (~2,700-2,800) with extra carbs around the run.", "exercises": [{"name": "Long Run", "weight_note": null, "target": null, "rest": null, "note": "Easy, conversational pace the whole way. Time on feet builds endurance, not speed. Track in km.", "sets": [{"duration": "60:00"}]}]}], "histories": {}, "muscleRef": {"meta": {"owner": "SP", "created": "2026-07-29", "updated": "2026-07-29 \u2014 added training plan format (trainingplan copy.html): 7-day week, rep ranges, runs, rules, nutrition, supplements", "source": "musclereference.html + musclereference_1.html (v2 adds 'Your Physique Read' \u2014 check-in video analysis, July 2026)", "purpose": "Master database for suggesting workouts that SP logs into a Fitbod-style app replica. Goal: break the progress stall by pushing intensity/volume progression instead of repeating the same sets/reps/weight.", "status": "Reference + physique read + goals ingested. This is what every suggested workout must target."}, "physique_read": {"context": "From SP's check-in video, July 2026. Height 6'0\"-6'2\", weight 185 lb.", "region_by_region": {"face_neck": "Lean. No fat storage here \u2014 sign overall body fat is moderate, not high.", "chest": "Upper chest flat below the collarbone \u2014 clavicular head is the clear gap. Some base in mid pec, no chest fat. This is why incline work leads both chest days.", "belly_waist": "The one real fat store: soft lower belly below the navel, love handles wrapping the sides. Upper abs close to showing already \u2014 the lower zone needs the deficit. Roughly upper-teens to ~20% body fat overall; 'shredded' means getting this zone to ~12%.", "arms": "Slim, minimal fat \u2014 little to cut, only muscle to add. Biceps and triceps both lack mass; forearms thin. Faint vein hints near wrist and inner elbow mean vascularity is waiting under a thin fat layer \u2014 build brachioradialis/brachialis and it will surface.", "shoulders": "Narrow-reading frame because side delts are undeveloped \u2014 caps don't yet round outward past the joint. Biggest visual multiplier available: every inch here makes the waist look smaller.", "back": "Lean \u2014 spine and shoulder blades visible, so definition will show quickly as muscle comes. Lats narrow, don't yet flare from the armpit; mid-back thickness light. Big growth runway.", "posture": "Nothing alarming on video. Rear-delt and mid-back work is protective anyway, given 6 pressing-heavy days."}, "overall_read": "Leaner than the scale suggests \u2014 weight sits on a tall frame, fat concentrated in one stubborn zone (lower belly/love handles) rather than spread everywhere. Classic last-to-go fat storage; the mirror will change disproportionately fast once that zone starts draining.", "real_limiter": "MUSCLE, not fat. Visible mass is light for 2+ years of training \u2014 most visibly arms, side delts, lats. Dieting alone would make SP smaller, not shredded. The plan is a RECOMPOSITION: build muscle while slowly cutting 185 -> 170-175 lb at ~0.5 lb/week, roughly 3-5 months of runway, matching the half-marathon block."}, "goals_and_focus_points": {"ordered_focus": [{"rank": 1, "focus": "Progressive overload", "detail": "The most likely gap given training age vs visible mass. Log every lift; if weight or reps aren't climbing month over month, fix that before touching anything else. This single habit outweighs every supplement combined."}, {"rank": 2, "focus": "Arms, side delts, lats", "detail": "The three thinnest areas and the entire path to veiny arms and the V-taper. The plan biases them: 22+ direct arm sets per week, lateral raises as the priority shoulder move, width-first back work."}, {"rank": 3, "focus": "Small deficit, high protein", "detail": "~2,350 cal, 180 g protein, maintenance calories on long-run days. A crash cut at this leanness burns the muscle being built and leaves you flat and softer-looking \u2014 opposite of the goal."}, {"rank": 4, "focus": "Patience on the belly zone", "detail": "Lower-belly and love-handle fat is hormonally last to leave for most men. No exercise targets it, no supplement burns it; the deficit drains it on its own schedule. Upper abs show first, handles go last \u2014 don't mistake that order for failure."}, {"rank": 5, "focus": "Track with photos, not the mirror", "detail": "Same lighting, same poses as the check-in video, every 3-4 weeks. Recomposition can look like nothing day to day while monthly photos show clear change."}], "nutrition": {"calories": 2350, "protein_g": 180, "note": "Maintenance calories on long-run days", "weight_target": "185 -> 170-175 lb at ~0.5 lb/week over 3-5 months"}, "cardio_context": "Half-marathon training block runs concurrently \u2014 plan runs 3-5 months to match it.", "weekly_volume_targets": {"direct_arm_sets": "22+", "shoulder_priority": "Lateral raises lead shoulder day", "back_bias": "Width-first (lats before mid-back)"}}, "progression_philosophy": {"problem": "Progress stalled because workouts repeat the same volume (e.g., biceps curls at 5 sets / 30 total reps every session). No overload = no adaptation.", "principle": "Every session should push past the last one \u2014 more sets, more reps, or more weight. Example given: move from 5 sets/30 reps to 7 sets/40 reps and keep climbing to improve weight production and endurance.", "rep_intensity_rules": [{"reps_achieved": "10+", "meaning": "Too easy at this weight", "action": "Increase the weight"}, {"reps_achieved": "8-9", "meaning": "Almost to max", "action": "Close to the right load; push toward 10+ then bump weight"}, {"reps_achieved": "5-7", "meaning": "Medium hard", "action": "Solid working weight; grind for more reps each session"}, {"reps_achieved": "3-4", "meaning": "Hard, truly pushing", "action": "Heavy strength work; stay here only intentionally"}], "tracking_requirement":  "Sternal / stretch"}, {"rank": 5, "name": "Dips", "why": "Large loaded stretch at long muscle length; good secondary press.", "part": "Lower/sternal"}], "priority_pick": "Upper chest: 30\u00b0 incline press + low-to-high cable fly \u2014 the only common isolation matching the clavicular fiber direction. Above ~45\u00b0 the front delt takes over.", "modifiers": "Incline 30\u00b0 (max 45\u00b0) \u00b7 elbows ~45\u00b0, not flared \u00b7 full deep stretch \u00b7 lengthened partials after failure are legit."}, "Triceps": {"top": [{"rank": 1, "name": "Overhead Cable Extension", "why": "Maeo 2023: overhead training grew triceps ~1.4x more than pushdowns (+28.5% vs +19.6% long head) \u2014 strongest single-exercise finding in upper-body literature.", "part": "Long head"}, {"rank": 2, "name": "Skullcrusher", "why": "Lower the bar behind the head \u2014 adds shoulder flexion and long-head stretch (Nippard S-tier).", "part": "Long + lateral"}, {"rank": 3, "name": "Rope Pushdown", "why": "Best short-position complement; stable and easy to progress.", "part": "Lateral + medial"}, {"rank": 4, "name": "Seated Overhead DB Extension", "why": "Same overhead mechanism, unilateral option, shoulder-friendly for tall frames.", "part": "Long head"}, {"rank": 5, "name": "Close-Grip Bench Press", "why": "Heavy compound mass builder \u2014 but pressing barely grows the long head, so overhead work stays essential.", "part": "Lateral + medial"}], "priority_pick": "Long head: overhead cable extension, full elbow bend at the bottom. Cable > dumbbell (constant tension in the stretch).", "modifiers": "Max stretch matters more than lockout \u00b7 face away from stack, staggered stance \u00b7 lengthened partials work well here."}, "Shoulders": {"top": [{"rank": 1, "name": "Cable Lateral Raise", "why": "Constant tension including the bottom/stretch where dumbbells give none; 2025 RCT shows equal growth to DBs \u2014 cables win on tension profile.", "part": "Side delt"}, {"rank": 2, "name": "Lateral Raise", "why": "Equal growth per 2025 head-to-head; cheap volume, easy to push to failure; lean-away adds bottom tension.", "part": "Side delt"}, {"rank": 3, "name": "Machine Rear Delt Fly", "why": "Reverse pec deck is the best-supported rear-delt isolation \u2014 locked path, full-ROM tension (Nippard S-tier over face pulls).", "part": "Rear delt"}, {"rank": 4, "name": "Seated DB Overhead Press", "why": "Seated/supported beats standing for hypertrophy (more pressing overload, Saeterbakken 2013). One press is plenty for him.", "part": "Front delt"}, {"rank": 5, "name": "Face Pull", "why": "Rear/side delt + lower trap + cuff health in one accessory slot.", "part": "Rear + side"}], "priority_pick": "Side delts: cable lateral raise as the anchor, DB laterals second \u2014 12-20 reps near failure; total hard sets drive width. Pressing alone never builds them.", "modifiers": "Raise in scapular plane (~20-30\u00b0 forward), lead with the elbow \u00b7 bottom-half is the money \u2014 bottom-half partials after failure \u00b7 rear delt flys: arms ~30-45\u00b0 from torso, don't turn it into a row."}, "Back": {"top": [{"rank": 1, "name": "Pull-up or Lat Pulldown", "why": "Medium/neutral grip pulldown: S-tier stretch + tension + progression; medium grip \u2248 wide for lat EMG with better loading (Andersen 2014).", "part": "Lats (width)"}, {"rank": 2, "name": "Pull-up", "why": "Highest absolute tension; near-identical lat EMG to pulldowns; add weight past ~10-12 reps.", "part": "Lats"}, {"rank": 3, "name": "Chest-Supported Row", "why": "Nippard's #1 back exercise: stability removes low-back limits; full protract-retract drives trap/rhomboid growth.", "part": "Mid-back"}, {"rank": 4, "name": "Cross-Body Lat Pull-Around", "why": "Loads the lat in its most stretched line of pull with constant cable tension \u2014 the outer-sweep builder.", "part": "Lower/outer lats"}, {"rank": 5, "name": "Seated Cable Row", "why": "Smooth resistance, deep stretch; elbow path (not grip) sets lat vs upper-back bias.", "part": "Lats or mid-back"}, {"rank": 6, "name": "Meadows Row", "why": "Extreme unilateral lat stretch (S-tier); straight-arm pulldown as no-biceps lat accessory.", "part": "Lats"}], "priority_pick": "Lat width: medium-grip pulldown + weighted pull-ups, with bottom-half lengthened partials from full stretch when strength stalls. Deadlifts are C-tier for width.", "modifiers": "Medium grip (~1.5x shoulder), not extreme wide \u00b7 overhand/neutral keeps it lat-dominant \u00b7 rows: elbows ~30-45\u00b0 tucked = lats, flared = rear delt/rhomboids \u00b7 slight 15-20\u00b0 lean-back on pulldowns, bar to upper chest."}, "Biceps": {"top": [{"rank": 1, "name": "Incline Dumbbell Curl", "why": "2025 trial: more biceps growth (especially proximal/peak region) than preacher curls \u2014 shoulder extension stretches the long head.", "part": "Long head (peak)"}, {"rank": 2, "name": "Bayesian Cable Curl", "why": "Same stretched long-head mechanics with constant cable tension; at worst equal to preacher (2025 RCT).", "part": "Long head"}, {"rank": 3, "name": "Preacher Curl", "why": "MRI work: more distal-biceps, brachialis and brachioradialis growth than incline curls \u2014 the mass-near-the-elbow builder.", "part": "Short head + brachialis"}, {"rank": 4, "name": "EZ-Bar Curl", "why": "Supinated grip maximizes biceps EMG (+12-19% vs neutral); heavy, simple base builder.", "part": "Both heads"}, {"rank": 5, "name": "Cable Curl", "why": "Low-pulley curl stepped forward keeps tension in the bottom stretch \u2014 lengthened-bias training showed ~89% greater CSA gain vs mixed.", "part": "Whole biceps"}], "priority_pick": "Peak: incline dumbbell curl (only exercise with direct longitudinal evidence of superior proximal-biceps growth). Keep the elbow behind the torso line.", "modifiers": "Full supination, pinky-up \u00b7 slow eccentrics are cheap extra stimulus \u00b7 majority stretch-position curls + one preacher slot for brachialis."}, "Forearms": {"top": [{"rank": 1, "name": "Reverse Curl", "why": "Pronation sidelines the biceps, shifting load to brachioradialis + brachialis \u2014 RP's go-to vein-muscle move.", "part": "Brachioradialis"}, {"rank": 2, "name": "Hammer Curl", "why": "Neutral grip allows heavier loads = more total tension on brachioradialis/brachialis.", "part": "Brachioradialis + brachialis"}, {"rank": 3, "name": "Cross-Body Hammer Curl", "why": "Cross-body path further biases brachialis; rotate with strict hammers.", "part": "Brachialis"}, {"rank": 4, "name": "Behind-Back Wrist Curl", "why": "Cable/roller-style dynamic loading beats DB wrist curls (RP: dynamic > isometric for size).", "part": "Wrist flexors"}, {"rank": 5, "name": "Wrist Extensions", "why": "Extensors sit on the visible top/outer forearm next to the brachioradialis; recover fast, tolerate 5-10 sets/wk.", "part": "Wrist extensors"}], "priority_pick": "Vein muscle: heavy hammer curls + preacher curls (the pair with actual MRI growth data for brachialis/brachioradialis) + reverse curls for pronated volume.", "modifiers": "Thumbless grip on reverse curls \u00b7 slow eccentrics \u00b7 forearms at session end, 10-20 reps \u00b7 leanness makes the veins show \u2014 training builds what pops."}, "Abs": {"top": [{"rank": 1, "name": "Cable Crunch", "why": "Only common ab move with true progressive loading through full spinal flexion (Nippard #1), 8-15 reps.", "part": "Whole rectus (upper bias)"}, {"rank": 2, "name": "Hanging Leg Raise", "why": "Top rectus EMG across studies \u2014 but curl the pelvis up (posterior tilt), don't just lift legs.", "part": "Lower bias"}, {"rank": 3, "name": "Reverse Crunch", "why": "Preferentially activates the lower segment when initiated by posterior pelvic tilt (Sarti et al.).", "part": "Lower"}, {"rank": 4, "name": "Ab Wheel Rollout", "why": "High rectus EMG under anti-extension load with tension in the lengthened position.", "part": "Whole"}, {"rank": 5, "name": "Weighted Side Bend", "why": "#1 oblique EMG by a wide margin; loadable for shape.", "part": "Obliques"}], "priority_pick": "Lower abs: regional bias is PARTIALLY real \u2014 it works only via posterior-pelvic-tilt movements (reverse crunch, hanging raise curling pelvis up). No exercise burns the fat over them.", "modifiers": "Load abs like any muscle: 8-15 reps near failure, add weight over time. 50+ bodyweight reps = endurance, not growth."}, "Quads": {"top": [{"rank": 1, "name": "Hack Squat", "why": "Machine stability = near-failure training with deep-stretch tension, no low-back limit; ideal for tall lifters (Nippard S-tier).", "part": "All vasti"}, {"rank": 2, "name": "Leg Extension", "why": "The only common lift that grows the rectus femoris (Maeo 2018); reclining the seatback ~40\u00b0 grows it more (Larsen 2024).", "part": "Rectus femoris"}, {"rank": 3, "name": "Smith Machine Squat", "why": "Deep squats (~120\u00b0 knee) grew quads significantly more than shallow (Bloomquist 2013); Smith keeps a tall torso upright.", "part": "Vasti"}, {"rank": 4, "name": "Squat or Leg Press", "why": "Low+narrow feet, deep ROM = lengthened vasti loading with near-zero systemic cost \u2014 the best runner-compatible heavy slot.", "part": "Vasti"}, {"rank": 5, "name": "Bulgarian Split Squat", "why": "Big loaded stretch + fixes runner asymmetries \u2014 but the most soreness-costly; keep 48h+ from hard runs.", "part": "Vasti + glutes"}], "priority_pick": "Runner-friendly core: leg press + leg extensions carry volume in race-build weeks; one heavy hack/Smith squat slot stays.", "modifiers": "Depth beats load (\u2265120\u00b0 knee flexion) \u00b7 recline the leg-extension seatback \u00b7 heel elevation helps tall lifters \u00b7 low narrow feet on press = quads."}, "Hamstrings": {"top": [{"rank": 1, "name": "Seated Leg Curl", "why": "Maeo 2021: ~50% more hamstring growth than lying curls (14% vs 9%) \u2014 hips flexed = biarticular hamstrings lengthened. Best runner-friendly pick.", "part": "All heads"}, {"rank": 2, "name": "Romanian Deadlift", "why": "Long-length hip hinge biasing BF long head + semimembranosus (the heads curls miss) + hamstring-strain insurance for running.", "part": "Long head"}, {"rank": 3, "name": "45\u00b0 Back Extension", "why": "Same long-length hip-extension stimulus as RDL with far less spinal/systemic load.", "part": "Long head"}, {"rank": 4, "name": "Nordic Curl", "why": "~50% hamstring-strain risk reduction in runners + real growth; introduce at tiny volume, 8+ weeks out from race.", "part": "Semitendinosus"}, {"rank": 5, "name": "Lying Hamstrings Curl", "why": "Still productive; slightly different regional bias \u2014 variation, not default.", "part": "Distal"}], "priority_pick": "Seated curl is the flagship stretch-hypertrophy finding \u2014 lean the torso slightly forward over the pads for even more stretch. RDLs: 1 hard session/week, day after (not before) the hardest run.", "modifiers": "Squats/leg presses do NOT grow hamstrings \u2014 dedicated work is non-negotiable \u00b7 RDL: stop at end-range stretch, the bottom half is the money."}, "Glutes": {"top": [{"rank": 1, "name": "Barbell Hip Thrust", "why": "Plotkin 2023 RCT: equal glute growth to squats \u2014 wins for a runner on near-zero soreness/axial fatigue.", "part": "Whole glute max"}, {"rank": 2, "name": "Machine Hip Thrust", "why": "Same stimulus, faster setup.", "part": "Glute max"}, {"rank": 3, "name": "Machine Hip Abduction", "why": "The only listed move that grows glute MEDIUS (squats/thrusts don't) \u2014 directly tied to runner's-knee/ITB resilience.", "part": "Glute medius"}], "priority_pick": "Your squats + RDLs already cover glute max (equal growth per RCT). The highest-ROI addition for a runner is glute-med abduction work.", "modifiers": "Full lockout with posterior pelvic tilt \u00b7 lean torso forward on abductions \u00b7 pick glute work by recovery cost, not burn."}, "Calves": {"top": [{"rank": 1, "name": "Standing Calf Raise", "why": "Kinoshita 2023: standing grew the gastrocnemius ~2-3x more than seated (12% vs 2%) \u2014 straight knee keeps it lengthened.", "part": "Gastrocnemius"}, {"rank": 2, "name": "Leg Press Calf Press", "why": "Kassiano 2023: bottom-half partials at long length grew calves MORE than full ROM (15% vs 7%) \u2014 easy to load the stretch here.", "part": "Gastroc + soleus"}, {"rank": 3, "name": "Seated Calf Raise", "why": "Soleus-only \u2014 and your 3 runs/week already hammer the soleus. Skip or 1-2 maintenance sets.", "part": "Soleus"}], "priority_pick": "Standing raises with a 2-3 second dead-stop pause in the deep stretch \u2014 kills the Achilles rebound so the muscle takes the tension; doubles as tendon conditioning for running.", "modifiers": "Full stretch matters far more than the top \u2014 never cut the bottom \u00b7 slow 2-3s eccentric \u00b7 train calves after runs or on easy days, never before intervals/long run."}}, "best_exercises_sources": ["Maeo 2023 \u2014 overhead vs neutral triceps extension, Eur J Sport Sci", "Maeo 2021 \u2014 seated vs lying leg curl hypertrophy", "Kinoshita 2023 \u2014 standing vs seated calf raise, Frontiers in Physiology", "Kassiano 2023 \u2014 long-length partial calf training, JSCR", "Rodr\u00edguez-Ridao 2020 \u2014 bench incline angle EMG (30\u00b0 clavicular peak)", "Plotkin 2023 \u2014 hip thrust vs squat glute growth, Frontiers in Physiology", "Frontiers 2025 \u2014 dumbbell vs cable lateral raise RCT (equal growth)", "2025 incline vs preacher curl trial \u2014 more proximal biceps growth from incline", "Preacher-vs-Bayesian curl RCT 2025 \u2014 preacher grows brachialis (~10%)", "Bloomquist 2013 \u2014 deep vs shallow squat quad growth", "Larsen 2024 \u2014 reclined leg-extension seatback grows rectus femoris more", "PeerJ 2024/25 + Ulster meta \u2014 lengthened partials \u2265 full ROM in trained lifters", "Andersen 2014 \u2014 pulldown grip width EMG (medium \u2248 wide)", "Schumann 2022 meta \u2014 concurrent running doesn't blunt hypertrophy when managed", "Schoenfeld / Sarti \u2014 lower-rectus bias via posterior pelvic tilt (partial support)", "Sources compiled via Stronger By Science, RP Strength, Henselmans, Nippard tier lists, BarBend research summaries"], "replica_design_rules": ["WORKOUT TAB REDESIGN \u2014 mockups APPROVED, still not coded. Do NOT touch app code until SP says go.", "Screen 1 \u00b7 Gym location picker: The Rec or EOS. Drives everything downstream.", "Screen 2 \u00b7 Day picker: Day 1-7 list, cycle-aware (done days checked, next day pre-selected, any day tappable).", "Screen 3 \u00b7 Default workout + change level: four OPTIONAL buttons (Keep 0, Small 0-1, Some 1-2, Big 2-4). NOTHING SELECTED = default schedule; a selection = changed schedule. Bottom button is GENERATE.", "Screen 4 \u00b7 Exercise detail (tap any exercise): hero + How-To + Rest timer/History/Replace chips on top; below that a 'Last Exercise \u00b7 <name>' block (renamed from Fitbod's '4 Exercises') containing exercise name, day+date performed, exact upload time + gym, then sets/reps lines with green completion check. '...' menu = Edit sets & reps / Replace / Delete entry. '+' = add exercise via muscle-grouped picker.", "Screen 5 \u00b7 Copy page (after Generate) \u2014 APPROVED LAYOUT = variant A: monospace text block in the EXACT format of SP's docx, copy-sign button in the card header (flips to green 'Copied' + toast), Done button bottom right returns to Screen 1.", "OUTPUT FORMAT (from SP's docx, must match exactly): 'Day N: Name' / muscle-set breakdown line e.g. '3 Back (4 sets each) 2 Bicep (5 sets each)' / then per exercise: name, then one line per set as 'reps<TAB>weight' (reps FIRST) / then 'The rest of the Day Schedule so you forgot:' listing every other day's muscle+set structure.", "DOC DAY STRUCTURE: D1 Push = 3 Chest (4 sets) + 2 Tricep (5 sets); D2 Shoulders and ABs = 3 Shoulders (4) + 2 Forearm (4) + Abs; D3 Pull = 3 Back (4) + 2 Bicep (5); D4 Legs = 2 Quads + 2 Hams + 1 Calves (4 each); D5 = 3 Chest + 3 Back (4 each); D6 = 3 Bicep + 3 Tricep (4 each); D7 = Run Day.", "CORE RULE \u2014 PER-GYM TRACKING: same exercise at EOS vs Rec = two different lifts (different machines/stacks). Separate history, suggested weights, est-1RMs, trends, progression. Never mix gyms.", "Swap rules for Generate: stay inside the same muscle part, draw from the research-ranked lists, prefer unused-recently, never downgrade a priority slot, gym-equipment aware, re-roll available.", "OPEN: assign existing Fitbod history to a gym; real equipment lists per gym; whether to reshape stored default days to the docx exercise counts."], "standing_rules": ["APP NAME: 'Fitness Workout Tracker' (formerly 'Fitbod replica').", "MOST IMPORTANT \u2014 EVERY TIME: any data write (upload/edit/clear, logged sets, saved run, day Done) must IMMEDIATELY update the Body tab and Log tab (refreshTabs()). Never ship a change that breaks this.", "Always rebuild with build.py and keep STORE_KEY unchanged between versions unless the data model truly changes, so the user's saved data survives updates.", "Before acting on a new prompt: save current state (build + snapshot) so all past work is preserved.", "PROGRESSIVE OVERLOAD ENGINE (core goal): recommended weights auto-increase when SP is ready \u2014 any set hitting 10+ reps bumps that weight tier up. The bump uses the exercise's OWN detected increment (most common gap between distinct logged weights per gym, e.g. cable stack 55/66/77 = 11-lb steps); fallback 5 lb (2.5 lb under 30). Runs in day view, Generate, sheets, and copy text; shows \u2b06 push pill + explanation.", "RUNNING UNITS: kilometers (km, min/km) everywhere \u2014 never miles.", "DAY-FREE REDESIGN (v20, Aug 5 2026): The 7-day cycle is GONE from the app. Flow = gym -> multi-select muscle picker (readiness + focus stars, sorted most-rested first) -> trend-built session (sets/reps/weights authored from per-gym logged history; push rules apply; focus parts get a +1 scout top set at 3-4 reps) -> copy page. Copy header is muscle names ('Chest and Triceps'); trailer is now 'Muscle status so you know what's ready:' (parser stops there; old 'Day N:' texts still parse). Runs are user-choice (no weekday pinning). dayDone removed; migration preserves histories/logbook/runs/upload/seeds. The 7-day PLAN remains in new_plan.py only as seed/baseline-weight data for planDefaultW().", "SET TYPES (v21): every built session tags sets \u2014 WU warm-up opener (first exercise per muscle, one easy set of 10 at ~55% snapped to the lift's own weight steps, never overextend), WS working set (default, unmarked), SS superset finisher (last working set of ONE exercise per muscle: the drop is ~22% snapped to the lift's steps, 6+ reps to max the muscle; assigned to a plateaued lift first \u2014 same top weight 2 sessions with reps not climbing \u2014 else the last lift of a focus muscle). Copy format: 'WU: reps\\t\\tweight' and 'SS: reps\\t\\tweight' lines; upload parser reads both \u2014 WU goes to warmup history (excluded from 1RM/progression), SS is stored tagged [r,w,'ss'] and ignored by progression and plateau detection.", "COPY FORMAT v22: each exercise is a transposed table \u2014 row 1 = weights (tab-separated, '-' if never logged), row 2 = reps, row 3 = set types (WU/WS/SS) only when a non-WS set exists. SS drop appears as its own column right after its parent set. NO muscle-status trailer anymore (deleted at user request). parseWorkoutText auto-detects table vs old per-line 'reps\\t\\tweight' format (2x2 ambiguity resolved by plausibility scoring), still honors 'Day N:' headers, WU:/SS: prefixed lines, and stops at old trailers.", "COPY FORMAT v23: WS is IMPLIED \u2014 the type row prints only WU/SS in their columns (blank = working set), and only appears when the exercise has a WU or SS at all. The copy page renders each exercise as a real bordered table (row 1 weights, row 2 reps, optional type row) and the Copy button writes rich text/html tables to the clipboard (plain tab-text fallback) so pasting into Apple function purgeOld(st){

  ["rec","eos"].forEach(g=>{

    Object.keys(hh).forEach(n=>{

      if(!hh[n].length) delete hh[n];

  });
  if(st.logbook) st.logbook = st.logbook.filter(l=>l.date >= HISTORY_CUTOFF);
  if(st.runs) st.runs = st.runs.filter(r=>r.date >= HISTORY_CUTOFF);
  return st;
}

      name: e.name, weight_note: e.weight_note||null, circuit: e.circuit||null,

    workouts, histories:{rec:recH, eos:{}}, logbook:[], runs:[], custom:[], food:[], supps:{}, lastFoodSync:null, blockStart:null, blockNum:1 });
}
const RENAMES = {"Pec Deck or Low-to-High Fly":"Pec Fly"};
function applyRenames(st){

}
function migrateState(st){

function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso, long){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  const wdl = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()];
  const mo = ["January","February","March","April","May","June","July","August","September","October","November","December"][m-1];
  const yearNow = new Date().getFullYear();
  return (long?wdl:wd)+", "+mo+" "+String(d).padStart(2,"0")+(y!==yearNow?", "+y:"");
}
function fmtShortDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];
  return mo+" "+d+", "+y;
}
function est1RM(sets){
  let best = 0;
  sets.forEach(([r,w]) => { const v = w*(1+r/30); if(v>best) best=v; });
  return Math.round(best*10)/10;
}
function comma(n){ return n.toLocaleString("en-US"); }

/* ---- 2-week block engine + daily shuffle ---- */
function seededRand(seedStr){
  let h = 2166136261;
  for(let i=0;i<seedStr.length;i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}
function blockDaysIn(){
  if(!state.blockStart) return 0;
  return Math.floor((new Date(todayISO()+"T12:00:00") - new Date(state.blockStart+"T12:00:00"))/86400000);
}
function ensureBlock(){
  if(!state.blockStart){ state.blockStart = todayISO(); state.blockNum = state.blockNum||1; saveState(); return; }
  if(blockDaysIn() >= 14) rotateBlock(false);
}
function rotateBlock(manual){
  state.blockStart = todayISO();
  state.blockNum = (state.blockNum||1) + 1;
  state.flow.generated = null; state.flow.sessView = null; state.flow.sessKey = null;

/* ---- progressive-overload engine: detect each lift's own weight steps and push when ready ---- */
function detectIncrement(name){
  const ws = new Set();
  H(name).forEach(h=>(h.sets||[]).forEach(s=>{ if(s[1]>0) ws.add(s[1]); }));
  const arr = [...ws].sort((a,b)=>a-b);
  const gaps = {};
  for(let i=1;i<arr.length;i++){
    const g = Math.round((arr[i]-arr[i-1])*100)/100;
    if(g>0) gaps[g]=(gaps[g]||0)+1;
  }
  const best = Object.keys(gaps).sort((a,b)=>gaps[b]-gaps[a] || Number(a)-Number(b))[0];
  if(best) return Number(best);
  const maxW = arr[arr.length-1]||0;
  return (maxW && maxW < 30) ? 2.5 : 5;
}
function applyProgression(ex){
  if(ex.sets[0] && ex.sets[0].duration) return;
  if(calibrating()){
    /* calibration: recommend exactly what you did last time — record, learn, no forced jumps */
    const hs0 = H(ex.name).filter(h=>h.sets && h.sets.length);
    delete ex.pushed;
    if(!hs0.length) return;
    const last0 = hs0.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const lastSets0 = (last0.sets||[]).filter(s=>s[2]!=="ss");
    const working0 = ex.sets.filter(s=>!s.warmup && !s.scout);
    working0.forEach((s,i)=>{
      const ls = lastSets0[Math.min(i, lastSets0.length-1)];
      if(ls && ls[1]>0) s.weight = ls[1];
    });
    return;
  }
  const hs = H(ex.name).filter(h=>h.sets && h.sets.length);
  delete ex.pushed;
  if(!hs.length) return;
  const last = hs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastSets = (last.sets||[]).filter(s=>s[2]!=="ss");
  if(!lastSets.length) return;
  const inc = detectIncrement(ex.name);
  const working = ex.sets.filter(s=>!s.warmup && !s.scout);
  let pushedFrom = null, pushedTo = null, pushedReps = null;
  working.forEach((s,i)=>{
    const lastSet = lastSets[Math.min(i, lastSets.length-1)];
    if(!lastSet) return;
    const r = lastSet[0], w = lastSet[1];
    if(w>0 && r >= 10){
      const nw = Math.round((w+inc)*100)/100;
      if(pushedFrom===null){ pushedFrom = w; pushedTo = nw; pushedReps = r; }
      s.weight = nw;
    } else if(w>0){
      s.weight = w;
    }
  });
  if(pushedFrom!==null) ex.pushed = {from:pushedFrom, to:pushedTo, inc:inc, reps:pushedReps};
}

const FOOD_TARGET = {kcal:2350, protein:180};
function foodNum(s){ return Number(String(s).replace(/,/g,"")); }
function parseFoodText(t){
  const out = {};
  let pendingDate = null;
  let curDate = null;
  const entryFor = d => out[d] || (out[d] = {date:d, kcal:null, protein:null, carbs:null, fat:null, meals:{breakfast:[],lunch:[],dinner:[],snacks:[]}, loggedAt:nowTime()});
  t.split(/\r?\n/).forEach(raw=>{
    const l = raw.trim(); if(!l) return;
    const mm = l.match(/^(BREAKFAST|LUNCH|DINNER|SNACKS?)\s*[:\-]\s*(.+)$/i);
    if(mm){
      const key = mm[1].toLowerCase().indexOf("snack")===0 ? "snacks" : mm[1].toLowerCase();
      const rest = mm[2];
      const kcal2 = rest.match(/([\d,]{2,6})\s*(?:k?cal\b|calories)/i);
      const prot2 = rest.match(/([\d,]{1,4})\s*g?\s*p(?:rotein)?\b/i);
      const carb2 = rest.match(/([\d,]{1,4})\s*g?\s*c(?:arbs?|arbohydrates)?\b/i);
      const fat2 = rest.match(/([\d,]{1,4})\s*g?\s*f(?:at)?\b/i);
      const name = rest.split(/\s+[\u2014\u2013-]\s+/)[0].replace(/\s+/g," ").trim();
      const e = entryFor(curDate || pendingDate || todayISO());
      if(!e.meals) e.meals = {breakfast:[],lunch:[],dinner:[],snacks:[]};
      e.meals[key].push({name: name||"item", kcal: kcal2?foodNum(kcal2[1]):null, p: prot2?foodNum(prot2[1]):null, c: carb2?foodNum(carb2[1]):null, f: fat2?foodNum(fat2[1]):null});
      return;
    }
    const dm = l.match(/(\d{4}-\d{2}-\d{2})/);
    const kcal = l.match(/([\d,]{2,6})\s*(?:k?cal\b|calories)/i) || l.match(/calories[^\d]{0,15}([\d,]{2,6})/i);
    const prot = l.match(/([\d,]{1,4})\s*g?\s*protein/i) || l.match(/protein[^\d]{0,15}([\d,]{1,4})/i);
    const carb = l.match(/([\d,]{1,4})\s*g?\s*carb/i) || l.match(/carb(?:s|ohydrates)?[^\d]{0,15}([\d,]{1,4})/i);
    const fat = l.match(/([\d,]{1,4})\s*g?\s*fat/i) || l.match(/\bfat[^\d]{0,15}([\d,]{1,4})/i);
    if(dm && !(kcal||prot)){ pendingDate = dm[1]; curDate = dm[1]; return; }
    if(kcal || prot){
      const d = dm ? dm[1] : (pendingDate || todayISO());

async function pollRemoteFood(){

  try{
    const r = await fetch("food.json?_="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const j = await r.json();
    if(!j || !Array.isArray(j.entries)) return;
    if(j.ts && state.foodRemoteTs && j.ts <= state.foodRemoteTs) return;
    let changed = 0;
    j.entries.forEach(e=>{
      if(!e || !e.date) return;
      const cur = (state.food||[]).find(x=>x.date===e.date);
      if(!cur || JSON.stringify(cur) !== JSON.stringify(e)){
        state.food = (state.food||[]).filter(x=>x.date!==e.date);
        state.food.push(e);
        changed++;
      }
    });
    if(Array.isArray(j.runs)){
      if(!state.runs) state.runs = [];
      j.runs.forEach(r=>{
        if(!r || !r.date) return;
        const key = r.date+"|"+(r.name||"Run")+"|"+(r.time||0);
        if(!state.runs.some(x=>(x.date+"|"+(x.name||"Run")+"|"+(x.time||0))===key)){
          state.runs.unshift({date:r.date, type:r.type||"easy", name:r.name||"Run",
            time:r.time!=null?r.time:null, dist:r.dist!=null?r.dist:null,
            pace:r.pace!=null?r.pace:null, kcal:r.kcal!=null?r.kcal:null, loggedAt:"synced"});
          changed++;
        }
      });
    }
    state.foodRemoteTs = j.ts || Date.now();
    if(changed){
      state.food.sort((a,b)=>b.date.localeCompare(a.date));
      state.food = state.food.slice(0,90);
      state.lastFoodSync = Date.now();
      saveState(); refreshTabs();
      toast("MyFitnessPal synced from cloud \u2713 \u2014 "+changed+" day"+(changed>1?"s":"")+" updated");
    } else {
      saveState();
    }
  }catch(err){}
}

function estMinutes(w){
  let m = 5; /* setup + walking between stations */
  w.exercises.forEach(e=>{
    if(e.sets[0] && e.sets[0].duration) return;
    const work = e.sets.filter(s=>!s.warmup).length;
    const warm = e.sets.filter(s=>s.warmup).length;
    const ss = e.sets.filter(s=>s.ss).length;
    m += work*2 + warm*1 + ss*1;
  });
  return Math.round(m);
}
function shortTrim(w){
  let guard = 30;
  while(estMinutes(w) > 45 && guard-- > 0){
    let best = null;
    w.exercises.forEach(e=>{
      if(e.sets[0] && e.sets[0].duration) return;
      const n = e.sets.filter(s=>!s.warmup).length;
      if(n > 2 && (!best || n > best.n)) best = {e, n};
    });
    if(best){
      const idxs = best.e.sets.map((s,i)=>!s.warmup?i:-1).filter(i=>i>=0);
      best.e.sets.splice(idxs[idxs.length-1], 1);
    } else if(w.exercises.filter(e=>!(e.sets[0]&&e.sets[0].duration)).length > 3){
      w.exercises.pop();
    } else break;
  }
  w.exercises.forEach(e=>{
    if(e.sets[0] && e.sets[0].duration) return;
    const n = e.sets.filter(s=>!s.warmup).length;
    e.target = n+" \u00d7 "+(isCompound(e.name)?"6\u201310":"10\u201315");
  });
}
function fmtAdjust(e, fmt){
  if(e.sets[0] && e.sets[0].duration) return;
  if(fmt==="short" && e.sets.filter(s=>!s.warmup).length>4){
    const keep = []; let n = 0;
    e.sets.forEach(s=>{ if(s.warmup){ keep.push(s); } else if(n<4){ keep.push(s); n++; } });
    e.sets = keep;
  }
  if(fmt==="pump" && !isCompound(e.name)){
    const work = e.sets.filter(s=>!s.warmup && !s.scout);
    if(work.length && work.length<5){
      const last = work[work.length-1];
      e.sets.push({warmup:false, reps:last.reps, weight:last.weight});
    }
  }
  const n2 = e.sets.filter(s=>!s.warmup).length;
  e.target = n2+" \u00d7 "+(isCompound(e.name)?"6\u201310":(fmt==="pump"?"12\u201315":"10\u201315"));
  e.rest = fmt==="pump" ? (isCompound(e.name)?"90s":"45\u201360s") : fmt==="short" ? (isCompound(e.name)?"90s":"60s") : (isCompound(e.name)?"2 min":"75s");
}
/* ---- trend-driven session builder: sets, reps & weights come from YOUR logged data ---- */
function isCompound(name){ return /press|squat|deadlift|row|pull|dip|lunge|thrust|bench|carry/i.test(name); }
function planDefaultW(name){

        const ws = (e.sets||[]).filter(s=>!s.duration && !s.warmup && s.weight!=="" && s.weight!=null);

function bestPickNote(group, name){

function authorSets(name, extraTop, targetN){
  const N = Math.max(2, Math.min(5, targetN || 4));
  const hs = H(name).filter(h=>h.sets&&h.sets.length);
  if(hs.length){
    const last = hs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const mirror = last.sets.filter(s=>s[2]!=="ss").map(s=>({warmup:false, reps:s[0], weight:s[1]>0?s[1]:""}));
    const sets = mirror.slice(0, N);
    while(sets.length < N && mirror.length) sets.push({warmup:false, reps:mirror[mirror.length-1].reps, weight:mirror[mirror.length-1].weight});
    if(extraTop && sets.length<5){
      let top = null;
      sets.forEach(s=>{ if(s.weight!=="" && (top===null || s.weight>top.weight)) top = s; });
      if(top){
        const inc = detectIncrement(name);
        sets.push({warmup:false, reps:4, weight:Math.round((top.weight+inc)*100)/100, scout:true});
      }
    }
    return sets;
  }
  const w = planDefaultW(name) || 30;
  const n = Math.min(5, N + (extraTop?1:0));
  const out = [];
  for(let i=0;i<n;i++) out.push({warmup:false, reps:10, weight:w});
  return out;
}
/* ---- set types (WU / WS / SS) assigned from trends ---- */
function snapDrop(name, w){
  const inc = detectIncrement(name);
  const steps = Math.max(1, Math.round(w*0.22/inc));
  let drop = Math.round((w - steps*inc)*100)/100;
  if(drop<=0) drop = Math.round((w-inc)*100)/100;
  if(drop<=0) drop = Math.round(w*0.7*100)/100;
  return drop;
}
function plateaued(name){
  const hs = H(name).filter(h=>h.sets&&h.sets.length).slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(hs.length<2) return false;
  const top = ss => Math.max(...ss.filter(s=>s[2]!=="ss").map(s=>s[1]||0), 0);
  const reps = ss => Math.max(...ss.filter(s=>s[2]!=="ss").map(s=>s[0]||0), 0);
  return top(hs[0].sets)===top(hs[1].sets) && reps(hs[0].sets)<=reps(hs[1].sets) && reps(hs[0].sets)<10;
}
function assignSetTypes(exercises, keys, fmt){
  if(calibrating()) fmt = "calibration";
  /* WU — first exercise per muscle opens with one easy warm-up set (no overextending) */
  const seen = {};
  exercises.forEach(e=>{
    if(e.sets[0] && e.sets[0].duration) return;
    const k = musclesFor(e.name).find(m=>keys.includes(m)) || musclesFor(e.name)[0];
    if(seen[k]) return;
    seen[k] = 1;
    if(e.sets.some(s=>s.warmup)) return;
    const first = e.sets.find(s=>!s.warmup && s.weight!=="" && s.weight>0);
    if(!first) return;
    const inc = detectIncrement(e.name);
    let wu = Math.max(inc, Math.round(first.weight*0.55/inc)*inc);
    if(wu>=first.weight) wu = Math.max(inc, Math.round((first.weight-inc)*100)/100);
    e.sets.unshift({warmup:true, reps:10, weight:wu});
    e.wuNote = "WU opener — easy 10 at "+wu+" lb, just to get ready";
  });
  /* SS — one superset finisher per muscle: stalled lift first, else last lift of a focus muscle */
  if(fmt==="calibration") return; /* analysis weeks: warm-ups yes, supersets not yet */
  keys.forEach(k=>{
    const g = groupByKey(k);
    const groupExs = exercises.filter(e=>!(e.sets[0]&&e.sets[0].duration) && musclesFor(e.name).includes(k));
    if(!groupExs.length) return;
    if(groupExs.some(e=>e.sets.some(s=>s.ss))) return;
    if(fmt==="pump"){
      let hit = 0;
      groupExs.filter(e=>!isCompound(e.name)).slice(-2).forEach(e=>{
        const work = e.sets.filter(s=>!s.warmup && !s.scout);
        const lastSet = work[work.length-1];
        if(!lastSet || lastSet.weight==="" || !(lastSet.weight>0)) return;
        const drop = snapDrop(e.name, lastSet.weight);
        lastSet.ss = {reps:8, weight:drop};
        e.ssNote = "SS pump finisher \u2014 "+lastSet.weight+" lb straight into "+drop+" lb, 8+ reps to flood the muscle";
        hit++;
      });
      if(hit) return;
    }
    let target = groupExs.find(e=>plateaued(e.name));
    let why = target ? "trend stalled here — superset to break the plateau" : null;
    if(!target && g && GROUP_FOCUS[g.group]){ target = groupExs[groupExs.length-1]; why = "focus muscle — superset finisher for extra intensity"; }
    if(!target) return;
    const work = target.sets.filter(s=>!s.warmup && !s.scout);
    const lastSet = work[work.length-1];
    if(!lastSet || lastSet.weight==="" || !(lastSet.weight>0)) return;
    const drop = snapDrop(target.name, lastSet.weight);
    lastSet.ss = {reps:6, weight:drop};
    target.ssNote = "SS on the last set — finish at "+lastSet.weight+" lb, then straight into "+drop+" lb for 6+ to max the muscle ("+why+")";
  });
}
function buildSession(){
  const keys = sessMuscles();
  const rnd = seededRand(keys.join("+")+"|"+todayISO()+"|"+state.gym+"|b"+(state.blockNum||1));
  const nG = keys.length;
  const fmt = state.flow.format || "long";
  const fuelOK = fuelStatus().st !== "low";
  const counts = keys.map((k,i)=>{
    if(fmt==="short"){
      if(nG===1) return 4;
      if(nG===2) return i===0?3:2;
      if(nG===3) return i<2?2:1;
      return 1;
    }
    if(nG===1) return 6;
    if(nG===2) return i===0?4:3;
    if(nG===3) return i===0?3:2;
    return 2;
  });
  const exercises = [];
  keys.forEach((k,gi)=>{
    const g = groupByKey(k); if(!g) return;
    const pool = [];
    g.parts.forEach(p=>p.exercises.forEach(e=>{
      if(!pool.some(x=>x.name===e.name)) pool.push({name:e.name, rank:e.rank||null, part:p.part, prio:/PRIORITY/i.test(p.part)});
    }));
    (state.custom||[]).filter(c=>c.key===k).forEach(c=>{
      if(!pool.some(x=>x.name===c.name)) pool.push({name:c.name, rank:null, part:"Custom", prio:false});
    });
    pool.sort((a,b)=> (a.rank?0:1)-(b.rank?0:1) || (a.rank||99)-(b.rank||99) || (H(b.name).length?1:0)-(H(a.name).length?1:0));
    const picks = [];
    const parts = {};
    const clash = n => picks.some(p2=>{ const a=p2.name.toLowerCase(), b=n.toLowerCase(); return a.includes(b)||b.includes(a); });
    for(const x of pool){ if(picks.length>=counts[gi]) break; if(parts[x.part] || clash(x.name)) continue; picks.push(x); parts[x.part]=1; }
    for(const x of pool){ if(picks.length>=counts[gi]) break; if(!picks.includes(x) && !clash(x.name)) picks.push(x); }
    picks.forEach((x,i)=>{
      if(x.rank===1) return; /* #1 research picks are permanent anchors */
      if(rnd()<0.4){
        const alts = pool.filter(y=>y.part===x.part && y.name!==x.name && !picks.some(p2=>{ const a=p2.name.toLowerCase(), b=y.name.toLowerCase(); return a.includes(b)||b.includes(a); }));
        if(alts.length) picks[i] = alts[Math.floor(rnd()*Math.min(2,alts.length))];
      }
    });
    const gStat = muscleGainStat(k);
    const gFat = muscleFatiguePct(k);
    picks.forEach(x=>{
      const extra = !calibrating() && fuelOK && !!(x.prio || (x.rank===1 && GROUP_FOCUS[g.group]));
      const comp = isCompound(x.name);
      /* 2-5 sets from trends + recovery + gains + fuel */
      let nSets = 3;
      if(extra) nSets++;
      if(!calibrating() && (gStat.st==="stagnant" || gStat.st==="down")) nSets++;
      if(gFat >= 50) nSets--;
      if(!fuelOK) nSets--;
      nSets = Math.max(2, Math.min(5, nSets));
      if(fmt==="short") nSets = Math.min(nSets, 3); /* short day: 2-3 per lift, hop to the next */
      const sets = authorSets(x.name, extra, nSets);
      exercises.push({
        name: x.name,
        target: sets.length+" × "+(comp?"6–10":"10–15"),
        rest: comp ? "2 min" : "75s",
        note: bestPickNote(g.group, x.name),
        sets
      });
    });
  });
  for(let i=exercises.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=exercises[i]; exercises[i]=exercises[j]; exercises[j]=t; }
  const w = {name: sessName(), subtitle: FORMATS[fmt].name+" · "+FORMATS[fmt].time+" · "+GYMS[state.gym].label+" trends", exercises};
  w.exercises.forEach(e=>applyProgression(e));
  w.exercises.forEach(e=>fmtAdjust(e, fmt));
  if(fmt==="short") shortTrim(w);
  assignSetTypes(w.exercises, keys, fmt);
  return w;
}

function libIndex(){
  const idx = {};
  (DB.muscleRef.exercise_library||[]).forEach(g=>g.parts.forEach(p=>p.exercises.forEach(e=>{
    if(!(e.name in idx)) idx[e.name] = {group:g.group, key:g.key, part:p.part, rank:e.rank||null};
  })));
  return idx;
}
function swapWhy(group, e){
  const b = (DB.muscleRef.best_exercises||{})[group];
  if(b){ const t = b.top.find(x=>x.name===e.name); if(t) return "★ #"+t.rank+" research pick — "+t.why; }
  return "Same-muscle-part variation for a fresh stimulus.";
}
function generateWorkout(level){
  ensureSessView();
  const gen = JSON.parse(JSON.stringify(state.flow.sessView));
  gen.exercises.forEach(e=>{ delete e.swapped; });
  const ranges = {keep:[0,0], small:[0,1], some:[1,2], big:[2,4]};
  if(!level) return gen;
  const [lo,hi] = ranges[level];
  const n = lo + Math.floor(Math.random()*(hi-lo+1));
  if(n<=0) return gen;
  const idx = libIndex();
  const inDay = new Set(gen.exercises.map(e=>e.name));
  const slots = gen.exercises.map((e,i)=>({e,i,meta:idx[e.name]}))
    .filter(s=>s.meta && !(s.e.sets[0]&&s.e.sets[0].duration));
  slots.sort((a,b)=>{
    const au = a.meta.rank?0:1, bu = b.meta.rank?0:1;
    if(au!==bu) return bu-au;
    return (b.meta.rank||0)-(a.meta.rank||0);
  });
  let done = 0;
  for(const s of slots){
    if(done>=n) break;
    if(s.meta.rank===1) continue; /* never swap out a #1 pick */
    const lib = (DB.muscleRef.exercise_library||[]).find(g=>g.group===s.meta.group);
    const part = lib ? lib.parts.find(p=>p.part===s.meta.part) : null;
    if(!part) continue;
    const cands = part.exercises.filter(e=>e.name!==s.e.name && !inDay.has(e.name));
    if(!cands.length) continue;
    cands.sort((a,b)=>((a.rank||99)-(b.rank||99)) || ((H(b.name).length?1:0)-(H(a.name).length?1:0)));
    const best = cands[0];
    if(s.meta.rank && (best.rank||99) > s.meta.rank) continue; /* never downgrade */
    inDay.add(best.name);
    const why = swapWhy(s.meta.group, best);
    const from = s.e.name;
    const extra = false;
    const comp = isCompound(best.name);
    const gs2 = muscleGainStat(s.meta.key);
    let nSets2 = 3;
    if(gs2.st==="stagnant" || gs2.st==="down") nSets2++;
    if(muscleFatiguePct(s.meta.key) >= 50) nSets2--;
    nSets2 = Math.max(2, Math.min(5, nSets2));
    const sets = authorSets(best.name, extra, nSets2);
    gen.exercises[s.i] = {
      name: best.name,
      target: sets.length+" × "+(comp?"6–10":"10–15"),
      rest: comp ? "2 min" : "75s",
      note: bestPickNote(s.meta.group, best.name),
      sets,
      swapped: {from, why}
    };
    done++;
  }
  gen.exercises.forEach(e=>applyProgression(e));
  gen.exercises.forEach(e=>fmtAdjust(e, state.flow.format||"long"));
  if((state.flow.format||"long")==="short") shortTrim(gen);
  assignSetTypes(gen.exercises, sessMuscles(), state.flow.format||"long");
  return gen;
}

function dayBreakdown(w){
  const groups = {}; const order = [];
  let lifting = false;
  w.exercises.forEach(e=>{
    if(e.sets[0]&&e.sets[0].duration) return;
    lifting = true;
    const lbl = MUSCLE_LABEL[musclesFor(e.name)[0]]||"Other";
    if(!groups[lbl]){ groups[lbl]={count:0,sets:{},ss:false}; order.push(lbl); }
    const nn = e.sets.filter(s=>!s.warmup).length;
    groups[lbl].count++; groups[lbl].sets[nn]=(groups[lbl].sets[nn]||0)+1;
    if(e.sets.some(s=>s.ss)) groups[lbl].ss = true;
  });
  if(!lifting) return "Run Day";
  const parts = order.map(l=>{
    const g = groups[l];
    const common = Object.keys(g.sets).sort((a,b)=>g.sets[b]-g.sets[a])[0];
    return g.count+" "+l+" ("+common+" sets each"+(g.ss?", WS and SS":"")+")";
  });
  return parts.length>2 ? parts.join("\n") : parts.join(" ");
}

function fallbackCopy(t, h, ok){
  const dv = document.createElement("div");
  dv.contentEditable = "true"; dv.innerHTML = h;
  dv.style.position = "fixed"; dv.style.opacity = "0"; dv.style.left = "-9999px";
  document.body.appendChild(dv);
  const range = document.createRange(); range.selectNodeContents(dv);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  let done = false;
  try{ done = document.execCommand("copy"); }catch(e){}
  sel.removeAllRanges(); dv.remove();
  if(done){ ok(); return; }
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ toast("Copy failed — long-press the text to copy"); }

function parseWorkoutText(t){
  const lines = t.split(/\r?\n/);
  let day = null, dayName = null;
  const exercises = [];
  let cur = null;
  const setRe = /^\s*(\d+(?:\.\d+)?)\s*\.?[\t ]+(-|\d+(?:\.\d+)?)\s*(?:lb|lbs)?\s*$/i;
  const durRe = /^\s*(\d{1,3}:\d{2})\s*$/;
  const numTok = /^(-|\d+(?:\.\d+)?)(?:lb|lbs)?$/i;
  const typeTok = /^(WU|WS|SS)$/i;
  const toks = line => line.split(/\t+| {2,}| /).map(x=>x.trim()).filter(Boolean);
  const val = x => (x==="-" ? null : Number(String(x).replace(/lbs?$/i,"")));
  function finalize(){
    if(!cur) return;
    const rows = cur._rows || [];
    const ty = cur._ty || null;
    delete cur._rows; delete cur._ty;
    if(!rows.length) return;
    let table = rows.length===2 && rows[0].length===rows[1].length && rows.every(r=>r.every(v=>typeof v!=="string"));
    if(table && rows[0].length===2 && !ty){
      /* ambiguous 2x2: score both readings — old = each row [reps,weight], table = row1 weights / row2 reps */
      let sOld=0, sTab=0;
      rows.forEach(r=>{ if(r[0]!=null && r[0]<=30 && (r[1]==null || r[1]>=r[0])) sOld++; });
      for(let i=0;i<2;i++){ const w=rows[0][i], r=rows[1][i]; if(r!=null && r<=30 && (w==null || w>=r)) sTab++; }
      if(sOld>sTab) table = false;
    }
    if(table){
      for(let i=0;i<rows[0].length;i++){
        const w = rows[0][i], r = rows[1][i];
        if(r==null || !(r>0)) continue;
        const tag = ty && ty[i] ? ty[i] : "WS";
        if(tag==="WU") cur.warmup.push([r, w]);
        else if(tag==="SS") cur.sets.push([r, w, "ss"]);
        else cur.sets.push([r, w]);
      }
    } else {
      rows.forEach(r=>{
        if(r.length<2 || r[0]==null || !(r[0]>0)) return;
        const tag = (r.length>2 && typeof r[2]==="string") ? r[2].toUpperCase() : null;
        if(tag==="WU"){ cur.warmup.push([r[0], r[1]]); return; }
        if(tag==="SS"){ cur.sets.push([r[0], r[1], "ss"]); return; }
        cur.sets.push([r[0], r[1]]);
        if(tag && tag!=="WS") cur.comment = (cur.comment?cur.comment+" \u00b7 ":"")+"set "+cur.sets.length+": "+r[2];
      });
    }
  }
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    if(/^The rest of the Day Schedule/i.test(line)) break;
    if(/^Muscle status/i.test(line)) break;
    const dm = line.match(/^Day\s+(\d+)\s*:\s*(.*)$/i);
    if(dm){ if(day===null){ day = Number(dm[1]); dayName = dm[2].trim(); continue; } break; }
    if(/\(\d+\s*sets?\s*each\)/i.test(line) || /sets? each/i.test(line) || /^Run Day$/i.test(line)) continue;
    const tk = toks(line);
    const cells3 = line.split(/\t+/).map(x=>x.trim()).filter(Boolean);
    if(cur && cells3.length===3 && numTok.test(cells3[0]) && numTok.test(cells3[1]) && !numTok.test(cells3[2])){
      if(!cur._rows) cur._rows = [];
      cur._rows.push([val(cells3[0]), val(cells3[1]), cells3[2].trim()]);
      continue;
    }
    if(cur && cur._rows && cur._rows.length>=2 && !cur._ty && !/^(WU|SS)[:.]/i.test(line) &&
       (line.includes("\t") ? !tk.every(x=>numTok.test(x)) : (tk.length>=2 && tk.every(x=>typeTok.test(x))))){
      const cells = line.includes("\t") ? line.split("\t") : tk;
      cur._ty = cells.map(x=>{ const v = String(x).trim().toUpperCase(); return typeTok.test(v) ? v : "WS"; });
      cells.forEach((x,i)=>{
        const v = String(x).trim();
        if(v && !typeTok.test(v.toUpperCase()) && !numTok.test(v)){
          cur.comment = (cur.comment?cur.comment+" \u00b7 ":"")+"set "+(i+1)+": "+v;
        }
      });
      continue;
    }
    if(cur && (!cur._rows || !cur._rows.length) && tk.length>=2 && tk.every(x=>typeTok.test(x))){ cur._ty = tk.map(x=>x.toUpperCase()); continue; }
    const tm = line.match(/^(WU|SS)[:.]?[\t ]+(.+)$/i);
    if(tm && cur){
      const sm2 = tm[2].match(setRe);
      if(sm2){
        if(/^wu$/i.test(tm[1])) cur.warmup.push([Number(sm2[1]), sm2[2]==="-"?null:Number(sm2[2])]);
        else cur.sets.push([Number(sm2[1]), sm2[2]==="-"?null:Number(sm2[2]), "ss"]);
        continue;
      }
    }
    if(tk.length>=1 && tk.every(x=>numTok.test(x))){
      if(!cur) continue;
      if(!cur._rows) cur._rows = [];
      cur._rows.push(tk.map(val));
      continue;
    }
    const du = line.match(durRe);
    if(du && cur){ cur.duration = du[1]; continue; }
    const pl = line.match(/^\((.+)\)$/);
    if(pl){ if(cur) cur.comment = (cur.comment?cur.comment+" \u00b7 ":"")+pl[1].trim(); continue; }
    finalize();
    const pm = line.match(/\(([^)]*)\)/);
    const nm = line.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim();
    cur = {name: nm || line.replace(/\s+/g," "), comment: pm && pm[1].trim() ? pm[1].trim() : null, sets: [], warmup: [], duration: null};
    exercises.push(cur);
  }
  finalize();
  return {day, dayName, exercises: exercises.filter(e=>e.sets.length || e.duration)};
}

/* ---- list-row helpers ---- */
function exRing(ex){
  if(ex.sets.length && ex.sets[0].duration)
    return `<div class="ring" style="background:conic-gradient(#ff7a3d 0 100%,transparent 0)"><b>⏱</b></div>`;
  const hs = H(ex.name).filter(h=>h.est1rm>0);
  if(!hs.length) return `<div class="ring" style="background:rgba(255,255,255,.08)"><b style="font-size:7.5px">NEW</b></div>`;
  const sorted = hs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const latest = sorted[sorted.length-1].est1rm, pr = Math.max(...hs.map(h=>h.est1rm));
  const pct = Math.max(6, Math.round(latest/pr*100));
  return `<div class="ring" style="background:conic-gradient(#ff7a3d 0 ${pct}%, rgba(255,255,255,.09) ${pct}% 100%)"><b>${Math.round(latest)}</b></div>`;
}
function summaryLine(ex){
  if(ex.sets.length && ex.sets[0].duration) return ex.sets.length+" set"+(ex.sets.length>1?"s":"")+" · "+ex.sets[0].duration;
  const working = ex.sets.filter(s=>!s.warmup);
  const w0 = working.length ? working[0].weight : "";
  if(ex.target) return ex.target.replace(/×/,"sets ×")+(w0!==""?" · "+w0+" lb":"");
  const n = working.length;
  if(!n) return ex.sets.length+" sets";
  const r = working[0].reps, w = working[0].weight;
  const same = working.every(s=>s.reps===r && s.weight===w);
  if(same && r!=="" && w!=="") return n+" sets · "+r+" reps · "+w+" lb";
  return n+" sets";
}
