function parseWorkoutText(t){
  const lines = t.split(/\r?\n/);
  let day = null, dayName = null;
  const exercises = [];
  let cur = null;
  const setRe = /^\s*(\d+(?:\.\d+)?)\s*\.?[\t ]+(-|\d+(?:\.\d+)?)\s*(?:lb|lbs)?\s*$/i;
  const durRe = /^\s*(\d{1,3}:\d{2})\s*$/;
  const numTok = /^(-|\d+(?:\.\d+)?)(?:lb|lbs)?$/i;
  const typeTok = /^(WU|WS|SS)$/i;
  const toks = line => line.split(/\t+| {2,}| /).map(x=>x.trim()).filter(Boolean);
  const val = x => (x==="-" ? null : Number(String(x).replace(/lbs?$/i,"")));
  function finalize(){
    if(!cur) return;
    const rows = cur._rows || [];
    const ty = cur._ty || null;
    delete cur._rows; delete cur._ty;
    if(!rows.length) return;
    let table = rows.length===2 && rows[0].length===rows[1].length && rows.every(r=>r.every(v=>typeof v!=="string"));
    if(table && rows[0].length===2 && !ty){
      /* ambiguous 2x2: score both readings — old = each row [reps,weight], table = row1 weights / row2 reps */
      let sOld=0, sTab=0;
      rows.forEach(r=>{ if(r[0]!=null && r[0]<=30 && (r[1]==null || r[1]>=r[0])) sOld++; });
      for(let i=0;i<2;i++){ const w=rows[0][i], r=rows[1][i]; if(r!=null && r<=30 && (w==null || w>=r)) sTab++; }
      if(sOld>sTab) table = false;
    }
    if(table){
      for(let i=0;i<rows[0].length;i++){
        const w = rows[0][i], r = rows[1][i];
        if(r==null || !(r>0)) continue;
        const tag = ty && ty[i] ? ty[i] : "WS";
        if(tag==="WU") cur.warmup.push([r, w]);
        else if(tag==="SS") cur.sets.push([r, w, "ss"]);
        else cur.sets.push([r, w]);
      }
    } else {
      rows.forEach(r=>{
        if(r.length<2 || r[0]==null || !(r[0]>0)) return;
        const tag = (r.length>2 && typeof r[2]==="string") ? r[2].toUpperCase() : null;
        if(tag==="WU"){ cur.warmup.push([r[0], r[1]]); return; }
        if(tag==="SS"){ cur.sets.push([r[0], r[1], "ss"]); return; }
        cur.sets.push([r[0], r[1]]);
        if(tag && tag!=="WS") cur.comment = (cur.comment?cur.comment+" \u00b7 ":"")+"set "+cur.sets.length+": "+r[2];
      });
    }
  }
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    if(/^The rest of the Day Schedule/i.test(line)) break;
    if(/^Muscle status/i.test(line)) break;
    const dm = line.match(/^Day\s+(\d+)\s*:\s*(.*)$/i);
    if(dm){ if(day===null){ day = Number(dm[1]); dayName = dm[2].trim(); continue; } break; }
    if(/\(\d+\s*sets?\s*each\)/i.test(line) || /sets? each/i.test(line) || /^Run Day$/i.test(line)) continue;
    const tk = toks(line);
    const cells3 = line.split(/\t+/).map(x=>x.trim()).filter(Boolean);
    if(cur && cells3.length===3 && numTok.test(cells3[0]) && numTok.test(cells3[1]) && !numTok.test(cells3[2])){
      if(!cur._rows) cur._rows = [];
      cur._rows.push([val(cells3[0]), val(cells3[1]), cells3[2].trim()]);
      continue;
    }
    if(cur && cur._rows && cur._rows.length>=2 && !cur._ty && !/^(WU|SS)[:.]/i.test(line) &&
       (line.includes("\t") ? !tk.every(x=>numTok.test(x)) : (tk.length>=2 && tk.every(x=>typeTok.test(x))))){
      const cells = line.includes("\t") ? line.split("\t") : tk;
      cur._ty = cells.map(x=>{ const v = String(x).trim().toUpperCase(); return typeTok.test(v) ? v : "WS"; });
      cells.forEach((x,i)=>{
        const v = String(x).trim();
        if(v && !typeTok.test(v.toUpperCase()) && !numTok.test(v)){
          cur.comment = (cur.comment?cur.comment+" \u00b7 ":"")+"set "+(i+1)+": "+v;
        }
      });
      continue;
    }
    if(cur && (!cur._rows || !cur._rows.length) && tk.length>=2 && tk.every(x=>typeTok.test(x))){ cur._ty = tk.map(x=>x.toUpperCase()); continue; }
    const tm = line.match(/^(WU|SS)[:.]?[\t ]+(.+)$/i);
    if(tm && cur){
      const sm2 = tm[2].match(setRe);
      if(sm2){
        if(/^wu$/i.test(tm[1])) cur.warmup.push([Number(sm2[1]), sm2[2]==="-"?null:Number(sm2[2])]);
        else cur.sets.push([Number(sm2[1]), sm2[2]==="-"?null:Number(sm2[2]), "ss"]);
        continue;
      }
    }
    if(tk.length>=1 && tk.every(x=>numTok.test(x))){
      if(!cur) continue;
      if(!cur._rows) cur._rows = [];
      cur._rows.push(tk.map(val));
      continue;
    }
    const du = line.match(durRe);
    if(du && cur){ cur.duration = du[1]; continue; }
    const pl = line.match(/^\((.+)\)$/);
    if(pl){ if(cur) cur.comment = (cur.comment?cur.comment+" \u00b7 ":"")+pl[1].trim(); continue; }
    finalize();
    const pm = line.match(/\(([^)]*)\)/);
    const nm = line.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim();
    cur = {name: nm || line.replace(/\s+/g," "), comment: pm && pm[1].trim() ? pm[1].trim() : null, sets: [], warmup: [], duration: null};
    exercises.push(cur);
  }
  finalize();
  return {day, dayName, exercises: exercises.filter(e=>e.sets.length || e.duration)};
}

/* ---- list-row helpers ---- */
function exRing(ex){
  if(ex.sets.length && ex.sets[0].duration)
    return `<div class="ring" style="background:conic-gradient(#ff7a3d 0 100%,transparent 0)"><b>⏱</b></div>`;
  const hs = H(ex.name).filter(h=>h.est1rm>0);
  if(!hs.length) return `<div class="ring" style="background:rgba(255,255,255,.08)"><b style="font-size:7.5px">NEW</b></div>`;
  const sorted = hs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const latest = sorted[sorted.length-1].est1rm, pr = Math.max(...hs.map(h=>h.est1rm));
  const pct = Math.max(6, Math.round(latest/pr*100));
  return `<div class="ring" style="background:conic-gradient(#ff7a3d 0 ${pct}%, rgba(255,255,255,.09) ${pct}% 100%)"><b>${Math.round(latest)}</b></div>`;
}
function summaryLine(ex){
  if(ex.sets.length && ex.sets[0].duration) return ex.sets.length+" set"+(ex.sets.length>1?"s":"")+" · "+ex.sets[0].duration;
  const working = ex.sets.filter(s=>!s.warmup);
  const w0 = working.length ? working[0].weight : "";
  if(ex.target) return ex.target.replace(/×/,"sets ×")+(w0!==""?" · "+w0+" lb":"");
  const n = working.length;
  if(!n) return ex.sets.length+" sets";
  const r = working[0].reps, w = working[0].weight;
  const same = working.every(s=>s.reps===r && s.weight===w);
  if(same && r!=="" && w!=="") return n+" sets · "+r+" reps · "+w+" lb";
  return n+" sets";
}

  $("sheetback").classList.remove("open"); $("sheet").classList.remove("open");
  const wasStandalone = !!sheetStandalone;
  sheetIdx = null; sheetStandalone = null;
  if(wasStandalone) renderBody(); else renderFlow();
}
function lastSession(name){
  const hs = H(name);
  if(!hs.length) return null;
  return hs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
}
function renderSheet(){
  const ex = sheetExObj();
  const s = lastSession(ex.name);
  const other = state.gym==="rec" ? "eos" : "rec";
  const otherH = (state.histories[other]||{})[ex.name]||[];
  const otherLast = otherH.length ? otherH.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  const gymline = `<div class="gymrow">
    <span class="g1">${GYMS[state.gym].label.toUpperCase()} · ${s ? "last "+(s.sets[0]?s.sets[0][0]+"×"+s.sets[0][1]:"logged") : "no logs yet"}</span>
    <span class="g2">${GYMS[other].label.toUpperCase()} · ${otherLast ? "last "+(otherLast.sets[0]?otherLast.sets[0][0]+"×"+otherLast.sets[0][1]:"logged") : "never done"} — separate</span></div>`;
  let entry;
  if(!s){
    entry = `<div class="emptybox" style="margin-top:11px">No sessions logged for ${esc(ex.name)} at ${GYMS[state.gym].label} yet.<br><br>Tap <b style="color:var(--txt)">Log Today's Sets</b> below after you train it.</div>`;
  } else {
    const vol = s.sets.reduce((a,x)=>a+x[0]*x[1],0);
    const lines = sheetEdit
      ? s.sets.map((x,k)=>`<div class="editrow">
          <input type="number" inputmode="numeric" value="${x[0]}" onchange="editEntry(${k},0,this.value)"> reps ×
          <input type="number" inputmode="decimal" step="0.5" value="${x[1]}" onchange="editEntry(${k},1,this.value)"> lb</div>`).join("")
      : s.sets.map(x=>`<div class="lel"><b>${x[0]} reps</b> x ${x[1]} lb${x[2]==="ss"?' <span class="lt" style="color:#e8c14d">SS</span>':''}</div>`).join("");
    entry = `<div class="lentry">
      <div class="lthumbwrap"><div class="lthumb">${figureSVG(musclesFor(ex.name),52)}</div><div class="lcheck">✓</div></div>
      <div style="flex:1;min-width:0">
        <div class="lhead">${esc(ex.name)}</div>
        <div class="lwhen">${fmtDate(s.date,true)}</div>
        <div class="lup">${s.time?("Uploaded "+esc(s.time)+" · "):""}${GYMS[state.gym].label}</div>
        <div class="lsets">${lines}</div>
        ${sheetEdit?`<div style="display:flex;gap:8px;margin-top:10px">
          <button class="pill pink" onclick="saveEntry()">Save</button>
          <button class="pill chip" onclick="sheetEdit=false;renderSheet()">Cancel</button></div>`:""}
        <div class="ltags">${s.est1rm?`<span class="lt g">EST. 1RM ${s.est1rm} LB</span>`:""}<span class="lt">VOLUME ${comma(vol)} LB</span></div>
      </div>
      <button class="dots" onclick="openEntryMenu()">•••</button>
    </div>`;
  }
  $("sheetscroll").innerHTML = `
    <div class="sheet-hero">${figureSVG(musclesFor(ex.name),110)}
      <button class="sheet-x" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <div class="sheet-name-row">
        <div class="sheet-name disp">${esc(ex.name)}</div>
        <button class="pill ghost" onclick="howTo()">▶ How-To</button>
      </div>
      ${ex.target?'<div style="margin-top:6px;font-size:13px;color:var(--dim);font-weight:600">Target: <b style="color:var(--txt)">'+esc(ex.target)+'</b>'+(ex.rest?' · Rest '+esc(ex.rest):'')+'</div>':''}
      <div class="chiprow">
        <button class="pill chip">⏱ Rest timer: off</button>
        <button class="pill chip" onclick="openHist('${esc(ex.name).replace(/'/g,"\\'")}')">📈 History</button>
        <button class="pill chip" onclick="openGuide('${esc(ex.name).replace(/'/g,"\\'")}')">📖 Guide</button>
        ${sheetStandalone?"":`<button class="pill chip" onclick="openReplace()">⇄ Replace</button>`}
      </div>
      ${gymline}
      ${ex.pushed?`<div class="swwhy" style="margin-top:10px;background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3);color:#7fe6b6">\u2b06 <b style="color:#b8f2d6">Time to go heavier</b> \u2014 you hit ${ex.pushed.reps} reps at ${ex.pushed.from} lb last time. Today: ${ex.pushed.to} lb, following your ${ex.pushed.inc}-lb jumps.</div>`:""}
      ${ex.wuNote?`<div class="swwhy" style="margin-top:10px;background:rgba(143,162,201,.08);border-color:rgba(143,162,201,.3);color:#a9b9d9">${esc(ex.wuNote)}</div>`:""}
      ${ex.ssNote?`<div class="swwhy" style="margin-top:10px;background:rgba(201,162,39,.08);border-color:rgba(201,162,39,.35);color:#e8c14d">⚡ ${esc(ex.ssNote)}</div>`:""}

            ${bestSet?`<span class="g2">BEST SET ${bestSet[0]}\u00d7${bestSet[1]}</span>`:""}</div>
          ${hsA.length>1?lineChart(hsA.map(h=>h.est1rm).slice(-10)):""}
        </div>`;
      })()}
      <div style="height:1px;background:rgba(255,255,255,.07);margin:15px 0 0"></div>
      <div class="lastlbl"><span>Last Exercise <b class="gradtxt">· ${esc(ex.name)}</b></span>

      ${entry}

      <div style="height:26px"></div>

function openEntryMenu(){
  const ex = sheetExObj();
  const s = lastSession(ex.name);
  const items = sheetStandalone
    ? [{name:"✎ Edit sets & reps"},{name:"🗑 Delete this entry", danger:true}]
    : [{name:"✎ Edit sets & reps"},{name:"⇄ Replace this exercise"},{name:"🗑 Delete this entry", danger:true}];
  openListModal(ex.name, items, (j)=>{
    closeModal();
    if(sheetStandalone && j===1) j = 2;
    if(j===0){ if(s){ sheetEdit = true; renderSheet(); } else toast("Nothing logged yet"); }
    if(j===1) openReplace();
    if(j===2){ if(s){ const hs = state.histories[state.gym][ex.name]; hs.splice(hs.indexOf(s),1); saveState(); renderSheet(); toast("Entry deleted"); } }
  });
}
function editEntry(k, f, v){
  const ex = sheetExObj();
  const s = lastSession(ex.name);
  if(s && s.sets[k]) s.sets[k][f] = Number(v)||0;
}
function saveEntry(){
  const ex = sheetExObj();
  const s = lastSession(ex.name);
  if(s){ s.sets = s.sets.filter(x=>x[0]>0); s.est1rm = s.sets.length?est1RM(s.sets):null; }
  sheetEdit = false; saveState(); renderSheet(); toast("Entry updated ✓");
}
function logToday(){
  const ex = sheetExObj();
  if(ex.sets[0] && ex.sets[0].duration){ toast("Cardio session — nothing to log"); return; }
  const sets = [];
  ex.sets.filter(s=>!s.warmup && s.reps!=="" && s.weight!=="").forEach(s=>{
    sets.push([Number(s.reps),Number(s.weight)]);
    if(s.ss) sets.push([Number(s.ss.reps),Number(s.ss.weight),"ss"]);
  });
  const warm = ex.sets.filter(s=>s.warmup && s.reps!=="" && s.weight!=="").map(s=>[Number(s.reps),Number(s.weight)]);
  if(!sets.length){ toast("No planned sets to log for this exercise"); return; }
  if(!state.histories[state.gym][ex.name]) state.histories[state.gym][ex.name] = [];
  state.histories[state.gym][ex.name].unshift({date:todayISO(), time:nowTime(), sets, warmup:warm,
    est1rm:est1RM(sets), note:ex.note||null, badge:null});
  if(!state.flow.generated){ state.flow.sessView = null; state.flow.sessKey = null; }
  saveState(); renderSheet(); refreshTabs(); toast("Logged at "+GYMS[state.gym].label+" ✓ — tap ••• to edit");
}
function howTo(){
  const ex = sheetExObj();
  const ms = musclesFor(ex.name);
  let tips = [];
  (DB.muscleRef.muscle_groups||[]).forEach(g=>{
    if(ms.includes(g.group.toLowerCase()) || ms.some(m=>g.group.toLowerCase().includes(m))){
      g.parts.forEach(p=>tips.push("• "+p.name+": "+p.how_to_train));
    }
  });
  openListModal("How-To — "+ex.name, tips.length?tips.map(t=>({name:t})):[{name:"Focus on controlled reps and full range of motion."}], null);
}

      const warm = (s.warmup&&s.warmup.length)?`<div class="sess-label">Warm-up</div>`+
        s.warmup.map((x,i)=>`<div class="sess-set"><div class="hex">W</div>${x[0]} reps x ${x[1]} lb</div>`).join(""):"";
      const work = s.sets.length?`<div class="sess-label">Working sets</div>`+

      const est = s.est1rm ? `<div class="est"><div class="lbl">Est. 1 Rep Max <span>⤢</span></div>

      const note = s.note ? `<div class="sess-note"><b>Note</b>${esc(s.note)}</div>`:"";
      return `<div class="sess"><div class="sess-date disp">${fmtDate(s.date,true)}</div>
        ${badge}${warm}${work}${est}${note}<hr class="sess-hr"></div>`;

  } else {
    const chron = sess.slice().reverse();

    const wVals = chron.filter(s=>s.sets.length).map(s=>Math.max(...s.sets.map(x=>x[1]))).slice(-10);
    const volVals = chron.filter(s=>s.sets.length).map(s=>{

      const exDef = state.workouts.flatMap(w=>w.exercises).find(e=>e.name===histEx);

  }

/* ================= CHARTS ================= */
function chartFrame(vals, zero){
  const W=360, H=150, padR=44, padT=10, padB=12;
  let mn = zero?0:Math.min(...vals), mx = Math.max(...vals);
  if(mn===mx){ mx=mn+1; if(!zero) mn=mn-1; }
  if(!zero){ const pad=(mx-mn)*0.15; mn-=pad; mx+=pad; }
  const y = v => padT + (H-padT-padB) * (1-(v-mn)/(mx-mn));
  const x = i => vals.length===1 ? (W-padR)/2 : 8 + (W-padR-16)*(i/(vals.length-1));
  let grid = "";
  for(let g=0; g<6; g++){
    const gv = mn + (mx-mn)*g/5;
    const gy = y(gv);
    grid += `<line x1="0" y1="${gy}" x2="${W-padR+6}" y2="${gy}" stroke="#26262f" stroke-width="1"/>
      <text x="${W-padR+10}" y="${gy+3.5}" fill="#6a6e7d" font-size="10" font-family="inherit">${comma(Math.round(gv))}</text>`;
  }
  return {W,H,padR,y,x,grid};
}
const CHART_DEFS = ''; /* gradient #eg is defined once globally in the visible DOM */
function lineChart(vals){
  if(!vals.length) return '<div class="dim small">No data</div>';
  const f = chartFrame(vals, false);
  const pts = vals.map((v,i)=>f.x(i)+","+f.y(v)).join(" ");
  const dots = vals.map((v,i)=>`<circle cx="${f.x(i)}" cy="${f.y(v)}" r="4" fill="#ff3d77"/>`).join("");
  return `<svg viewBox="0 0 ${f.W} ${f.H}" style="width:100%">${CHART_DEFS}${f.grid}
    <polyline points="${pts}" fill="none" stroke="url(#eg)" stroke-width="2.2" stroke-linejoin="round"/>${dots}</svg>`;
}
function barChart(vals){
  if(!vals.length) return '<div class="dim small">No data</div>';
  const f = chartFrame(vals, true);
  const bw = Math.min(26, (f.W-f.padR-16)/vals.length - 6);
  const bars = vals.map((v,i)=>{
    const cx = f.x(i);
    return `<rect x="${cx-bw/2}" y="${f.y(v)}" width="${bw}" height="${f.H-12-f.y(v)}" rx="3" fill="url(#eg)"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${f.W} ${f.H}" style="width:100%">${CHART_DEFS}${f.grid}${bars}</svg>`;
}

/* ================= BODY TAB (mSTRENGTH + Recovery) ================= */
const BODY_MUSCLES = [
 {key:"chest", label:"Chest", group:"Push", seedPR:65},
 {key:"shoulders", label:"Shoulders", group:"Push", seedPR:98},
 {key:"triceps", label:"Triceps", group:"Push", seedPR:64},
 {key:"back", label:"Back", group:"Pull", seedPR:71},
 {key:"biceps", label:"Biceps", group:"Pull", seedPR:74},
 {key:"forearms", label:"Forearms", group:"Pull", seedPR:60},
 {key:"glutes", label:"Glutes", group:"Leg", seedPR:71, extraEx:["Leg Press","Romanian Deadlifts"]},
 {key:"hamstrings", label:"Hamstrings", group:"Leg", seedPR:73},
 {key:"quads", label:"Quadriceps", group:"Leg", seedPR:69},
 {key:"calves", label:"Calves", group:"Leg", seedPR:70}
];
const RECOVERY_MUSCLES = BODY_MUSCLES.concat([{key:"abs", label:"Abs", group:"Core", seedPR:60}]);
let bodyMode = "results", recView = "front";

function allExerciseNames(){
  const names = new Set();
  Object.values(state.histories).forEach(hh=>Object.keys(hh).forEach(n=>names.add(n)));
  state.workouts.forEach(w=>w.exercises.forEach(e=>names.add(e.name)));
  return [...names];
}
function exercisesForMuscle(mkey){
  const m = RECOVERY_MUSCLES.find(x=>x.key===mkey);
  const out = new Set((m&&m.extraEx)||[]);
  allExerciseNames().forEach(n=>{ if(musclesFor(n).includes(mkey)) out.add(n); });
  return [...out];
}
function mean(a){ return a.reduce((x,y)=>x+y,0)/a.length; }

/* mSTRENGTH: per-exercise est-1RM relative to its personal record, averaged across the
   muscle's exercises, scaled to the muscle's PR score. Updates live as workouts log. */
function muscleSeries(mkey){
  /* Strength Index — my own metric: each lift's est-1RM is measured against its own
     first logged session (baseline). A muscle starts at 100 and moves with real gains. */
  const exs = exercisesForMuscle(mkey);
  const sess = [];
  const base = {};
  exs.forEach(e=>{
    const hs = H(e).filter(h=>h.est1rm>0).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(hs.length) base[e] = hs[0].est1rm;
    hs.forEach(h=>sess.push({date:h.date, ex:e, v:h.est1rm}));
  });
  if(!sess.length) return [];
  sess.sort((a,b)=>a.date.localeCompare(b.date));
  const latest = {};
  const byDate = {};
  sess.forEach(s=>{
    latest[s.ex] = s.v / base[s.ex];
    byDate[s.date] = Math.round(mean(Object.values(latest))*100);
  });
  return Object.keys(byDate).sort().map(d=>({date:d, score:byDate[d]}));
}

function daysAgo(iso){
  const ms = new Date() - new Date(iso+"T12:00:00");
  return ms/86400000;
}
function agoLabel(iso){
  const d = daysAgo(iso);
  if(d < 1) return Math.max(1,Math.round(d*24))+" hours ago";
  if(d < 7) return Math.round(d)+(Math.round(d)===1?" day ago":" days ago");
  if(d < 30) return Math.round(d/7)+(Math.round(d/7)===1?" week ago":" weeks ago");
  return Math.round(d/30)+(Math.round(d/30)===1?" month ago":" months ago");
}
/* ---- fatigue model v2: per-muscle, from actual sets x reps done ----
   Direct working sets count in full (scaled a little by reps), warmups count 0.3,
   a lift's listed second muscle counts 50%, and known assist carry-over (back day
   hits biceps/forearms a bit, pressing hits triceps, etc.) counts 10-30%.
   Runs load the legs by minutes. Each day's load turns into a starting fatigue on a
   saturating curve (more sets = more fatigue, with diminishing returns), then decays
   over ~3 days - slower when under-fueled or already run down, faster when fueling
   is on target. Recent days stack. */
const INDIRECT = {
  back:{biceps:.30, forearms:.25, shoulders:.10},
  chest:{triceps:.30, shoulders:.20},
  shoulders:{triceps:.15},
  biceps:{forearms:.20},
  quads:{glutes:.25, hamstrings:.10, calves:.10},
  hamstrings:{glutes:.25},
  glutes:{hamstrings:.10}
};
const RUN_LOAD = {quads:.09, calves:.07, hamstrings:.05, glutes:.035};
function setEffort(st){ const reps = Number(st[0])||0; return 0.6 + 0.04*Math.min(reps,15); }
function muscleDayLoad(mkey, iso){
  let L = 0;
  ["rec","eos"].forEach(g=>Object.entries(state.histories[g]||{}).forEach(([name,hs])=>hs.forEach(h=>{
    if(h.date!==iso) return;
    const mm = musclesFor(name);
    let w = 0;
    if(mm[0]===mkey) w = 1;
    else if(mm.includes(mkey)) w = 0.5;
    else { const ind = INDIRECT[mm[0]]; if(ind && ind[mkey]) w = ind[mkey]; }
    if(!w) return;
    L += w * ((h.sets||[]).reduce((a,st)=>a+setEffort(st),0) + (h.warmup||[]).length*0.3);
  })));
  if(RUN_LOAD[mkey]) (state.runs||[]).forEach(r=>{
    if(r.date===iso && r.time) L += RUN_LOAD[mkey]*Number(r.time);
  });
  return L;
}
function muscleFatiguePct(mkey){
  const fu = fuelStatus();
  const tl = tirednessLevel();
  const fFuel = fu.st==="low" ? 1.25 : fu.st==="on" ? 0.9 : 1;
  const fTired = 1 + 0.15*(tl.pct/100);
  const hy = hydrationStatus();
  const fWater = hy.st==="good" ? 0.95 : hy.st==="low" ? 1.15 : 1;
  let total = 0;
  for(let i=0;i<6;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const L = muscleDayLoad(mkey, iso);
    if(!L) continue;
    const F0 = 100*(1-Math.exp(-L/12));
    const T = 72*(0.75+0.3*(F0/100))*fFuel*fTired*fWater;
    const hrs = daysAgo(iso)*24;
    if(hrs < T) total += F0*(1-hrs/T);
  }
  return Math.min(100, Math.round(total));
}
function muscleFatigue(mkey){ return muscleFatiguePct(mkey)/100; }

function sparkline(vals){
  if(vals.length<2) return '<svg width="130" height="40"></svg>';
  const v = vals.slice(-8), W=130, H=40;
  let mn = Math.min(...v), mx = Math.max(...v);
  if(mn===mx){ mn-=1; mx+=1; }
  const y = x => 6 + (H-12)*(1-(x-mn)/(mx-mn));
  const xx = i => 4 + (W-8)*(i/(v.length-1));
  const base = y(v[0]);
  const pts = v.map((s,i)=>xx(i)+","+y(s)).join(" ");
  const dots = v.map((s,i)=>`<circle cx="${xx(i)}" cy="${y(s)}" r="2.6" fill="#e8ecf2"/>`).join("");
  return `<svg width="${W}" height="${H}"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#4a4a56" stroke-width="1" stroke-dasharray="2,3"/>
    <polyline points="${pts}" fill="none" stroke="#e8ecf2" stroke-width="1.6"/>${dots}</svg>`;
}

/* ---- my gains test: session-over-session est-1RM per muscle ---- */
function muscleGainStat(key){
  const exs = allExerciseNames().filter(n=>musclesFor(n).includes(key));
  const changes = []; let sessions = 0;
  exs.forEach(n=>{
    const hs = H(n).filter(h=>h.est1rm>0).slice().sort((a,b)=>a.date.localeCompare(b.date));
    sessions += hs.length;
    if(hs.length>=2){
      const prev = hs[hs.length-2].est1rm, latest = hs[hs.length-1].est1rm;
      if(prev>0) changes.push((latest-prev)/prev*100);
    }
  });
  if(!sessions) return {st:"none"};
  if(!changes.length) return {st:"baseline", sessions};
  changes.sort((a,b)=>a-b);
  const med = changes[Math.floor(changes.length/2)];
  return {st: med>1.5?"gained":(med<-1.5?"down":"stagnant"), pct:Math.round(med*10)/10, n:changes.length, sessions};
}
/* ---- tiredness from sets x reps volume ---- */
function sessVol(h){ let v=0; (h.sets||[]).forEach(s=>{ v += (s[0]||0)*(s[1]||0); }); return v; }
function muscleWorkload(key){
  const exs = allExerciseNames().filter(n=>musclesFor(n).includes(key));
  let recentVol = 0; const daily = {};
  exs.forEach(n=>H(n).forEach(h=>{
    const v = sessVol(h);
    daily[h.date] = (daily[h.date]||0) + v;
    if(daysAgo(h.date) <= 3) recentVol += v;
  }));
  const days = Object.keys(daily);
  if(!days.length) return null;
  const avg = days.reduce((a,d)=>a+daily[d],0)/days.length;
  return {recentVol: Math.round(recentVol), avg: Math.round(avg), ratio: avg?recentVol/avg:0};
}
function tirednessBase(){
  let recent = 0; const daily = {};
  Object.keys(state.histories[state.gym]||{}).forEach(n=>H(n).forEach(h=>{
    const v = sessVol(h); daily[h.date] = (daily[h.date]||0) + v;
    if(daysAgo(h.date) <= 3) recent += v;
  }));
  const days = Object.keys(daily);
  if(!days.length || !recent) return {label:"Fresh", pct:8, desc:"No lifting volume in the last 3 days \u2014 fully charged. Time to pick a muscle."};
  const avg = days.reduce((a,d)=>a+daily[d],0)/days.length;
  const r = recent/(avg*1.5);
  if(r<0.5) return {label:"Fresh", pct:25, desc:"Light load these 3 days vs your usual \u2014 recovery is ahead of the work."};
  if(r<1.0) return {label:"Working", pct:55, desc:"Normal training load \u2014 tired in the right way, recovering on schedule."};
  if(r<1.5) return {label:"Tired", pct:80, desc:"You've stacked well above your usual volume \u2014 favor fresher muscles or a short format today."};
  return {label:"Cooked", pct:97, desc:"3-day volume is way past your average \u2014 today is a smart day for an easy run or full rest."};
}
function tirednessLevel(){
  const base = tirednessBase();
  const fu = fuelStatus();
  if(fu.st==="low"){
    base.pct = Math.min(100, base.pct+18);
    base.label = base.label==="Fresh" ? "Working" : base.label==="Working" ? "Tired" : "Cooked";
    base.desc += " On top of that you're under-fueled \u2014 recovery is running slower than the workload math alone.";
  } else if(fu.st==="on"){
    base.desc += " Fueling is on target, which speeds all of this up.";
  }
  return base;
}

function mstrChart(pts, start, end){
  const W=380, H=210, padR=34, padT=12, padB=26;
  const vals = pts.map(p=>p.score);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  const span = Math.max(4, mx-mn);
  mn = mn - span*0.5; mx = mx + span*0.5;
  const t0 = start.getTime(), t1 = end.getTime();
  const X = d => 6 + (W-padR-14) * ((new Date(d+"T12:00:00").getTime()-t0)/(t1-t0));
  const Y = v => padT + (H-padT-padB)*(1-(v-mn)/(mx-mn));
  let grid = "";
  for(let i=0;i<5;i++){
    const gv = mn + (mx-mn)*i/4;
    grid += `<line x1="0" y1="${Y(gv)}" x2="${W-padR}" y2="${Y(gv)}" stroke="#26262f"/>
      <text x="${W-padR+6}" y="${Y(gv)+3.5}" fill="#6a6e7d" font-size="10">${Math.round(gv)}</text>`;
  }
  const cols = 5;
  let xlab = "";
  for(let iC=0;iC<=cols;iC++){
    const x = 6 + (W-padR-14)*iC/cols;
    grid += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}" stroke="#20202a"/>`;
    if(iC<cols){
      const a = new Date(t0+(t1-t0)*iC/cols), b = new Date(t0+(t1-t0)*(iC+1)/cols-86400000);
      const lab = (t1-t0)/86400000 > 90 ? ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][a.getMonth()] : a.getDate()+"-"+b.getDate();
      xlab += `<text x="${6+(W-padR-14)*(iC+0.5)/cols}" y="${H-8}" fill="#6a6e7d" font-size="9.5" text-anchor="middle">${lab}</text>`;
    }
  }
  const line = pts.map(p=>X(p.date)+","+Y(p.score)).join(" ");
  const dots = pts.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.score)}" r="4.2" fill="#ff3d77"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${CHART_DEFS}${grid}${xlab}
    ${pts.length>1?`<polyline points="${line}" fill="none" stroke="url(#eg)" stroke-width="2.2"/>`:""}${dots}</svg>`;
}

function dayBurn(iso){

    if(h.date===iso) sets += (h.sets||[]).length + (h.warmup||[]).length;

function foodAnalysis(){
  const es = (state.food||[]).filter(e=>e.kcal!=null||e.protein!=null).sort((a,b)=>a.date.localeCompare(b.date));
  if(!es.length) return null;
  const n = es.length;
  const avg = k => Math.round(es.reduce((a,e)=>a+(e[k]||0),0)/n);
  const avgK = avg("kcal"), avgP = avg("protein"), avgC = avg("carbs"), avgF = avg("fat");
  const pHit = es.filter(e=>(e.protein||0) >= FOOD_TARGET.protein*0.95).length;
  const kHit = es.filter(e=>e.kcal && e.kcal <= FOOD_TARGET.kcal+150).length;
  const lowDays = es.filter(e=>e.kcal && e.kcal < 1600).length;
  const mAvg = {breakfast:{k:0,p:0}, lunch:{k:0,p:0}, dinner:{k:0,p:0}, snacks:{k:0,p:0}};
  es.forEach(e=>{ const m=e.meals||{};
    ["breakfast","lunch","dinner","snacks"].forEach(k=>(m[k]||[]).forEach(x=>{ mAvg[k].k+=(x.kcal||0)/n; mAvg[k].p+=(x.p||0)/n; }));
  });
  const items = {};
  es.forEach(e=>Object.values(e.meals||{}).forEach(arr=>(arr||[]).forEach(x=>{
    const it = items[x.name] = items[x.name]||{name:x.name,k:0,p:0,times:0};
    it.k += x.kcal||0; it.p += x.p||0; it.times++;
  })));
  const list = Object.values(items);
  const topK = list.slice().sort((a,b)=>b.k-a.k).slice(0,5);
  const bestP = list.filter(x=>x.k>=60 && x.p>0).map(x=>({...x, dens: Math.round(x.p/(x.k||1)*100)})).sort((a,b)=>b.dens-a.dens).slice(0,4);
  const lowReturn = list.filter(x=>x.k>=350 && (x.p/(x.k||1)*100)<6).sort((a,b)=>b.k-a.k).slice(0,3);
  const runDates = new Set((state.runs||[]).map(r=>r.date));
  const rcs = es.filter(e=>runDates.has(e.date) && e.carbs!=null);
  const ncs = es.filter(e=>!runDates.has(e.date) && e.carbs!=null);
  const runCarb = rcs.length ? Math.round(rcs.reduce((a,e)=>a+e.carbs,0)/rcs.length) : null;
  const restCarb = ncs.length ? Math.round(ncs.reduce((a,e)=>a+e.carbs,0)/ncs.length) : null;
  const pScore = Math.min(1, avgP/FOOD_TARGET.protein);
  const kScore = avgK<=FOOD_TARGET.kcal ? Math.max(0.4, avgK/FOOD_TARGET.kcal) : Math.max(0, 1-(avgK-FOOD_TARGET.kcal)/800);
  const score = Math.round((0.6*pScore + 0.4*kScore)*100);
  const grade = score>=85?"A":score>=70?"B":score>=55?"C":score>=40?"D":"F";
  const gradeColor = score>=70?"var(--green)":score>=55?"#c9a227":"#ff5c7a";
  return {es,n,avgK,avgP,avgC,avgF,pHit,kHit,lowDays,mAvg,topK,bestP,lowReturn,runCarb,restCarb,score,grade,gradeColor};
}

function foodCoach(){
  const a = foodAnalysis();
  const pGap = Math.max(0, FOOD_TARGET.protein - (a?a.avgP:0));
  const burn = dayBurn(todayISO()).total;
  const room = Math.max(0, FOOD_TARGET.kcal + burn - (a?a.avgK:0));
  /* fastest path: greedy by protein density until the gap is covered */
  const picks = [];
  let got = 0, kc = 0;
  const pool = REC_FOODS.filter(f=>f.p>=18).sort((x,y)=>(y.p/y.k)-(x.p/x.k));
  for(const f of pool){
    if(got >= pGap) break;
    if(kc + f.k > Math.max(room, 600)) continue;
    picks.push(f); got += f.p; kc += f.k;
  }
  return {a, pGap, room, picks, got, kc};
}

function saveWorkoutForLater(){
  const w = curW();
  if(!state.savedWorkouts) state.savedWorkouts = [];
  const item = {
    id: "sw_"+Date.now().toString(36),
    savedAt: todayISO(),
    name: w.name,
    gym: state.gym,
    format: state.flow.format || "long",
    muscles: (state.flow.muscles||[]).slice(),
    editText: state.flow.editText || copyText(),
    w: JSON.parse(JSON.stringify(w))
  };
  /* same name saved again on the same day replaces instead of piling up */
  state.savedWorkouts = state.savedWorkouts.filter(x=>!(x.name===item.name && x.savedAt===item.savedAt));
  state.savedWorkouts.unshift(item);
  state.savedWorkouts = state.savedWorkouts.slice(0, 20);
  saveState();
  toast("Saved \u2713 \u2014 it's waiting on the opening screen");
}
function loadSavedWorkout(id){
  const sw = (state.savedWorkouts||[]).find(x=>x.id===id);
  if(!sw) return;
  state.gym = sw.gym;
  state.flow = {mode:"gym", step:6, muscles:(sw.muscles||[]).slice(), format:sw.format,
    generated: JSON.parse(JSON.stringify(sw.w)), sessView: JSON.parse(JSON.stringify(sw.w)),
    sessKey: "saved:"+sw.id, genTime: nowTime(), genDate: todayISO(),
    editText: sw.editText, uploaded: false, adjust: null, level: null};
  saveState();
  switchTab("workout");
}
function deleteSavedWorkout(id, ev){
  if(ev) ev.stopPropagation();
  state.savedWorkouts = (state.savedWorkouts||[]).filter(x=>x.id!==id);
  saveState(); renderGate();
  toast("Saved workout removed");
}

function gateUpload(){
  const el = $("gatefood");
  const t = (el && el.value.trim()) || "";
  if(!t){ toast("Paste your MyFitnessPal lines first"); return; }
  const btn = $("gateupbtn");
  if(btn){ btn.disabled = true; btn.innerHTML = "\u23f3 Reading your data\u2026<small>PARSING FOOD \u00b7 WATER \u00b7 RUNS</small>"; }
  /* let it take a beat - parse + merge + full re-render, accuracy over speed */
  setTimeout(()=>{
    try{
      const es = parseFoodText(t);
      const rs = (typeof parseCardioText==="function") ? parseCardioText(t) : [];
      if(!es.length && !rs.length){
        toast("Couldn't read that \u2014 include calories or protein");
        if(btn){ btn.disabled = false; btn.innerHTML = "Upload<small>PARSES \u00b7 SAVES \u00b7 UPDATES THE WHOLE DASHBOARD</small>"; }
        return;
      }
      if(!state.food) state.food = [];
      es.forEach(e=>{ state.food = state.food.filter(x=>x.date!==e.date); state.food.push(e); });
      state.food.sort((a,b)=>b.date.localeCompare(a.date));
      state.food = state.food.filter(e=>e.date >= yearAgoISO());
      const runsAdded = mergeRuns(rs);
      state.lastFoodSync = Date.now();
      saveState(); refreshTabs(); renderTargets();
      gateFoodOpen = false;
      switchTab("dash");
      toast(es.length+" day"+(es.length===1?"":"s")+" of food"+(runsAdded?" + "+runsAdded+" run"+(runsAdded===1?"":"s"):"")+" uploaded \u2713"+((rs.length-runsAdded)>0?" \u00b7 "+(rs.length-runsAdded)+" duplicate run"+((rs.length-runsAdded)===1?"":"s")+" skipped":""));
    }catch(err){
      toast("Something went wrong reading that \u2014 try again");
      if(btn){ btn.disabled = false; btn.innerHTML = "Upload<small>PARSES \u00b7 SAVES \u00b7 UPDATES THE WHOLE DASHBOARD</small>"; }
    }
  }, 900);
}

let logMonth = null, logExpanded = false, logSelDay = null, dashRecovOpen = false, dashFoodAOpen = false, dashFoodROpen = false;
function selectLogDay(iso){
  logSelDay = (logSelDay===iso) ? null : iso;
  logRefresh();
  if(logSelDay) setTimeout(()=>{
    const el = document.querySelector('.screen.active #dayinline');
    if(el) el.scrollIntoView({block:"start", behavior:"smooth"});
  }, 60);
}
function logDays(){
  const days = {};
  ["rec","eos"].forEach(g=>{
    Object.entries(state.histories[g]||{}).forEach(([name,hs])=>hs.forEach(h=>{
      const d = (days[h.date] = days[h.date] || {date:h.date, entries:[]});
      d.entries.push({name, gym:g, sets:h.sets||[], warmup:h.warmup||[], time:h.time||null, est:h.est1rm||null, _ref:h});
    }));
  });
  (state.runs||[]).forEach(r=>{
    const d = (days[r.date] = days[r.date] || {date:r.date, entries:[]});
    (d.runs = d.runs || []).push(r);
  });
  return days;
}
function estMin(day){
  const sets = day.entries.reduce((a,e)=>a+e.sets.length+e.warmup.length,0);
  const lift = day.entries.length ? Math.max(15, Math.round(sets*3.5)) : 0;
  const run = (day.runs||[]).reduce((a,r)=>a+(Number(r.time)||0),0);
  return Math.max(1, lift + Math.round(run));
}
function dayVolume(day){
  return Math.round(day.entries.reduce((a,e)=>a+e.sets.concat(e.warmup).reduce((x,s)=>x+s[0]*s[1],0),0));
}
function dayTitle(day){
  const lb = state.logbook.find(l=>l.date===day.date);
  if(lb) return lb.workout;
  const counts = {};
  day.entries.forEach(e=>{ const m = MUSCLE_LABEL[musclesFor(e.name)[0]]||"Other"; counts[m]=(counts[m]||0)+1; });
  const tops = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,2);
  if(tops.length) return tops.join(" + ");
  if(day.runs && day.runs.length) return day.runs[0].name;
  return "Workout";
}
function dayGyms(day){ return [...new Set(day.entries.map(e=>e.gym))]; }
function fmtClock(min){
  if(min>=60) return Math.floor(min/60)+":"+String(min%60).padStart(2,"0")+":00";
  return min+":00";
}
function weekBounds(d){
  const s = new Date(d); s.setDate(s.getDate()-s.getDay()); s.setHours(12,0,0,0);
  return s;
}
function logRefresh(){ renderLog(); renderDash(); }
function logCalHtml(showStats){
  const days = logDays();
  const dates = Object.keys(days).sort();
  const now = new Date();
  if(!logMonth) logMonth = {y:now.getFullYear(), m:now.getMonth()};
  const total = dates.length;
  const ws = weekBounds(now);
  let weekCount = 0;
  for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(ws.getDate()+i);
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(days[iso]) weekCount++; }
  let streak = 0;
  for(let wk=1; wk<60; wk++){
    const s = new Date(ws); s.setDate(ws.getDate()-7*wk);
    let c = 0;
    for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(s.getDate()+i);
      const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      if(days[iso]) c++; }
    if(c>=5) streak++; else break;
  }
  const miles = [10,25,50].map(t=>total>=t);
  const MOS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const todayIso = todayISO();
  function cell(dt, inMonth){
    const iso = dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
    const has = days[iso];
    const lift = !!(has && has.entries && has.entries.length);
    const run = !!(has && has.runs && has.runs.length);
    const food = dayHasFood(iso);
    const any = lift || run || food;
    const isToday = iso===todayIso;
    return `<div class="lcal-cell ${inMonth?"":"out"} ${any?"has":""} ${iso===logSelDay?"selday":""}" ${any?`onclick="selectLogDay('${iso}')"`:""}>
      <span class="lcal-num ${isToday?"today":""}">${dt.getDate()}</span>
      ${any?`<span class="lcal-dur" style="letter-spacing:1.5px">${lift?'<span style="color:#ff5c7a">\u25cf</span>':''}${run?'<span style="color:#4c9aff">\u25cf</span>':''}${food?'<span style="color:var(--green)">\u25cf</span>':''}</span>`
        :"<span class=\"lcal-dur\">&nbsp;</span>"}
    </div>`;
  }
  const first = new Date(logMonth.y, logMonth.m, 1);
  const startDow = first.getDay();
  let grid = "";
  if(logExpanded){
    const cells = [];
    const start = new Date(first); start.setDate(1-startDow);
    for(let i=0;i<42;i++){ const d = new Date(start); d.setDate(start.getDate()+i);
      cells.push(cell(d, d.getMonth()===logMonth.m));
      if(cells.length===42 && d>=new Date(logMonth.y, logMonth.m+1, 0)) break; }
    grid = cells.join("");
  } else {
    const base = (logMonth.y===now.getFullYear() && logMonth.m===now.getMonth()) ? weekBounds(now) : (()=>{const s=new Date(first); s.setDate(1-startDow); return s;})();
    const cells = [];
    for(let i=0;i<7;i++){ const d = new Date(base); d.setDate(base.getDate()+i); cells.push(cell(d, d.getMonth()===logMonth.m)); }
    grid = cells.join("");
  }
  return `
    ${showStats?`<div class="lg-stats">
      <div class="lg-stat"><div class="k">Workouts</div><div class="v">${total}</div></div>
      <div class="lg-stat"><div class="k">Milestones</div><div class="v" style="display:flex;gap:5px;justify-content:center">${miles.map(on=>`<span class="hexbadge ${on?"on":""}">&#127947;</span>`).join("")}</div></div>
      <div class="lg-stat"><div class="k">Weekly goal</div><div class="v">${weekCount}<span>/5 days</span></div></div>
      <div class="lg-stat"><div class="k">Current streak</div><div class="v">${streak}<span> week${streak===1?"":"s"}</span></div></div>
    </div>`:""}
    <div class="lg-sechead">Calendar
      <span style="margin-left:auto;display:flex;align-items:center;gap:6px">
        <button class="lcal-nav" onclick="logNav(-1)">&#8249;</button>
        <span class="lcal-mo" onclick="logExpanded=!logExpanded;logRefresh()">${MOS[logMonth.m]}${logMonth.y!==now.getFullYear()?" '"+String(logMonth.y).slice(2):""} ${logExpanded?"&#8963;":"&#8964;"}</span>
        <button class="lcal-nav" onclick="logNav(1)">&#8250;</button>
      </span></div>
    <div class="lcal">
      <div class="lcal-head">${["SU","MO","TU","WE","TH","FR","SA"].map((d,i)=>`<span class="${i===now.getDay()?"on":""}">${d}</span>`).join("")}</div>
      <div class="lcal-grid">${grid}</div>
      <div style="display:flex;gap:16px;justify-content:center;padding:7px 0 9px;font-size:9.5px;font-weight:800;color:var(--dim);letter-spacing:.05em">
        <span><span style="color:#ff5c7a">\u25cf</span> LIFT</span>
        <span><span style="color:#4c9aff">\u25cf</span> RUN</span>
        <span><span style="color:var(--green)">\u25cf</span> FOOD</span>
      </div>
    </div>
    ${logSelDay?(()=>{
      const sec = daySectionsHtml(logSelDay);
      if(!sec.html.trim()) return "";
      return `<div id="dayinline">
        <div class="lg-sechead" style="margin-top:10px">${logSelDay===todayIso?"Today":fmtDate(logSelDay,true)}
          <button class="lcal-nav" style="margin-left:auto" onclick="selectLogDay('${logSelDay}')">\u00d7</button></div>
        ${sec.html}</div>`;
    })():""}`;
}

function prInfoFor(name, gym, date){
  const hs = ((state.histories[gym]||{})[name]||[]).filter(h=>h.est1rm>0);
  const cur = hs.filter(h=>h.date===date).sort((a,b)=>b.est1rm-a.est1rm)[0];
  if(!cur) return null;
  const prev = hs.filter(h=>h.date<date);
  if(!prev.length) return {tag:"first", txt:"FIRST LOG \u00b7 baseline set"};
  const prevBest = Math.max(...prev.map(h=>h.est1rm));
  const last = prev.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const d = Math.round((cur.est1rm-last.est1rm)*10)/10;
  if(cur.est1rm > prevBest) return {tag:"pr", txt:"\ud83c\udfc6 PR \u2014 est 1RM "+cur.est1rm+" lb (+"+(Math.round((cur.est1rm-prevBest)*10)/10)+")"};
  if(d > 0) return {tag:"gain", txt:"\u2191 GAIN +"+d+" lb est 1RM vs last time"};
  if(d === 0) return {tag:"flat", txt:"\u2192 held even with last time"};
  return {tag:"down", txt:"\u2193 "+Math.abs(d)+" lb off your last session"};
}
function prBadge(pr){
  if(!pr) return "";
  const s = pr.tag==="pr" ? "color:#ffd166;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35)"
    : pr.tag==="gain" ? "color:var(--green);background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35)"
    : pr.tag==="down" ? "color:#ff5c7a;background:rgba(255,61,119,.08);border:1px solid rgba(255,61,119,.3)"
    : "color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line)";
  return `<div style="display:inline-block;font-size:10px;font-weight:800;border-radius:9px;padding:3px 8px;margin-top:5px;${s}">${pr.txt}</div>`;
}
function foodSectionHtml(iso){
  const fe = foodFor(iso);
  if(!fe || !dayHasFood(iso)) return "";
  const meals = fe.meals||{};
  const mrows = ["breakfast","lunch","dinner","snacks"].map(k=>{
    const arr = meals[k]||[]; if(!arr.length) return "";
    const tot = arr.reduce((a,x)=>a+(x.kcal||0),0);
    return `<div class="lel" style="font-size:10.5px;font-weight:800;color:var(--dim2);letter-spacing:.05em;margin-top:9px">${k.toUpperCase()}${tot?" \u00b7 "+comma(tot)+" kcal":""}</div>`
      + arr.map(x=>`<div class="lel" style="font-size:13px;line-height:1.6">${esc(x.name)} <span style="color:var(--dim);font-size:11.5px">${[x.kcal!=null?comma(x.kcal)+" kcal":null,x.p!=null?x.p+"p":null,x.c!=null?x.c+"c":null,x.f!=null?x.f+"f":null].filter(Boolean).join(" \u00b7 ")}</span></div>`).join("");
  }).join("");
  const macro = [fe.kcal!=null?comma(fe.kcal)+" kcal":null, fe.protein!=null?fe.protein+"g protein":null,
    fe.carbs!=null?fe.carbs+"g carbs":null, fe.fat!=null?fe.fat+"g fat":null].filter(Boolean).join(" \u00b7 ");
  const pOK = fe.protein!=null && fe.protein >= FOOD_TARGET.protein*0.95;
  return `<div class="lg-sechead" style="margin-top:16px;color:var(--green);border-bottom:2px solid rgba(61,220,151,.35);padding-bottom:6px">\ud83c\udf4e Food \u00b7 what you ate</div>
    <div class="ld-exrow"><div style="flex:1;min-width:0">
      ${macro?`<div class="lhead" style="font-size:13.5px">${macro}</div>`:`<div class="lhead" style="font-size:13.5px;color:var(--dim2)">no totals synced</div>`}
      ${fe.protein!=null?`<div style="display:inline-block;font-size:10px;font-weight:800;border-radius:9px;padding:3px 8px;margin-top:5px;${pOK?"color:var(--green);background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35)":"color:#c9a227;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.3)"}">${pOK?"\u2713 protein target hit":"protein "+fe.protein+" / "+FOOD_TARGET.protein+" g"}</div>`:""}
      ${mrows || `<div class="lel" style="font-size:12.5px;color:var(--dim2);margin-top:6px">no meal detail synced</div>`}
      ${waterFor(iso)>0?`<div class="lel" style="font-size:12px;margin-top:8px;color:#9cc4ff">\ud83d\udca7 ${waterFor(iso)} oz water \u00b7 ${Math.round(waterFor(iso)/WATER_TARGET*100)}% of target</div>`:""}
      ${state.supps&&state.supps[iso]?`<div class="lel" style="font-size:12px;margin-top:8px;color:var(--green)">\ud83d\udc8a supplements taken \u2713</div>`:""}
    </div></div>`;
}
function daySectionsHtml(iso){
  const day = logDays()[iso] || {date:iso, entries:[], runs:[]};
  const names = [...new Set(day.entries.map(e=>e.name))];
  let prCount = 0, gainCount = 0;
  const rows = names.map(n=>{
    const es = day.entries.filter(e=>e.name===n);
    const sets = es.flatMap(e=>e.warmup.map(s=>({s,w:1})).concat(e.sets.map(s=>({s,w:0}))));
    const pr = prInfoFor(n, es[0].gym, iso);
    if(pr && pr.tag==="pr") prCount++;
    if(pr && pr.tag==="gain") gainCount++;
    return `<div class="ld-exrow">
      <div class="lthumbwrap"><div class="lthumb" style="width:48px;height:58px">${figureSVG(musclesFor(n),44)}</div><div class="lcheck">&#10003;</div></div>
      <div style="flex:1;min-width:0">
        <div class="lhead" style="font-size:14.5px">${esc(n)} <span class="lt" style="vertical-align:2px">${GYMS[es[0].gym].label.toUpperCase()}</span></div>
        <div class="lsets" style="margin-top:4px">${sets.map(x=>`<div class="lel" style="font-size:13px;line-height:1.55">${x.w?'<span style="color:var(--dim2);font-size:10px">W</span> ':''}<b>${x.s[0]} reps</b> x ${x.s[1]} lb</div>`).join("")}</div>
        ${prBadge(pr)}
      </div>
      <button class="dots" onclick="logExMenu('${iso}','${esc(n).replace(/'/g,"\\'")}')">&#8226;&#8226;&#8226;</button>
    </div>`;
  }).join("");
  const runRowsN = (day.runs||[]).length;
  const runRows = (day.runs||[]).map(r=>`<div class="ld-exrow">
      <div class="lthumbwrap"><div class="lthumb" style="width:48px;height:58px">${figureSVG(["quads","calves"],44)}</div><div class="lcheck">\u2713</div></div>
      <div style="flex:1;min-width:0">
        <div class="lhead" style="font-size:14.5px">${esc(r.name)} <span class="lt" style="vertical-align:2px">RUNNING</span></div>
        <div class="lsets" style="margin-top:4px">
          ${r.time!=null?`<div class="lel" style="font-size:13px"><b>${r.time} min</b> time</div>`:""}
          ${r.dist!=null?`<div class="lel" style="font-size:13px"><b>${r.dist} km</b> distance</div>`:""}
          ${r.pace!=null?`<div class="lel" style="font-size:13px"><b>${r.pace} min/km</b> avg pace</div>`:""}
        </div>
      </div></div>`).join("");
  const html = `
    ${names.length?`<div class="lg-sechead" style="margin-top:16px;color:#ff5c7a;border-bottom:2px solid rgba(255,92,122,.35);padding-bottom:6px">\ud83c\udfcb\ufe0f Lifting \u00b7 ${names.length} exercise${names.length>1?"s":""}</div>${rows}`:""}
    ${runRowsN?`<div class="lg-sechead" style="margin-top:16px;color:#4c9aff;border-bottom:2px solid rgba(76,154,255,.35);padding-bottom:6px">\ud83c\udfc3 Running \u00b7 ${runRowsN} run${runRowsN>1?"s":""}</div>${runRows}`:""}
    ${foodSectionHtml(iso)}`;
  return {html, prCount, gainCount, names, runRowsN, day};
}
function openLogDetail(iso){
  const day = logDays()[iso] || {date:iso, entries:[], runs:[]};
  const fe = foodFor(iso);
  if(!day.entries.length && !(day.runs||[]).length && !dayHasFood(iso)) return;
  const min = estMin(day), vol = dayVolume(day), kcal = Math.round(min*4.3);
  const runMin = (day.runs||[]).reduce((a,r)=>a+(Number(r.time)||0),0);
  const label = iso===todayISO() ? "Today" : fmtDate(iso);
  const t = day.entries.find(e=>e.time);
  $("ldtitle").textContent = label + (t?", "+t.time:"");
  const muscles = [...new Set(day.entries.flatMap(e=>musclesFor(e.name)))];
  const frontM = muscles.filter(m=>!BACK_MUSCLES[m]);
  const backM = muscles.filter(m=>BACK_MUSCLES[m]);
  const sec = daySectionsHtml(iso);
  const names = sec.names, prCount = sec.prCount, gainCount = sec.gainCount, runRowsN = sec.runRowsN;
  $("ldscroll").innerHTML = `
    <div style="display:flex;justify-content:center;gap:14px;margin:8px 0 4px">
      <div class="lthumb" style="width:74px;height:92px">${figureSVG(frontM.length?frontM:["chest"],76)}</div>
      <div class="lthumb" style="width:74px;height:92px">${figureSVG(backM.length?backM:["back"],76)}</div>
    </div>
    <div class="fq" style="text-align:center;margin:10px 0 2px;font-size:23px">${esc((day.entries.length||(day.runs||[]).length)?dayTitle(day):"Food log")}</div>
    ${(prCount||gainCount)?`<div style="text-align:center;margin:4px 0 2px">${prCount?'<span style="font-size:11px;font-weight:800;color:#ffd166;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);border-radius:10px;padding:3px 10px;margin:0 3px">\ud83c\udfc6 '+prCount+' PR'+(prCount>1?"s":"")+'</span>':""}${gainCount?'<span style="font-size:11px;font-weight:800;color:var(--green);background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35);border-radius:10px;padding:3px 10px;margin:0 3px">\u2191 '+gainCount+' gain'+(gainCount>1?"s":"")+'</span>':""}</div>`:""}
    ${runMin?`<div style="text-align:center;color:var(--dim);font-weight:800;font-size:15px">${runMin>=60?Math.floor(runMin/60)+"h "+(runMin%60)+"m":runMin+"m"} running</div>`:""}
    <div style="display:flex;justify-content:center;gap:22px;margin:12px 0 4px;flex-wrap:wrap">
      <div style="text-align:center"><div class="lp-stats-k">BURNED</div><div style="font-weight:800;font-size:17px">${comma(dayBurn(iso).total||kcal)} <small style="color:var(--dim);font-size:11px">kCal</small></div></div>
      <div style="text-align:center"><div class="lp-stats-k">VOLUME</div><div style="font-weight:800;font-size:17px">${comma(vol)} <small style="color:var(--dim);font-size:11px">lb</small></div></div>
      ${(()=>{ const fe = foodFor(iso); if(!fe || fe.kcal==null) return "";
        const net = fe.kcal - dayBurn(iso).total;
        return `<div style="text-align:center"><div class="lp-stats-k">FOOD IN</div><div style="font-weight:800;font-size:17px">${comma(fe.kcal)} <small style="color:var(--dim);font-size:11px">kCal</small></div></div>
        <div style="text-align:center"><div class="lp-stats-k">NET</div><div style="font-weight:800;font-size:17px;color:${net<=FOOD_TARGET.kcal?"var(--green)":"#c9a227"}">${comma(net)} <small style="color:var(--dim);font-size:11px">kCal</small></div></div>`; })()}
    </div>
    ${sec.html}
    <div style="height:30px"></div>`;
  $("logdetail").classList.add("open");
}
function closeLogDetail(){ $("logdetail").classList.remove("open"); }
function logExMenu(iso, name){
  openListModal(name, [
    {name:"\uD83D\uDCC8 View history & trends"},
    {name:"\uD83D\uDDD1 Delete from this workout", danger:true}
  ], (j)=>{
    closeModal();
    if(j===0){ closeLogDetail(); openHist(name); }
    if(j===1){
      ["rec","eos"].forEach(g=>{
        if(state.histories[g][name]){
          state.histories[g][name] = state.histories[g][name].filter(h=>h.date!==iso);
          if(!state.histories[g][name].length) delete state.histories[g][name];
        }
      });
      saveState();
      const day = logDays()[iso];
      if(day) openLogDetail(iso); else closeLogDetail();
      toast("Removed "+name);
    }
  });
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fitbod_replica_backup.json";
  a.click();
  toast("Backup downloaded");
}
function importData(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json";
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ state = JSON.parse(r.result); saveState(); renderFlow(); renderLog(); toast("Data imported \u2713"); }catch(err){ toast("Invalid backup file"); } };
    r.readAsText(f);
  };
  inp.click();
}

/* ================= SEEDED UPLOADS (one-time merge into saved data) ================= */
function applySeeds(){
  const seeds = DB.seedUploads||[];
  if(!seeds.length) return;
  if(!state.appliedSeeds) state.appliedSeeds = [];
  let applied = 0;
  seeds.forEach(sd=>{
    if(state.appliedSeeds.includes(sd.id)) return;
    const gym = sd.gym||"rec";
    if(!state.histories[gym]) state.histories[gym] = {};
    (sd.exercises||[]).forEach(ex=>{
      if(!state.histories[gym][ex.name]) state.histories[gym][ex.name] = [];
      state.histories[gym][ex.name].unshift({date:sd.date, time:sd.time||null, sets:ex.sets, warmup:ex.warmup||[],
        est1rm:est1RM(ex.sets.filter(s=>s[2]!=="ss")), note:ex.note||null, badge:null});
    });
    state.logbook.unshift({date:sd.date, gym:GYMS[gym].label,
      workout:(sd.dayName||"Uploaded workout"),
      exercises:(sd.exercises||[]).map(e=>({name:e.name, n:e.sets.length}))});
    state.appliedSeeds.push(sd.id);
    applied++;
  });
  if(applied){
    if(!state.flow.generated){ state.flow.sessView = null; state.flow.sessKey = null; }
    saveState();
    setTimeout(()=>toast("Workout added to your log \u2713"), 600);
  }
}

/* ---- dashboard view toggle: the computer can open the phone view and come back ---- */
function dashViewMode(){ try{ return localStorage.getItem("fwt_view")||"auto"; }catch(e){ return "auto"; } }
function setDashView(v){ try{ localStorage.setItem("fwt_view", v); }catch(e){} renderDash(); window.scrollTo(0,0); }

/* ============ DEVICE SYNC: the phone feeds the computer dashboard ============
   Every device pulls sync.json from the hub on open + every 5 min (no token needed).
   A device with the token saved (one-time paste, kept in that device's storage only)
   pushes its workouts/food/water/runs up after changes. */
const SYNC_REPO = "Sammypisano/Sammypisano.github.io";
function syncToken(){ try{ return localStorage.getItem("fwt_gh_token")||""; }catch(e){ return ""; } }
function syncSetup(){
  const cur = syncToken();
  const t = prompt(cur ? "Sync is ON for this device. Paste a new GitHub token to replace it, or clear the box and press OK to turn sync off." : "Paste your GitHub token (it stays on this device only). This lets this device push what you log into the hub so the computer dashboard sees it.", cur ? "\u2022\u2022\u2022\u2022saved\u2022\u2022\u2022\u2022" : "");
  if(t === null) return;
  if(!t.trim()){ localStorage.removeItem("fwt_gh_token"); toast("Device sync off"); renderGate(); return; }
  if(t.indexOf("\u2022") >= 0) return;
  localStorage.setItem("fwt_gh_token", t.trim());
  toast("Sync on \u2713 \u2014 this device now feeds the hub");
  renderGate(); queueSync();
}
function buildSyncDoc(){
  return {histories: state.histories, logbook: state.logbook||[], runs: state.runs||[],
    food: state.food||[], water: state.water||{}, supps: state.supps||{},
    savedWorkouts: state.savedWorkouts||[], custom: state.custom||[]};
}
function mergeSyncDoc(doc){
  if(!doc) return 0;
  let changed = 0;
  ["rec","eos"].forEach(g=>{
    const src = (doc.histories||{})[g]||{};
    if(!state.histories[g]) state.histories[g] = {};
    Object.keys(src).forEach(n=>{
      const loc = state.histories[g][n] = state.histories[g][n]||[];
      (src[n]||[]).forEach(h=>{ if(h && h.date && !loc.some(x=>x.date===h.date)){ loc.push(h); changed++; } });
      loc.sort((a,b)=>b.date.localeCompare(a.date));
    });
  });
  (doc.logbook||[]).forEach(l=>{
    if(l && l.date && !(state.logbook||[]).some(x=>x.date===l.date && x.workout===l.workout)){ state.logbook.unshift(l); changed++; }
  });
  changed += mergeRuns(doc.runs||[]);
  (doc.food||[]).forEach(e2=>{
    if(!e2 || !e2.date) return;
    const cur = (state.food||[]).find(x=>x.date===e2.date);
    const items = en => Object.values((en&&en.meals)||{}).reduce((a,m)=>a+(m||[]).length,0);
    if(!cur){ if(!state.food) state.food=[]; state.food.push(e2); changed++; }
    else if(items(e2) > items(cur) || (e2.water||0) > (cur.water||0)){
      state.food = state.food.filter(x=>x.date!==e2.date); state.food.push(e2); changed++;
    }
  });
  Object.keys(doc.water||{}).forEach(d=>{
    if(!state.water) state.water = {};
    if((state.water[d]||0) < doc.water[d]){ state.water[d] = doc.water[d]; changed++; }
  });
  Object.keys(doc.supps||{}).forEach(d=>{ if(!state.supps) state.supps={}; if(!state.supps[d]){ state.supps[d]=true; changed++; } });
  (doc.savedWorkouts||[]).forEach(sw=>{
    if(!state.savedWorkouts) state.savedWorkouts = [];
    if(sw && sw.id && !state.savedWorkouts.some(x=>x.id===sw.id)){ state.savedWorkouts.push(sw); changed++; }
  });
  (doc.custom||[]).forEach(c=>{ if(!state.custom) state.custom=[]; if(c && c.name && !state.custom.some(x=>x.name===c.name)){ state.custom.push(c); changed++; } });
  return changed;
}
async function pollRemoteSync(){
  if(location.protocol === "file:") return;
  try{
    const r = await fetch("sync.json?_="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const doc = await r.json();
    if(doc.ts && state.syncSeenTs && doc.ts <= state.syncSeenTs) return;
    const n = mergeSyncDoc(doc);
    state.syncSeenTs = doc.ts || 0;
    saveState();
    if(n){ refreshTabs(); toast("Synced "+n+" update"+(n===1?"":"s")+" from your other device \u2713"); }
  }catch(err){}
}
let _syncT = null, _pushing = false, _lastPushHash = "";
function queueSync(){ clearTimeout(_syncT); _syncT = setTimeout(pushSync, 4000); }
async function pushSync(){
  const tok = syncToken();
  if(!tok || location.protocol === "file:" || _pushing) return;
  const doc = buildSyncDoc();
  const payload = JSON.stringify(doc);
  if(payload === _lastPushHash) return;
  _pushing = true;
  try{
    const api = "https://api.github.com/repos/"+SYNC_REPO+"/contents/sync.json";
    const H = {"Authorization":"Bearer "+tok, "Accept":"application/vnd.github+json"};
    let sha = null;
    try{ const g = await fetch(api+"?ref=main&_="+Date.now(), {headers:H}); if(g.ok) sha = (await g.json()).sha; }catch(e2){}
    doc.ts = Date.now();
    const body = {message:"hub sync", branch:"main",
      content: btoa(unescape(encodeURIComponent(JSON.stringify(doc))))};
    if(sha) body.sha = sha;
    const r = await fetch(api, {method:"PUT", headers:{...H, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.ok){ _lastPushHash = payload; state.syncSeenTs = doc.ts; try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e3){} }
  }catch(err){}
  _pushing = false;
}

/* ================= INIT ================= */
function applyHistoryRestore(){
  /* puts back the exercises he did before the Aug 6 fresh start (deleted then, restored on request).
     Merges into The Rec history by exercise+date; never duplicates; banned exercises stay out. */
  if(state.oldHistRestored) return;
  const src = DB.restoreHistories || {};
  const banned = (DB.muscleRef && DB.muscleRef.banned_exercises) || [];
  if(!state.histories.rec) state.histories.rec = {};
  let added = 0;
  Object.keys(src).forEach(name=>{
    if(banned.includes(name)) return;
    (src[name]||[]).forEach(h=>{
      const inRec = (state.histories.rec[name]||[]).some(x=>x.date===h.date);
      const inEos = ((state.histories.eos||{})[name]||[]).some(x=>x.date===h.date);
      if(inRec || inEos) return;
      if(!state.histories.rec[name]) state.histories.rec[name] = [];
      state.histories.rec[name].push({date:h.date, time:h.time||null, sets:h.sets||[], warmup:h.warmup||[],
        est1rm:h.est_1rm!=null?h.est_1rm:(h.est1rm||null), note:h.note||null, badge:h.badge||null});
      added++;
    });
    if(state.histories.rec[name]) state.histories.rec[name].sort((a,b)=>b.date.localeCompare(a.date));
  });
  state.oldHistRestored = true;
  if(added){ saveState(); setTimeout(()=>toast("Restored "+added+" past sessions from before the fresh start \u2713"), 900); }
  else saveState();
}
function applyFoodSeed(){
  const j = DB.seedFood;
  if(!j || !Array.isArray(j.entries)) return;
  if(j.ts && state.foodRemoteTs && j.ts <= state.foodRemoteTs) return;
  j.entries.forEach(e=>{
    if(!e || !e.date) return;
    if(!(state.food||[]).some(x=>x.date===e.date)){
      state.food = state.food||[]; state.food.push(e);
    }
  });
  (j.runs||[]).forEach(r=>{
    if(!r || !r.date) return;
    if(!state.runs) state.runs = [];
    const key = r.date+"|"+(r.name||"Run")+"|"+(r.time||0);
    if(!state.runs.some(x=>(x.date+"|"+(x.name||"Run")+"|"+(x.time||0))===key)){
      state.runs.unshift({date:r.date, type:r.type||"easy", name:r.name||"Run",
        time:r.time!=null?r.time:null, dist:r.dist!=null?r.dist:null,
        pace:r.pace!=null?r.pace:null, kcal:r.kcal!=null?r.kcal:null, loggedAt:"synced"});
    }
  });
  if(j.ts && (!state.foodRemoteTs || j.ts > state.foodRemoteTs)) state.foodRemoteTs = j.ts;
  saveState();
}
let _rsT = null;
window.addEventListener("resize", ()=>{
  clearTimeout(_rsT);
  _rsT = setTimeout(()=>{ const d = $("scr-dash"); if(d && d.classList.contains("active")) renderDash(); }, 180);
});
applyHistoryRestore();
applyFoodSeed();
applySeeds();
pollRemoteFood();
pollRemoteSync();
setInterval(pollRemoteSync, 5*60*1000);
window.addEventListener("focus", ()=>{ pollRemoteSync(); pollRemoteFood(); });
renderWorkout(); renderBody(); renderTargets(); renderDash();
switchTab(window.innerWidth >= 760 ? "dash" : "gate");
</script>
